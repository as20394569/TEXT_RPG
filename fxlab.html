<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>特效工作室・蒼藍誓約</title>
<style>
:root{--bg:#0d0d10;--pn:#17171c;--ln:#2a2a33;--tx:#e8e6ea;--sub:#9a98a3;--gd:#e6c27a;--ac:#7fc8ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
#gw{position:relative;flex:0 0 56%;min-height:0;background:#000}
#g{width:100%;height:100%;border:0;display:block}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(0,0,0,.85);color:var(--sub)}
#msg[hidden]{display:none}
#pn{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--pn);border-top:1px solid var(--ln)}
.bar{display:flex;gap:6px;padding:8px 10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
.bar b{color:var(--gd);font-size:15px;margin-right:auto}
select,button{font:inherit;color:var(--tx);background:#22222a;border:1px solid var(--ln);border-radius:8px;padding:6px 9px}
button{cursor:pointer}button:active{transform:scale(.97)}
button.on{background:var(--gd);color:#1a1408;border-color:var(--gd);font-weight:700}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px;color:var(--sub)}.tabs button.on{color:var(--gd);background:none;border-bottom:2px solid var(--gd)}
#list{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;align-content:start}
#list button{text-align:left;padding:8px;line-height:1.25}#list button small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
#list button.cur{outline:2px solid var(--ac)}
#list .hd{grid-column:1/-1;color:var(--sub);font-size:12px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;padding:6px 9px}
@media (min-width:820px){#app{flex-direction:row}#gw{flex:0 0 420px}#pn{border-top:0;border-left:1px solid var(--ln)}}
</style></head><body>
<div id="app">
  <div id="gw"><iframe id="g" src="index.html?fxlab=1"></iframe><div id="msg">載入中…</div></div>
  <div id="pn">
    <div class="bar"><b>特效工作室</b>
      <select id="cls"></select>
      <select id="area"></select>
      <span class="seg" id="nf"><button data-n="1">1隻</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4" class="on">4</button></span>
    </div>
    <div class="bar">
      <span class="seg" id="spd"><button data-s="1" class="on">×1</button><button data-s="0.5">×0.5</button><button data-s="0.25">×0.25</button><button data-s="0.1">×0.1</button></span>
      <button id="loop">循環</button><button id="snd" class="on">音效</button><button id="frz" class="on">敵人不動</button><button id="again">重播</button>
    </div>
    <div class="tabs"><button data-t="sk" class="on">技能</button><button data-t="st">狀態</button><button data-t="all">全部職業</button></div>
    <div id="list"></div>
  </div>
</div>
<script>
const CL=[['swordsman','','劍士'],['mage','','法師'],['ranger','','遊俠'],['cleric','','神官'],['swordsman','knight','騎士'],['swordsman','berserker','狂戰士'],['mage','archmage','大魔導士'],['mage','warlock','咒術師'],['ranger','sniper','神射手'],['ranger','assassin','刺客'],['cleric','bishop','主教'],['cleric','templar','聖殿騎士'],['swordsman','dual','雙劍士']];
const JP={swordsman:'J01',mage:'J02',ranger:'J03',cleric:'J04',knight:'J05',berserker:'J06',archmage:'J07',warlock:'J08',sniper:'J09',assassin:'J10',bishop:'J11',templar:'J12',dual:'J13'};
const $=s=>document.querySelector(s),G=$('#g');let L=null,tab='sk',last=null,loopT=0,ready=false,ci=0,nf=4,spd=1;const tgtOn={who:'foe'};
/* 在遊戲頁的全域範圍裡建立控制器（才拿得到遊戲內的變數） */
const HOOK=`window.LAB={
 gm(){return FXLAB},
 areas(){return AREAS.map(a=>a.n)},
 setup(base,adv,a,nf){const m=document.getElementById('maint');if(m)m.remove();MAINT=false;B=null;RUN=null;MODAL=null;STORY=null;const _t=toast,_s=sys;toast=()=>{};sys=()=>{};try{newGame('工作室',base,'m');if(adv)S.adv=adv;S.tut=Object.fromEntries(Object.keys(TIPS).map(k=>[k,1]));
   while(S.lv<60)gainExp(need(S.lv));learn(true)}finally{toast=_t;sys=_s}for(let i=0;i<10;i++)S.cleared[i]=1;S.party=null;TAB='adv';startRun(a);RUN.step=1;const mb=AREAS[a].mobs;startBattle(mb[0],'',0);for(let i=1;i<nf;i++)addFoe7(mb[i%mb.length],'',{});grpDone7(false);B.auto=false;MODAL=null;render()},
 hold(frz){if(!B)return 'none';if(frz){B.rtg=0;B.rtw=null;(B.adds||[]).forEach(f=>{f.rtg=0;f.rtw=null});if(B.rt){B.rt.pg=0;B.rt.q=null}}B.hp=B.max;(B.adds||[]).forEach(f=>f.hp=f.max);try{const s=rtS();S.hp=s.HP;S.mp=s.MP}catch(e){}if(MODAL)MODAL=null;return B.rt&&B.rt.done?'done':'ok'},
 skills(j){return Object.values(SK).filter(x=>x.id.startsWith(j)&&x.act).sort((a,b)=>+a.id.split('S')[1]-+b.id.split('S')[1]).map(x=>({id:x.id,n:x.n,tg:x.tg,tags:String(x.tags||''),dmg:!!x.dmg}))},
 mute(m){MUTE=m},
 sk(k){const x=SK[k];try{rtName(x.n,'#ecd08a')}catch(e){}PFX.me({by:'me',skill:k,d:100})},
 sts(){const V=FX7V.STV;return Object.keys(V).filter(k=>!V[k].quiet).map(k=>({id:k,n:(STX[k]&&STX[k].n)||k,c:V[k].c,good:!!V[k].good}))},
 st(id,who){const t=who==='me'?'p':B;stClear(t,id);stAdd(t,id,{src:{atk:80,mag:80},dur:6,amt:300})},
 tick(){stTick(B);stTick('p')},
 clear(){stClear(B);stClear('p');(B.adds||[]).forEach(a=>stClear(a))}};true`;
function ok(){try{return !!(G.contentWindow.LAB)}catch(e){return false}}
function setup(){if(!L)return;if(!L.gm()){$('#msg').hidden=false;$('#msg').innerHTML='這台裝置還沒開管理員權限。<br>先用管理員連結開一次遊戲，再回來這頁。';return}
  try{const [base,adv]=CL[ci];L.setup(base,adv,+$('#area').value,nf);$('#msg').hidden=true;ready=true}catch(e){$('#msg').hidden=false;$('#msg').textContent='開場失敗：'+e}}
setInterval(()=>{if(!ready||!L)return;try{if(L.hold($('#frz').classList.contains('on'))==='done')setup()}catch(e){}},120);
const snd=()=>{try{L.mute(!$('#snd').classList.contains('on'))}catch(e){}};
function act(a){last=a;snd();try{a()}catch(e){console.warn(e)}schedule()}
function schedule(){clearTimeout(loopT);if($('#loop').classList.contains('on')&&last)loopT=setTimeout(()=>{try{last()}catch(e){}schedule()},Math.max(1600,2200/spd))}
function cur(b){$('#list').querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));b.classList.add('cur')}
function draw(){const Lt=$('#list');Lt.innerHTML='';if(!L)return;
  if(tab==='sk'){const j=CL[ci][1]||CL[ci][0];L.skills(JP[j]).forEach(x=>{const b=document.createElement('button');const tg=x.tg&&x.tg!=='單體'&&x.tg!=='無'&&x.tg!=='自身'?x.tg+'・':'';b.innerHTML=`${x.n}<small>${tg}${x.tags.replace(/直接傷害,?/,'')||(x.dmg?'傷害':'—')}</small>`;b.onclick=()=>{cur(b);act(()=>L.sk(x.id))};Lt.appendChild(b)})}
  else if(tab==='st'){const hd=document.createElement('div');hd.className='hd';hd.innerHTML='套在：<span class="seg"><button id="tf">敵人</button><button id="tm">自己</button></span>　<button id="tk">跳一次傷害</button>　<button id="tc">清除</button>';Lt.appendChild(hd);
    const sw=who=>{tgtOn.who=who;$('#tf').classList.toggle('on',who==='foe');$('#tm').classList.toggle('on',who==='me')};$('#tf').onclick=()=>sw('foe');$('#tm').onclick=()=>sw('me');sw(tgtOn.who);
    $('#tk').onclick=()=>act(()=>L.tick());$('#tc').onclick=()=>{try{L.clear()}catch(e){}};const all=L.sts();
    for(const [title,good] of [['減益',false],['增益',true]]){const h=document.createElement('div');h.className='hd';h.textContent=title;Lt.appendChild(h);
      all.filter(x=>x.good===good).forEach(x=>{const b=document.createElement('button');b.innerHTML=`<span style="color:${x.c}">●</span> ${x.n}<small>${x.id}</small>`;b.onclick=()=>{cur(b);const who=tgtOn.who;act(()=>L.st(x.id,who))};Lt.appendChild(b)})}}
  else{CL.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c[2];if(i===ci)b.classList.add('cur');b.onclick=()=>{ci=i;$('#cls').value=i;setup();tab='sk';tabs();draw()};Lt.appendChild(b)})}}
function tabs(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
CL.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c[2];$('#cls').appendChild(o)});
$('#cls').onchange=e=>{ci=+e.target.value;setup();draw()};$('#area').onchange=()=>setup();
document.querySelectorAll('#nf button').forEach(b=>b.onclick=()=>{nf=+b.dataset.n;document.querySelectorAll('#nf button').forEach(x=>x.classList.toggle('on',x===b));setup()});
document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{spd=+b.dataset.s;try{G.contentWindow.FXSPD=spd}catch(e){}document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b));schedule()});
['loop','snd','frz'].forEach(id=>$('#'+id).onclick=()=>{$('#'+id).classList.toggle('on');snd();schedule()});
$('#again').onclick=()=>{if(last)act(last)};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;tabs();draw()});
G.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{const W=G.contentWindow;let good=false;try{good=!!W.eval('typeof PFX!=="undefined"&&!!PFX.kit&&typeof FX7V!=="undefined"')}catch(e){}
  if(good){clearInterval(t);try{W.eval(HOOK)}catch(e){$('#msg').textContent='無法連上遊戲：'+e;return}L=W.LAB;L.areas().forEach((nm,i)=>{const o=document.createElement('option');o.value=i;o.textContent=nm;$('#area').appendChild(o)});$('#area').value=3;W.FXSPD=spd;setTimeout(()=>{setup();draw()},300)}
  else if(++n>80){clearInterval(t);$('#msg').textContent='遊戲載入失敗，請重新整理。'}},250)});
</script></body></html>
