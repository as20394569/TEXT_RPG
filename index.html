<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e0e10"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蒼藍誓約 Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面：直式單欄。上 HUD、世界頻道、中央捲動區、下方五格導覽。日式線上 RPG 的象牙面板加金棕框線。 */
  --sky:#6e8fb4; --paper:#d9ceb4; --panel:#ece3cd; --panel2:#d8c9a4;
  --line:#86622c; --ink:#241f38; --sub:#5d5570;
  --navy:#1a2344; --navy2:#2b3a6e; --gold:#e0b03e;
  --hp:#dc4b4b; --mp:#3d82d6; --exp:#58a84a;
  --r0:#77717f; --r1:#3c9a4a; --r2:#2f7fd0; --r3:#9a4fd0; --r4:#dc8413;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --hd:#27345f; --card:#f3ecda; --btn1:#fffdf5; --warn:#b06a00; --bad:#c0262d; --dim:#8a7a5a; --dk:#5a4a3a; --shade:rgba(86,60,20,.25);
  color-scheme:light;
}
/* 配色主題：html[data-th] 覆寫變數。現在只留墨黑 */
html[data-th=ink]{--sky:#26262b;--paper:#17171a;--panel:#26262c;--panel2:#33333b;--line:#6b5a36;--ink:#ece9e2;--sub:#a39f96;--navy:#0e0e10;--navy2:#1f1f24;--gold:#d9ae4c;--hd:#ecd08a;--card:#2e2e35;--btn1:#3e3e47;--warn:#ffc978;--bad:#ff8a8a;--dim:#aaa59a;--dk:#cfc9bb;--shade:rgba(0,0,0,.45);--r0:#aab0c4;--r1:#6fd27c;--r2:#6fb4ff;--r3:#c58cff;--r4:#ffb04a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(var(--sky),var(--paper) 38%);overflow:hidden}

/* HUD */
#hud{display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(var(--navy2),var(--navy));color:#fff;border-bottom:2px solid var(--gold)}
.ava{width:52px;height:52px;flex:none;border:2px solid var(--gold);border-radius:8px;overflow:hidden}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hud-n{display:flex;gap:6px;align-items:baseline;font-size:11px;white-space:nowrap;overflow:hidden}
.hud-n b{font-family:var(--display);font-size:14px;color:var(--gold)}
.hud-n .pw{margin-left:auto;color:#ffe9a8}
.hud-r{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:11px;font-variant-numeric:tabular-nums}
.cur{padding:0 6px;border-radius:9px;background:rgba(0,0,0,.28);white-space:nowrap}
.cur.g{color:#ffe08a}.cur.d{color:#a8e4ff}
.set{font-size:11px;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 6px}
.bar{position:relative;height:11px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .3s}
.bar.hp i{background:linear-gradient(#ff8a7a,var(--hp));color:#2c2742}.bar.mp i{background:linear-gradient(#8cc0ff,var(--mp))}.bar.exp i{background:linear-gradient(#a6e08f,var(--exp))}
.bar span{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;color:#fff;text-shadow:0 0 2px #000;font-variant-numeric:tabular-nums}
.bar.exp{height:6px}.bar.exp span{display:none}
.bar.lg{height:16px;background:#cfc3a3;color:#2c2742}.bar.lg span{line-height:16px;font-size:11px}

#chat{height:24px;line-height:24px;padding:0 10px;font-size:12px;background:var(--navy2);color:#e8ecff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat b{color:var(--gold);font-weight:500}#chat .sys{color:#ffb3a3}
#chat span{display:inline-block;animation:slide .35s}
@keyframes slide{from{transform:translateY(100%);opacity:0}}

#main{flex:1;overflow-y:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:12px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(var(--navy2),var(--navy));border-top:2px solid var(--gold)}
#nav button{position:relative;padding:7px 0 8px;color:#c6cdea;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{display:grid;place-items:center;width:40px;height:28px;border-radius:14px}
#nav button i svg{width:22px;height:22px}
#nav button.on{color:var(--gold)}#nav button.on i{background:rgba(240,194,75,.18)}
.ico svg{width:22px;height:22px}
#nav .dot{position:absolute;top:5px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hp)}
.pre #hud,.pre #chat,.pre #nav{display:none}.nohud #hud{display:none}

/* 共用 */
h2{font-family:var(--display);font-size:18px;color:var(--hd);text-wrap:balance}
h3{font-family:var(--display);font-size:16px;color:var(--hd)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 2px 0 var(--shade);display:flex;flex-direction:column;gap:8px}
.panel>h3{border-bottom:1px dashed var(--line);padding-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row>.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12px}
.btn{padding:8px 12px;border-radius:8px;border:2px solid var(--line);background:linear-gradient(var(--btn1),var(--panel2));font-weight:700;color:var(--hd);box-shadow:0 2px 0 var(--shade);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:linear-gradient(var(--navy2),var(--navy));color:var(--gold);border-color:var(--gold)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.big{padding:12px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:7px 0;border-radius:8px 8px 0 0;border:2px solid var(--line);border-bottom:none;background:var(--panel2);font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--panel);color:var(--hd)}
.tabs+.panel{border-top-left-radius:0;border-top-right-radius:0;margin-top:-12px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:var(--navy);color:var(--gold);white-space:nowrap}
.tag.red{background:var(--hp);color:#fff}.tag.ok{background:var(--exp);color:#fff}.tag.off{background:#b9b2a2;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.dup{display:block;font-size:11px;font-weight:700;color:#1f8a4c}.drop .deq{flex:none;position:relative;z-index:2}.drop .deq.done{background:#cfc6b4;color:#5a4a3a;border-color:#cfc6b4}
.drops{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}.drop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid currentColor;background:rgba(255,255,255,.75);position:relative;overflow:hidden;animation:dropIn .5s cubic-bezier(.2,1.6,.4,1) both;color:#2c2742}.drop.d3{color:var(--r3);box-shadow:0 0 12px rgba(180,110,255,.45)}.drop.d4{color:var(--r4);box-shadow:0 0 16px rgba(255,200,60,.6)}.drop.shn{color:#1593b3;box-shadow:0 0 14px rgba(60,200,240,.6)}.drop.shn b{color:#1593b3}.drop .grow{display:flex;flex-direction:column}.drop .sub{color:var(--sub);font-size:.85em}.drop::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:dropShine 1.6s .4s ease-out 2;color:#2c2742}@keyframes dropIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}@keyframes dropShine{to{transform:translateX(120%)}}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}.c4{color:var(--r4)}
.ico{flex:none;width:38px;height:38px;border-radius:8px;border:2px solid currentColor;background:var(--card);font-family:var(--display);font-size:17px;display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:left;width:100%}
.item .grow{flex:1;min-width:0}.item b{display:block}.item .sub{display:block}
.empty{text-align:center;color:var(--sub);padding:18px 0}


/* 角色頁：科技感介面（只作用在 .cyb 內） */
.cyb{--cy:#4fe3ff;--cy2:rgba(79,227,255,.22);display:flex;flex-direction:column;gap:12px}
.cyb .panel,.cy-hero{position:relative;border:1px solid var(--cy2);border-radius:2px;background:linear-gradient(160deg,rgba(79,227,255,.07),transparent 40%),#15161b;box-shadow:none;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.cyb .panel::before,.cy-hero::before{content:'';position:absolute;left:0;top:0;width:44px;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.cyb .panel::after,.cy-hero::after{content:'';position:absolute;right:0;bottom:0;width:26px;height:2px;background:var(--gold)}
.cyb .panel>h3{font-size:15px;letter-spacing:.14em;color:#eaf9ff;padding-left:10px;border-left:3px solid var(--cy)}
.cyb .gsec{border:1px solid var(--cy2);border-radius:2px;background:rgba(79,227,255,.04)}
.cyb .item{border-radius:2px}
.cy-hero{padding:12px;display:grid;grid-template-columns:40% 1fr;gap:10px 12px;background:repeating-linear-gradient(0deg,rgba(79,227,255,.05) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(79,227,255,.05) 0 1px,transparent 1px 22px),linear-gradient(160deg,#1a2230,#101116 60%)}
.cy-pt{position:relative;border:1px solid var(--cy2);background:radial-gradient(ellipse at 50% 100%,rgba(79,227,255,.28),transparent 62%);overflow:hidden}
.cy-pt{display:flex;align-items:flex-end}.cy-pt .art{border:0;background:none;border-radius:0;width:100%}.cyb .party .btn{display:flex;flex-direction:column;align-items:center;white-space:normal;border-radius:2px}
.cy-pt::before,.cy-pt::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--cy);z-index:2}
.cy-pt::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.cy-pt::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.cy-pt em{position:absolute;left:0;right:0;top:0;height:34%;background:linear-gradient(rgba(79,227,255,0),rgba(79,227,255,.16) 85%,rgba(79,227,255,.75));animation:cyScan 3.6s linear infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes cyScan{0%{transform:translateY(-110%)}100%{transform:translateY(310%)}}
.cy-id{display:flex;flex-direction:column;gap:4px;min-width:0}
.cy-tag{font:700 9px/1 monospace;letter-spacing:.18em;color:var(--cy);opacity:.85}
.cy-id h3{font-size:22px;color:#fff;letter-spacing:.06em;text-shadow:0 0 12px rgba(79,227,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cy-cls{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.cy-cls>b{color:#101116;background:var(--cy);padding:1px 8px;font-size:12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.cy-cls span b{font:900 20px var(--display);color:var(--gold)}
.cy-pw{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--cy2);border-bottom:1px solid var(--cy2);padding:3px 0}
.cy-pw span{font-size:10px;letter-spacing:.14em;color:var(--sub)}.cy-pw b{font:900 24px var(--display);color:var(--gold);text-shadow:0 0 10px rgba(232,188,78,.45);font-variant-numeric:tabular-nums}
.cy-radar{width:100%;max-height:140px}.cy-radar .g{fill:none;stroke:rgba(79,227,255,.22);stroke-width:.6}.cy-radar .v{fill:rgba(79,227,255,.22);stroke:var(--cy);stroke-width:1.4;filter:drop-shadow(0 0 3px var(--cy))}.cy-radar .d{fill:#fff}.cy-radar text{font-size:8px;fill:#9fdcf0;text-anchor:middle}
.cy-bars{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.cy-g{display:grid;grid-template-columns:30px 1fr 92px;gap:8px;align-items:center;font:700 10px/1 monospace;color:var(--sub)}
.cy-g i{height:8px;background:rgba(255,255,255,.07);transform:skewX(-24deg);overflow:hidden}.cy-g u{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.45) 9px 11px)}
.cy-g.hp{--c:#ff5d6c}.cy-g.mp{--c:#4f9bff}.cy-g.exp{--c:#5fe08a}
.cy-g b{text-align:right;color:#fff;font-size:12px;font-variant-numeric:tabular-nums}.cy-g small{color:var(--sub);font-weight:400}
.cy-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cy-c{padding:5px 6px 6px;border:1px solid var(--cy2);border-left:2px solid var(--cy);background:rgba(79,227,255,.05);display:flex;flex-direction:column;gap:1px;min-width:0}
.cy-c span{font-size:10px;color:var(--sub);white-space:nowrap}.cy-c b{font:900 17px var(--display);color:#fff;font-variant-numeric:tabular-nums}
.cy-c.main{border-left-color:var(--gold);background:rgba(232,188,78,.09)}.cy-c.main b{color:var(--gold)}
.cy-res{grid-column:1/-1;display:flex;gap:6px;font-size:11px;color:var(--sub)}.cy-res span{flex:1;text-align:center;border:1px solid var(--cy2);padding:2px 0}
.cy-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}.cy-tabs button{padding:7px 0;font:700 13px var(--display);letter-spacing:.08em;color:var(--sub);background:#15161b;border:1px solid var(--cy2);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}.cy-tabs button.on{color:#101116;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.cyb .cy-sk{padding:5px 8px;gap:8px}.cyb .cy-sk .ico{width:34px;height:34px}.cyb .cy-sk:not(.open) .grow .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cyb .cy-sk:not(.open) .grow .sub~.sub{display:none}.cyb .cy-sk .grow{min-width:0;cursor:pointer}.cyb .list{gap:5px}
.cy-k{font:700 10px monospace;color:var(--cy);letter-spacing:.08em;margin-right:2px}
.cy-ab{position:relative;height:6px;margin:2px 0 6px;background:rgba(255,255,255,.07);transform:skewX(-24deg)}.cy-ab u{display:block;height:100%;background:linear-gradient(90deg,#2a8fd0,var(--cy));box-shadow:0 0 6px var(--cy)}.cy-ab s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
@media (prefers-reduced-motion:reduce){.cy-pt em{display:none}}
/* 插畫預留位 */
.art{position:relative;overflow:hidden;border-radius:8px;border:2px dashed var(--line);background:repeating-linear-gradient(45deg,#efe2bd 0 10px,#f7edd2 10px 20px);width:100%;color:#2c2742}
.art.r169{aspect-ratio:16/9}.art.r34{aspect-ratio:3/4}.art.r11{aspect-ratio:1/1}
.art-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px;color:var(--dk)}
.art-ph em{font-style:normal;font-size:10px;padding:0 6px;border:1px solid currentColor;border-radius:8px}
.art-ph b{font-family:var(--display);font-size:14px}
.art-ph i{font-style:normal;font-size:10px;font-family:ui-monospace,Menlo,monospace;opacity:.8;word-break:break-all}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art img.under{z-index:0}.art.has img.under{display:none}.art img:not(.under){z-index:1}
.art.mini img{object-position:50% 12%}
.art.mini{border:none;border-radius:0;height:100%}.art.mini em,.art.mini i{display:none}.art.mini b{font-size:11px}

/* 標題 */
.title{display:flex;flex-direction:column;gap:12px}
.title h1{font-family:var(--display);font-weight:900;font-size:34px;color:var(--hd);letter-spacing:.12em;text-align:center}
.title .en{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--sub)}
.title label,.lbl{font-weight:700;color:var(--hd);font-size:13px}
input,textarea{font:inherit;width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cls-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.cls-grid .cls b{font-size:12px;white-space:nowrap}.cls-grid .ex{font-size:9px;color:#101116;background:#4fe3ff;padding:0 3px;margin-left:2px;font-weight:900}
.cls{border:2px solid transparent;border-radius:10px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:13px}
.cls .art i,.cls .art em{display:none}
.cls.on{border-color:var(--hd);background:var(--panel2)}

/* 城鎮 */
.banner{position:relative}.banner .cap{position:absolute;left:8px;bottom:8px;background:rgba(28,28,33,.88);color:#fff;padding:2px 10px;border-radius:6px;font-family:var(--display)}
.banner .cap small{font-family:var(--body);color:var(--gold);margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fac{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;box-shadow:0 2px 0 var(--shade)}
.fac .pt{width:44px;height:58px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fac b{display:block;font-family:var(--display);color:var(--hd)}.fac span{font-size:11px;color:var(--sub)}

/* 冒險 */
.area{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.area.lock{opacity:.55}
.pips{display:flex;gap:6px;justify-content:center}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:11px;color:var(--sub)}
.pip.done{background:var(--exp);border-color:var(--exp);color:#fff}.pip.now{background:var(--gold);color:var(--hd);font-weight:700}
.pip.boss{border-color:var(--hp);color:var(--hp)}
.die{width:84px;height:84px;margin:4px auto;border-radius:16px;border:3px solid var(--navy);background:var(--card);font-family:var(--display);font-weight:900;font-size:38px;display:grid;place-items:center;color:var(--hd);box-shadow:0 4px 0 var(--navy)}
.die.ok{border-color:var(--exp);color:var(--exp);box-shadow:0 4px 0 var(--exp)}.die.ng{border-color:var(--hp);color:var(--hp);box-shadow:0 4px 0 var(--hp)}
.calc{text-align:center;font-variant-numeric:tabular-nums}
.opt{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;white-space:normal}

/* 戰鬥 */
.battle{display:flex;flex-direction:column;gap:8px}
.stage{position:relative;height:clamp(230px,52vh,440px);border:2px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(#bfe6fb 0 55%,#9ed27f 55%)}
.stage.bg-forest{background:linear-gradient(#5b6f8f 0 50%,#3f6b4a 50%)}
.stage.bg-mine{background:linear-gradient(#3b3440 0 50%,#6b5847 50%)}
.stage.bg-snow{background:linear-gradient(#cfe3f5 0 52%,#f4f8fc 52%);color:#2c2742}
.stage.bg-castle{background:linear-gradient(#2a1838 0 52%,#4a2740 52%)}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spr{position:absolute}
.spr.foe{right:7%;top:9%;width:38%}
.spr.foe.szs{right:2%;top:5%;width:50%}.spr.foe.szm{right:4%;top:7%;width:44%}
.spr.me{left:4%;bottom:2%;width:40%}
.plat{position:absolute;left:-12%;right:-12%;bottom:-8px;height:26px;border-radius:50%;background:rgba(0,0,0,.22)}
.ibox{position:absolute;background:var(--panel);border:2px solid var(--navy);border-radius:8px 2px 8px 2px;padding:4px 8px;font-size:12px;box-shadow:2px 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;gap:3px}

#rtb{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;color:#ece9e2;background:radial-gradient(ellipse at 50% 0%,#34343b 0%,#18181c 46%,#0a0a0c 100%);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#rtb #xhd .hr{display:flex;align-items:center;gap:4px;flex:none}
#rtb #xhd .hr a{display:flex;align-items:center;padding:3px 8px;border-radius:12px;font-size:11.5px;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#e6e2d8}

#rtb #xfield{flex:1 1 auto;min-height:180px;position:relative;overflow:hidden}
#rtb #xscene{position:absolute;inset:0;pointer-events:none}
#rtb #xscene img{width:100%;height:100%;object-fit:cover;filter:brightness(.5) saturate(.75) contrast(1.05);opacity:.9}
#rtb #xmist{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,0) 26%,rgba(10,10,12,0) 52%,rgba(10,10,12,.9) 100%)}
#rtb #xew{position:absolute;left:6px;right:6px;bottom:10px;display:flex;justify-content:center;align-items:flex-end;gap:6px;z-index:2}
#rtb .bec{position:relative;min-width:0;flex:0 0 25%;height:clamp(108px,17vh,140px);cursor:pointer;display:flex;flex-direction:column;overflow:visible;transition:transform .15s,opacity .4s,filter .4s}

#rtb #xew:has(.bec:nth-child(4)){gap:3px;left:3px;right:3px}#rtb #xew:has(.bec:nth-child(4)) .bec{flex-basis:21.5%}#rtb #xew:has(.bec:nth-child(4)) .bec.big{flex-basis:33%}#rtb #xew:has(.bec:nth-child(4)) .bec .en{font-size:11px}
#rtb .bec .ecbg{position:absolute;inset:0;z-index:0;background:linear-gradient(165deg,rgba(58,54,64,.72),rgba(16,16,20,.88));border:1px solid rgba(255,255,255,.16);border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}

#rtb .bec .ehd{display:flex;align-items:baseline;gap:4px;padding:5px 7px 0;white-space:nowrap;overflow:hidden}
#rtb .bec .rk{font-size:9px;letter-spacing:-.05em;color:var(--hd,#ecd08a)}
#rtb .bec .en{font-weight:900;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;color:#fff}

#rtb .bec .elv{font-size:10px;flex:none;background:rgba(255,255,255,.14);padding:0 5px;border-radius:6px}
#rtb .bec .eart{flex:1;position:relative;display:grid;place-items:center;min-height:0}
#rtb .bec .eart>.art{position:absolute;inset:2px 6px;width:auto;height:auto;aspect-ratio:auto;border:0;border-radius:0;background:none;overflow:visible;animation:none}

#rtb .bec .xrg{--p:0;grid-area:1/1;position:absolute;right:4px;top:2px;width:38px;height:38px;border-radius:50%;background:conic-gradient(#ecd08a calc(var(--p)*1%),rgba(255,255,255,.16) 0);-webkit-mask:radial-gradient(circle,transparent 52%,#000 55%);mask:radial-gradient(circle,transparent 52%,#000 55%);filter:drop-shadow(0 0 3px rgba(236,208,138,.7))}
#rtb .bec .cnt::before{content:'';position:absolute;inset:9px;border-radius:50%;background:rgba(0,0,0,.6);z-index:-1}#rtb .bec.big .cnt::before{inset:12px}#rtb .bec .cnt:empty::before{display:none}
#rtb .bec.big .xrg{width:50px;height:50px}
#rtb .bec .cnt{position:absolute;right:4px;top:2px;width:38px;height:38px;z-index:1;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
#rtb .bec.big .cnt{width:50px;height:50px;font-size:13px}
#rtb .bec.wind .xrg{background:conic-gradient(#ff4d6d calc(var(--p)*1%),rgba(255,77,109,.18) 0);filter:drop-shadow(0 0 8px #ff4d6d)}
#rtb .bec.wind .cnt{color:#ffc2cc}
#rtb .bec.wind .ecbg{border-color:#ff4d6d;box-shadow:0 0 20px rgba(255,77,109,.5)}
#rtb .bec.soon .xrg{animation:rtsoon .5s infinite alternate}
@keyframes rtsoon{to{filter:brightness(1.5) drop-shadow(0 0 6px #ecd08a)}}
#rtb .bec .eflash{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:14px;background:radial-gradient(circle,#fff,transparent 70%)}
#rtb .bec .xint{position:absolute!important;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:900;padding:1px 9px;border-radius:10px;z-index:4!important;display:none;color:#fff;background:linear-gradient(90deg,#d8344f,#e87a3c);box-shadow:0 0 10px rgba(255,77,109,.6)}
#rtb .bec.wind .xint{display:block;animation:rtintp .35s infinite alternate}
#rtb .bec .xint i{font-style:normal;margin-right:4px;padding:0 4px;border-radius:6px;font-size:10px;background:#6b45d8}
@keyframes rtintp{to{transform:translateX(-50%) scale(1.07)}}
#rtb .bec .sts{position:absolute!important;left:5px;top:26px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;pointer-events:none}
#rtb .bec .sts b{font-size:9.5px;line-height:14px;padding:0 4px;border-radius:5px;background:rgba(0,0,0,.6);color:#ffc2cc;font-weight:700;white-space:nowrap}
#rtb .bec .sts b.g{color:#ecd08a}#rtb .bec .sts b.w{color:#9fe3a8}
#rtb .bec .ehpr{display:flex;justify-content:flex-end;padding:0 7px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
#rtb .bec.big .ehpr{font-size:13px}
#rtb .bec .eb{padding:2px 7px 7px;display:flex;flex-direction:column;gap:3px}
#rtb .bec .eb>div{position:relative;overflow:hidden;border-radius:5px;background:rgba(255,255,255,.1)}
#rtb .bec .b1{height:7px}#rtb .bec.big .b1{height:10px}
#rtb .bec .b1 i,#rtb .bec .b1 u{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px}
#rtb .bec .b1 i{background:linear-gradient(90deg,#d8344f,#f08a5d);transition:width .12s}
#rtb .bec .b1 u{background:rgba(255,255,255,.55);transition:width .7s .25s}
#rtb .bec .b2{height:4px;display:none}#rtb .bec .b2.on{display:block}
#rtb .bec .b2 i{display:block;height:100%;background:#ecd08a;box-shadow:0 0 6px #ecd08a}
#rtb .bec.focus .ecbg{border-color:var(--gold,#d9ae4c)}
#rtb .bec.hit{animation:rtehit .22s}
#rtb .bec.hitc{animation:rtehitc .32s}
#rtb .bec.hit .eflash,#rtb .bec.hitc .eflash{animation:rtefl .18s}
@keyframes rtehit{30%{transform:translate(5px,-2px) scale(.98)}100%{transform:none}}
@keyframes rtehitc{20%{transform:translate(9px,-4px) rotate(2deg) scale(.95)}60%{transform:translate(-3px,1px)}100%{transform:none}}
@keyframes rtefl{from{opacity:.85}to{opacity:0}}
#rtb .bec.wind{animation:rtwshk .14s infinite}
@keyframes rtwshk{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
#rtb .bec.lunge{animation:rtlunge .38s ease-out}
@keyframes rtlunge{35%{transform:translateY(14px) scale(1.06)}100%{transform:none}}
#rtb .bec.stun .eart>.art{filter:saturate(.4) brightness(.8)}
#rtb .bec.dead{opacity:.35;filter:grayscale(.9);transform:scale(.94);pointer-events:none}
#rtb .bec.dead .xrg,#rtb .bec.dead .cnt,#rtb .bec.dead .xint{display:none}
#rtb .bec.parried{animation:rtprd .45s}
@keyframes rtprd{20%{transform:translateY(-12px) rotate(-3deg)}100%{transform:none}}
#rtb .pop{position:absolute;z-index:8;left:50%;transform:translate(-50%,0);font-weight:900;font-size:22px;white-space:nowrap;pointer-events:none;animation:rtpop 1s cubic-bezier(.2,.8,.3,1) forwards;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.7);text-shadow:0 0 10px rgba(236,208,138,.8),0 2px 0 #000;font-variant-numeric:tabular-nums}
#rtb .bec.big .pop{font-size:28px}
#rtb .pop small{display:block;font-size:11px;text-align:center;letter-spacing:.1em;-webkit-text-stroke:0}
#rtb .pop.c{font-size:30px;color:#ffd76a;text-shadow:0 0 14px #ff8a4d,0 2px 0 #000}
#rtb .bec.big .pop.c{font-size:38px}
#rtb .pop.h{color:#7dffb5;text-shadow:0 0 10px rgba(60,255,150,.6),0 2px 0 #000}
#rtb .pop.k{color:#ff6b80;text-shadow:0 0 10px rgba(255,60,90,.6),0 2px 0 #000}
#rtb .bec .pop.m,#rtb .pop.m{color:#cfd6e6;font-size:17px}
#rtb .pop.p{color:#ffe9a8;font-size:20px;text-shadow:0 0 14px #ecd08a,0 2px 0 #000}
#rtb .bec .pop.d,#rtb .pop.d{font-size:15px;color:#ffb38a}
#rtb .bec .pop.a,#rtb .pop.a{font-size:17px;color:#c9b8ff;text-shadow:0 0 10px rgba(160,130,255,.7),0 2px 0 #000}
#rtb .bec .pop.t,#rtb .pop.t{font-size:12px;color:#ecd08a;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.6);-webkit-text-stroke:0;text-shadow:none}
@keyframes rtpop{0%{transform:translate(-50%,6px) scale(.4);opacity:0}14%{transform:translate(calc(-50% + var(--dx,0px)*.3),-14px) scale(1.25);opacity:1}30%{transform:translate(calc(-50% + var(--dx,0px)*.5),-20px) scale(1)}100%{transform:translate(calc(-50% + var(--dx,0px)),-46px) scale(.9);opacity:0}}
/* 橫幅大字：襯線黑體、斜切、金屬漸層；一條暗帶上下各一道細線 */
#rtb .stamp{--bc:#ecd08a;--bd:#9a6a18;--bg:rgba(236,208,138,.55);position:absolute;left:0;right:0;top:27%;z-index:20;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 11px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(6,6,8,.9) 16% 84%,transparent);animation:rtstamp 1.15s cubic-bezier(.2,.8,.2,1) forwards}
#rtb .stamp::before,#rtb .stamp::after{content:'';position:absolute;left:6%;right:6%;height:1px;background:linear-gradient(90deg,transparent,var(--bc) 30% 70%,transparent);animation:rtline .5s ease-out}
#rtb .stamp::before{top:3px}#rtb .stamp::after{bottom:3px}
#rtb .stamp b{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.15;letter-spacing:.3em;margin-right:-.3em;transform:skewX(-10deg);background:linear-gradient(180deg,#fff 18%,var(--bc) 58%,var(--bd) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.9)) drop-shadow(0 0 12px var(--bg));animation:rtsb 1.15s cubic-bezier(.2,.8,.2,1) forwards;white-space:nowrap;max-width:96%}
#rtb .stamp small{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.55em;margin-right:-.55em;color:var(--bc);opacity:.92}
#rtb .stamp.red{--bc:#ff9a9a;--bd:#b3172f;--bg:rgba(255,60,90,.6)}#rtb .stamp.cy{--bc:#c9f5ff;--bd:#2f9fd0;--bg:rgba(120,220,255,.6)}#rtb .stamp.gray{--bc:#d8d3c6;--bd:#77736a;--bg:rgba(200,200,200,.3)}
@keyframes rtstamp{0%{opacity:0;transform:scaleY(.2)}10%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
@keyframes rtsb{0%{transform:translateX(-46px) skewX(-10deg);letter-spacing:.6em}14%{transform:skewX(-10deg);letter-spacing:.3em}80%{transform:translateX(4px) skewX(-10deg)}100%{transform:translateX(40px) skewX(-10deg)}}
@keyframes rtline{from{left:50%;right:50%}}
#rtb .warnb{position:absolute;left:0;right:0;top:12%;z-index:6;display:flex;flex-direction:column;align-items:center;padding:5px 0 7px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(70,4,14,.88) 18% 82%,transparent);border-top:1px solid rgba(255,90,110,.8);border-bottom:1px solid rgba(255,90,110,.8);animation:rtwb .22s ease-out}

#rtb .skb{position:absolute;left:0;right:0;top:14%;z-index:6;text-align:center;pointer-events:none;animation:rtskb .9s ease-out forwards}
#rtb .skb b{display:inline-block;padding:2px 22px 4px;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.22em;transform:skewX(-10deg);color:#fff;text-shadow:0 0 12px var(--c,#ecd08a),0 2px 0 #000;background:linear-gradient(90deg,transparent,rgba(6,6,8,.8) 20% 80%,transparent);border-bottom:1px solid var(--c,#ecd08a)}
@keyframes rtskb{0%{opacity:0;transform:translateX(-30px)}14%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateX(20px)}}
#rtb .posein>b{font-size:26px;letter-spacing:.2em;transform:skewX(-10deg);padding-bottom:2px;border-bottom:1px solid var(--c,#ffd86b)}
#rtb .bec .xint i.nd{background:#111;color:#ffb3c1;border:1px solid #ff4d6d}
#rtb .pop{font-family:var(--display)}
#rtb .rtfl{position:absolute;inset:0;z-index:19;pointer-events:none;animation:rtfl .4s ease-out forwards}
@keyframes rtfl{from{opacity:.75}to{opacity:0}}
#rtb .vig{position:absolute;inset:0;z-index:19;pointer-events:none;box-shadow:inset 0 0 80px 20px rgba(220,20,40,.6);animation:rtfl .5s ease-out forwards}
#rtb #xlog{flex:none;height:104px;overflow-y:auto;overflow-x:hidden;margin:6px 6px 0;padding:4px 6px;position:relative;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.1);border-radius:12px;scroll-behavior:smooth}
#rtb #xlog::-webkit-scrollbar{width:3px}
#rtb .blg{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;padding:2px 4px;margin:1px 0;border-radius:8px;background:rgba(255,255,255,.035);font-size:12px;line-height:1.35;animation:rtlgi .25s ease-out}
#rtb .blg:nth-last-child(n+5){opacity:.5}

#rtb .bhc .hface{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#222;position:relative}

#rtb .bhc.ready .xhr{filter:drop-shadow(0 0 6px var(--rc))}
#rtb .bhc.ready .hpt{animation:rtrdy .9s infinite alternate}

#rtb .bhc .hmain{min-width:0}

 {id:'ria1',npc:'莉雅',fac:'guild',ch:1,n:'舊徽章',key:'side_ria1',
  a:[['莉雅','{name}，下次去迷霧森林的時候，可以幫我留意一樣東西嗎？'],['莉雅','一枚銅色的公會徽章，背面刻著「第七小隊」。……是我以前的。'],['{name}','以前的？莉雅，妳當過冒險者？'],['莉雅','嘿嘿，看不出來吧？只當了三個月。徽章是在森林裡跑丟的，黑森狼的窩附近。'],['莉雅','不用勉強喔！只是……如果剛好看到的話。']],
  req:{type:'kill',mob:'wolf',c:5,d:'在迷霧森林擊敗黑森狼 5 隻，搜索狼窩'},
  b:[['旁白','狼窩的枯葉底下，一枚生鏽的銅徽章反射著微光。'],['莉雅','……真的找到了。'],['莉雅','第七小隊，四個人。隊長是個很吵的大叔，每次出發前都要大家喊「一定要平安回來」。'],['莉雅','後來在礦坑，只有我一個人回來了。'],['{name}','所以妳每次都對我們說那句話。'],['莉雅','嗯。說出口的話，好像就比較會實現。……謝謝{你|妳}，{name}。'],['莉雅','好啦！不准用那種表情看我。下一份委託已經排好了喔！']],

 {id:'ria2',npc:'莉雅',fac:'guild',pre:'ria1',ch:3,n:'第七小隊',key:'side_ria2',
  a:[['莉雅','礦坑的封鎖解除了吧？……我想拜託{你|妳}一件事。'],['莉雅','隊長的頭盔還在礦坑深處。我一直不敢回去拿。'],['莉雅','這次我想跟{你|妳}一起去。……不，別擔心，我只在入口等。我只是想離他近一點。'],{q:'{name} 怎麼回答？',choice:[

 /* ---- 巴爾德：沒人來取的劍 ---- */
 {id:'bald1',npc:'巴爾德',fac:'smith',ch:3,n:'沒人來取的劍',key:'side_bald1',
  a:[['巴爾德','喂，過來。給你看個東西。'],['旁白','巴爾德從櫃台底下抽出一把單手劍，劍身擦得發亮，劍柄卻纏著舊布。'],['巴爾德','三年前，一個銀頭髮的小子訂的。付了一半訂金，說「從騎士團回來再取」。'],['{name}','銀頭髮……蓋爾？'],['巴爾德','原來你們認識。那小子打鐵的時候一直盯著北邊看，跟你一個樣。'],['巴爾德','劍還差最後一道淬火，要用魔像礦石。你幫我弄來五塊，我把它做完。總有一天他會來拿。']],
  req:{type:'item',item:'m_ore',c:5,d:'交付魔像礦石 5 個'},
  b:[['旁白','爐火燒了整整一夜。早上，劍身多了一層淡淡的青色。'],['巴爾德','做好了。劍柄我刻了字，你自己看。'],['旁白','「給要回家的人。」'],['巴爾德','訂單上他自己寫的。……臭小子，字倒是寫得挺好看。'],['巴爾德','劍先掛在店裡。哪天你們把他拖回來，叫他自己來付尾款。']],
  rw:{gold:1000,exp:900,items:{stone:4}}},
 {id:'bald2',npc:'巴爾德',fac:'smith',pre:'bald1',ch:4,n:'鐵匠的遠征',key:'side_bald2',
  a:[['巴爾德','聽說你們要跟遠征隊上山。……二十年前那支，我是替他們扛貨的挑夫。'],['巴爾德','送到霜雪山腳，隊長就要我回頭。我的老搭檔是隊裡的盾手，臨走前把他的舊盾塞給我。'],['巴爾德','他再也沒回來。那面盾一直裂著，我一直沒敢補。'],['巴爾德','山上的冰川巨人身上會掉寒鐵。帶三塊回來，我想用它補好那面盾。']],
  req:{type:'kill',mob:'frostgiant',c:3,d:'在霜雪山脈擊敗冰川巨人 3 隻，取得寒鐵'},
  b:[['旁白','你們在山腰的岩縫裡找到一面凹陷的圓盾，盾面刻著一隻歪歪扭扭的熊。'],['巴爾德','……是他畫的。說是隊徽，醜得要命。'],['巴爾德','我會把它補好，掛在店門口。這樣他在哪裡都看得到，晨星鎮的鐵匠還在打鐵。'],['巴爾德','謝了。強化費……這次算你便宜一點。']],
  rw:{gold:2500,exp:2000,items:{stone:3}}},

 /* ---- 蜜可：神秘商人 ---- */
 {id:'miko1',npc:'蜜可',fac:'shop',ch:1,n:'假藥水事件',key:'side_miko1',
  a:[['蜜可','{name}！大事不好！有客人拿著「蜜可牌治療藥水」來退貨，說喝了會一直打噴嚏！'],['蜜可','可是那根本不是我做的！瓶子是仿的，標籤上的字還寫錯——我的「蜜」才不是長那樣！'],['蜜可','我聞過了，裡面加了迷霧森林的紫菇孢子。有人在森林裡採菇做假貨。'],['蜜可','幫我去菇群那邊看看？不用抓人，只要找出孢子是從哪裡來的就好！']],
  req:{type:'kill',mob:'shroom',c:5,d:'在迷霧森林擊敗瘴氣毒菇 5 隻，追查孢子來源'},
  b:[['旁白','菇群中央有一個被踩平的空地，留著攤販用的木架和一頂舊斗篷。'],['蜜可','這斗篷……是那個「神秘商人」的。他常在路邊跟冒險者賭運氣。'],['蜜可','咦？斗篷內袋縫著一張紙條。「給小蜜：店要顧好，帳要記好。」'],['蜜可','……這是爸爸的字。'],['蜜可','他五年前說要出門進貨，就再也沒回來。原來他一直在附近亂晃？還賣假藥水？！'],['蜜可','{name}，下次遇到那個神秘商人，幫我把他抓回來。我要親自跟他算帳！']],
  rw:{gold:500,exp:350,items:{eth:3}}},
 {id:'miko2',npc:'蜜可',fac:'shop',pre:'miko1',ch:2,n:'帳要記好',key:'side_miko2',
  a:[['蜜可','我想通了。爸爸會躲，是因為欠了一屁股債，怕連累我。'],['蜜可','債主是礦坑那邊的走私商人，收的是史萊姆凝膠和黑狼之牙。'],['蜜可','把這些材料湊齊，我去幫他還。……當然，之後要他做牛做馬還給我！']],
  req:{type:'item',item:'m_fang',c:4,d:'交付黑狼之牙 4 個'},
  b:[['旁白','幾天後，道具店的櫃台後面多了一個披著舊斗篷的中年男人，正被蜜可罵得抬不起頭。'],['神秘商人','咳，這位冒險者，謝謝你。我女兒的脾氣……像她媽。'],['蜜可','爸！不准跟客人亂聊！去把貨架擦乾淨！'],['蜜可','{name}，從今天起，我們店裡的藥水打九折。別誤會，這不是謝禮，是……老客人優惠！'],['旁白','從那天起，道具店的帳本上多了一行很醜的字：「欠小蜜：一輩子。」']],
  rw:{gold:800,exp:700,items:{pot2:3},flag:'mikoDad'}},

 /* ---- 瑪莎：雪夜的信 ---- */
 {id:'mar1',npc:'瑪莎',fac:'inn',ch:1,n:'旅店的屋頂',key:'side_mar1',
  a:[['瑪莎','{name}，昨晚的風把屋頂的瓦片吹掉了幾片，幫阿姨爬上去補一補？'],['旁白','屋頂上可以看見整個晨星鎮，還有北方地平線上那條淡淡的黑線。'],['瑪莎','你小時候就是坐在那個位置，說要看黑霧後面有什麼。','m'],['瑪莎','妳小時候就是坐在那個位置，說要看黑霧後面有什麼。','f'],['瑪莎','我那時候罵得好兇，其實是怕。怕{你|妳}哪天真的跑去了。'],['瑪莎','……結果{你|妳}現在真的要去了。'],{q:'{name} 怎麼回答？',choice:[
    {t:'「我會回來的。每一次都會。」',lines:[['瑪莎','嗯。旅店的門，永遠幫{你|妳}留著。']]},
    {t:'「阿姨，妳的燉肉是我回來的理由。」',lines:[['瑪莎','哈！那我可得多學幾道菜，把{你|妳}拴住才行。']]}]}],

 {id:'mar2',npc:'瑪莎',fac:'inn',pre:'mar1',ch:4,n:'櫃台下的地圖',key:'side_mar2',
  a:[['瑪莎','{name}，坐下。要上山之前，阿姨有樣東西要給{你|妳}。'],['旁白','瑪莎從櫃台底下拿出一張折得很舊的地圖，邊角都磨破了。'],['瑪莎','你姨丈的。二十年前他跟著第一支遠征隊走了，沒有回來。','m'],['瑪莎','妳姨丈的。二十年前他跟著第一支遠征隊走了，沒有回來。','f'],['瑪莎','上面的記號是他走過的路。哪裡有洞穴可以躲雪，哪裡的冰會裂，他都畫了。'],['瑪莎','我本來想燒掉的。燒了好幾次，都下不了手。'],['瑪莎','你小時候爬屋頂看北邊，我那麼兇，就是怕……算了。拿去吧。','m'],['瑪莎','妳小時候爬屋頂看北邊，我那麼兇，就是怕……算了。拿去吧。','f'],['瑪莎','只要{你|妳}答應我一件事：走到他沒走完的地方，然後回來告訴我。']],
  rw:{exp:2500,items:{gem_w:1}}},

 /* ---- 托托（小男孩） ---- */
 {id:'boy1',npc:'托托',fac:'inn',ch:1,n:'托托的最後一隻羊',key:'side_boy1',
  a:[['托托','{哥哥|姊姊}！還記得我嗎？在草原上被綁起來的那個！我叫托托！'],['托托','我現在在旅店幫瑪莎阿姨洗盤子。可是……我的羊還有一隻沒找回來，叫「棉花」。'],['托托','牠很笨，一定躲在尖角野兔的洞附近。拜託拜託！']],
  req:{type:'kill',mob:'hornrabbit',c:5,d:'在微風草原擊敗尖角野兔 5 隻，找回小羊'},

 {id:'boy2',npc:'托托',fac:'inn',pre:'boy1',ch:3,n:'木劍與誓言',key:'side_boy2',
  a:[['托托','{哥哥|姊姊}，你看！巴爾德大叔幫我做了一把木劍！'],['托托','跟我比一場！一下下就好！'],{q:'要怎麼跟托托比？',choice:[
    {t:'認真接招，讓他知道冒險不簡單',fx:{exp:200},lines:[['旁白','托托被輕輕絆倒了三次，第四次卻咬著牙站了起來。'],['托托','再、再一次！'],['{name}','……很好。會站起來的人，才有資格當冒險者。']]},
    {t:'故意輸給他',fx:{items:{pot:2}},lines:[['托托','我贏了！我贏了！'],['托托','……{哥哥|姊姊}，你是故意的吧。','m'],['托托','……姊姊，妳是故意的吧。','f'],['托托','下次要認真喔。等我長大，我要真的贏{你|妳}。']]}]},
   ['托托','對了，我想到一句很帥的話。我們冒險者小隊的誓言！'],['托托','「不管走多遠，我們都會回家。」……怎麼樣？']],

 /* ---- 艾德溫：老書記的悔恨 ---- */
 {id:'edw1',npc:'艾德溫',fac:'temple',ch:2,n:'老書記的筆記',key:'side_edw1',
  a:[['艾德溫','{name}，你知道二十年前那支遠征隊，為什麼會失敗嗎？'],['艾德溫','因為我們把霧當成天災，以為只要走得夠快就能穿過去。'],['艾德溫','我回來以後，花了二十年研究霧晶。可是手上的樣本太少，一直解不開它的構造。'],['艾德溫','幫我帶三塊霧晶碎片回來。這次，我想在你們出發前找出答案。']],
  req:{type:'item',item:'m_dark',c:3,d:'交付蝕霧碎片 3 個'},
  b:[['艾德溫','……奇怪。霧晶裡面，封著聲音。'],['艾德溫','我把它放在耳邊聽了一整晚。是一個小孩在數數，數到三十七就停住，然後重新開始。'],['艾德溫','二十年來我一直把霧當成天災。也許……它更像是一個記得東西的地方。'],['艾德溫','這份筆記你們帶著。上面寫了霧晶怕高熱、怕震動。打要塞的時候，用得上。']],
  rw:{gold:1200,exp:900,items:{eth2:2}}},

  for(const q of SQ){const s=S.side[q.id];if(!s||s.done)continue;

function artList(){const L=[['title_bg','標題主視覺','1280×720'],['town_bg','晨星鎮全景','1280×720']];
  for(const k of [...Object.keys(CLS),...Object.keys(ADV)])for(const x of ['m','f'])L.push([`class_${k}_${x}`,(CLS[k]||ADV[k]).n+(x==='m'?' 男':' 女')+'立繪','768×1024']);
  for(const k in NPC)L.push([NPC[k],'NPC '+k,'768×1024']);
  AREAS.forEach(a=>{L.push(['area_'+a.id,'地圖 '+a.n,'1280×720']);L.push(['battle_'+a.id,'戰鬥背景 '+a.n,'1280×960'])});
  for(const k in MOBS)L.push(['mob_'+k,'魔物 '+MOBS[k].n,'768×768']);
  CH.forEach((c,i)=>{for(const x of ['m','f']){L.push([`story_ch${i+1}_intro_${x}`,c.t+' 開場','1280×720']);L.push([`story_ch${i+1}_outro_${x}`,c.t+' 結尾','1280×720'])}});
  EVENTS.forEach(e=>L.push(['event_'+e.id,'事件 '+e.n,'1280×720']));return L}

/* ============ 劇情 ============ */
function okLine(l){if(!Array.isArray(l))return true;const c=l[2];if(!c)return true;if(c==='m'||c==='f')return S.sex===c;
  if(c[0]==='#')return !!S.flags[c.slice(1)];if(c[0]==='!')return !S.flags[c.slice(1)];if(c.startsWith('bond>='))return (S.bond||0)>=+c.slice(6);if(c.startsWith('bond<'))return (S.bond||0)<+c.slice(5);return true}
function stNext(){do{STORY.i++}while(STORY.i<STORY.lines.length&&!okLine(STORY.lines[STORY.i]));if(STORY.i>=STORY.lines.length)storyEnd();else drawStory()}
function play(lines,key,label,after,replay){STORY={lines:[...lines],i:-1,key,label,after,replay};stNext()}
function drawStory(){const el=$('#story');if(!STORY){el.hidden=true;el.innerHTML='';return}
  const L=STORY.lines[STORY.i];el.hidden=false;
  if(!Array.isArray(L)){el.innerHTML=`<button class="skip" data-a="storySkip">跳過</button>${art(STORY.key,STORY.label)}
    <div class="say" style="display:flex;flex-direction:column"><div class="who">${esc(you(tx(L.q||'{name} 要怎麼做？')))}</div><div class="choices">${L.choice.map((o,i)=>o.cond&&!okLine(['','',o.cond])?'':`<button class="btn" data-a="storyPick" data-v="${i}">${esc(you(tx(o.t)))}</button>`).join('')}</div></div>`;return}
  const [w,t]=L,who=tx(w),hero=w==='{name}',nk=NPC[w],k=hero?PKEY(heroFace(t)):nk&&nk.startsWith('npc_')?'portrait_'+nk+(heroFace(t)?'_'+heroFace(t):''):nk;
  el.innerHTML=`<button class="skip" data-a="storySkip">跳過</button>${art(STORY.key,STORY.label)}
   <button class="say" data-a="storyNext" style="text-align:left">${k?`<div class="pt">${art(k,who,'r34','mini')}</div>`:'<span></span>'}<div><div class="who">${esc(who)}</div><p>${esc(you(tx(t)))}</p></div><div class="nx">點擊繼續 ▼</div></button>`}
function storyPick(i){const o=STORY.lines[STORY.i].choice[i],f=o.fx||{};
  if(!STORY.replay){if(f.bond){S.bond=(S.bond||0)+f.bond;toast(`與露娜的羈絆提升了`)}if(f.flag)S.flags[f.flag]=1;
    if(f.items)for(const k in f.items){addItem(k,f.items[k]);toast(`獲得 ${ITEMS[k].n}×${f.items[k]}`)}if(f.exp)gainExp(f.exp);save()}

  {id:'c_flag',ar:'castle',n:'城牆上的舊軍旗',t:'要塞城牆上插著一面破爛的王國軍旗，旗下壓著一封沒拆的信。',o:[
    {l:'爬上城牆取信',a:'DEX',dc:13,ok:{t:'信是寫給家人的，落款二十年前。你決定帶回去交給公會。',exp:3,gold:1},ng:{t:'石磚鬆動，你差點跌下去。',hp:-.15}},
    {l:'把旗子重新立好',safe:1,ok:{t:'你把旗子扶正，對著北方敬了一個禮。不知道為什麼，風好像停了一下。',exp:1.5}}]},
  {id:'c_mirror',ar:'castle',n:'霧中的鏡子',t:'走廊盡頭立著一面鏡子，鏡子裡的你在你停下之後，還多走了一步。',o:[
    {l:'打碎鏡子',a:'STR',dc:12,ok:{t:'鏡子碎開，後面藏著一個暗格。',loot:1,gold:2},ng:{t:'碎片劃傷了你，鏡中的影子在笑。',hp:-.15}},
    {l:'盯著鏡子不動',a:'VIT',dc:13,ok:{t:'影子終於先移開了視線。你覺得自己好像贏了什麼。',exp:3,mp:.3},ng:{t:'你頭暈目眩，退了好幾步。',mp:-.2,hp:-.08}}]},
  {id:'r_inn',ar:'road',n:'廢棄驛站的帳本',t:'二十年沒人住的驛站櫃台上，帳本還翻在最後一天。最後一筆是「遠征隊，二十人，房錢未付」。',o:[
    {l:'仔細翻看帳本',a:'INT',dc:13,ok:{t:'夾頁裡有一張驛站老闆留下的藏寶地圖，你照著找到了地窖。',gold:3,loot:1},ng:{t:'紙頁一碰就碎。',exp:.5}},
    {l:'替遠征隊付清房錢',safe:1,ok:{t:'你把幾枚金幣放在帳本上，寫下「已付」。這樣他們回來時，就有地方住了。',gold:-.5,exp:2}}]},
  {id:'r_patrol',ar:'road',n:'王國巡邏隊的盤查',t:'一隊王國巡邏兵攔下你們：「北邊來的？把行李打開。」',o:[
    {l:'亮出公會證明',a:'LUK',dc:12,ok:{t:'隊長看到「破霧者」三個字，態度一百八十度轉變，還送你們一程。',exp:2,item:['pot2',1]},ng:{t:'他們還是把行李翻得亂七八糟。',gold:-.6}},
    {l:'跟隊長講道理',a:'INT',dc:13,ok:{t:'隊長被說服，還偷偷告訴你氣象院被封鎖的事。',exp:3},ng:{t:'對方根本不聽，盤查了一個時辰。',exp:.5}}]},
  {id:'a_shelf',ar:'archive',n:'倒塌的書架',t:'一排書架倒在黑水裡，底下壓著一個還在發光的檔案盒。',o:[
    {l:'抬起書架',a:'STR',dc:14,ok:{t:'盒子裡是一份沒被刮掉的名冊副本，還有一件陪葬的飾品。',exp:3,loot:1},ng:{t:'書架又滑回水裡，濺了你一身墨水。',hp:-.12}},
    {l:'從縫隙伸手去撈',a:'DEX',dc:13,ok:{t:'你撈到盒子，裡面有幾枚古金幣。',gold:3.5},ng:{t:'被書蠹咬了一口。',hp:-.1}}]},
  {id:'a_ink',ar:'archive',n:'自己寫字的羽毛筆',t:'一張桌子上，羽毛筆正在空白的紙上一筆一筆寫著一個名字，寫完就塗黑，再重寫一次。',o:[
    {l:'握住羽毛筆',a:'VIT',dc:14,ok:{t:'筆在你手中停了。紙上留下一個名字，沒有被塗黑。你覺得肩膀輕了一點。',exp:3.5,mp:.4},ng:{t:'筆尖刺進你的手，墨水滲進傷口。',hp:-.15,mp:-.15}},
    {l:'把那頁紙收起來',a:'LUK',dc:12,ok:{t:'紙背面寫著書庫暗門的位置。',gold:2,stone:1},ng:{t:'紙一碰就化成了黑水。',exp:.5}}]});
EVENTS.push(
  {id:'p_cart',ar:'plain',n:'翻倒的貨車',t:'往晨星鎮的貨車翻在路邊溝裡，車夫一個人推得滿頭大汗，箱子散了一地。',o:[
    {l:'幫他把車推回路上',a:'STR',dc:11,ok:{t:'車輪一歸位，車夫就塞給你一袋謝禮和兩瓶藥水。',gold:1.5,item:['pot',2]},ng:{t:'車是推回去了，你的腰也閃了。',hp:-.1,exp:.5}},
    {l:'跟他買一件貨',safe:1,ok:{t:'他急著把摔過的貨脫手，便宜賣你一件裝備。',gold:-1.5,loot:1}}]},
  {id:'f_bees',ar:'forest',n:'滴蜜的大樹',t:'老樹的樹洞裡掛著一個比人頭還大的蜂巢，蜂蜜沿著樹皮一路滴到地上。',o:[
    {l:'點煙把蜂群燻走',a:'INT',dc:12,ok:{t:'蜂群散開了。蜂蜜甜得發亮，吃下去整個人暖了起來。',hp:.35,mp:.2,exp:1},ng:{t:'煙往你這邊飄，蜂群也跟著飄過來。',hp:-.15}},
    {l:'趁蜂群不注意伸手掏',a:'DEX',dc:14,ok:{t:'蜂巢深處卡著一個不知道誰藏的舊錢袋。',gold:2.5},ng:{t:'整窩蜂一起轉頭看你。',hp:-.2}}]},
  {id:'m_gas',ar:'mine',n:'發光的瓦斯',t:'坑道裡飄著淡綠色的氣體，盡頭的岩壁上，礦脈正一閃一閃地發亮。',o:[
    {l:'憋住氣衝過去挖',a:'VIT',dc:13,ok:{t:'你一口氣挖下兩塊礦，衝回來才敢換氣。',stone:2,exp:1},ng:{t:'吸了一口，頭暈得扶著牆走了半天。',hp:-.18}},
    {l:'繞遠路',safe:1,ok:{t:'繞了一大圈，路邊撿到幾塊前人挖剩的碎礦。',gold:1}}]},
  {id:'s_sled',ar:'snow',n:'被雪埋住的雪橇',t:'雪堆裡露出雪橇的一角，上面還綁著兩只木箱，箱子上烙著遠征隊的記號。',o:[
    {l:'直接挖出來',a:'STR',dc:12,ok:{t:'箱子裡是遠征隊沒用完的補給，還有一件保存得很好的裝備。',item:['pot2',1],loot:1},ng:{t:'上面的雪坡滑下一塊，把你埋到腰。',hp:-.15}},
    {l:'先看清雪坡再動手',a:'INT',dc:12,ok:{t:'你挑了不會崩的位置慢慢挖，平安拿到一只箱子。',item:['eth2',1],exp:1.5},ng:{t:'看了半天，雪橇自己滑下山谷了。',exp:.5}}]},
  {id:'c_cell',ar:'castle',n:'地牢裡的人',t:'地牢最深處，一個瘦得只剩骨頭的人抓著鐵欄：「鑰匙在守衛身上……拜託。」',o:[
    {l:'撬開牢門',a:'DEX',dc:14,ok:{t:'他是二十年前遠征隊的斥候，告訴你要塞巡邏換班的時間。',exp:3.5,gold:1},ng:{t:'鎖發出一聲巨響，遠處傳來腳步聲，你只能先走。',hp:-.12}},
    {l:'留下食物和水',safe:1,ok:{t:'他哭著道謝，把一直藏在懷裡的舊裝備塞給你：「我用不到了。」',gold:-1,loot:1}}]},
  {id:'p_rain',ar:'plain',n:'突來的雷雨',t:'草原上的天色一下子暗下來，遠方的雷一道接一道，雨點已經打在臉上了。',o:[
    {l:'躲到孤樹下',a:'LUK',dc:11,ok:{t:'雨停的時候，樹上的鳥巢被吹落，裡面滾出幾枚亮晶晶的硬幣。',gold:2,exp:1},ng:{t:'雷正好劈在樹梢，你被震得耳朵嗡嗡響。',hp:-.15}},
    {l:'冒雨趕路',a:'VIT',dc:11,ok:{t:'渾身濕透，但你比預定早了半天抵達下一個路口。',exp:2.5},ng:{t:'淋了一身雨，腳步越走越沉。',hp:-.08,mp:-.12}},
    {l:'搭起斗篷等雨停',safe:1,ok:{t:'雨聲很大，你聽著聽著打了個盹。醒來時天放晴了。',hp:.2,mp:.2}}]},
  {id:'f_fox',ar:'forest',n:'捕獸夾上的狐狸',t:'一隻小狐狸的後腿被生鏽的捕獸夾咬住，看到你也不逃，只是一直發抖。',o:[
    {l:'撬開夾子',a:'DEX',dc:12,ok:{t:'夾子一鬆，牠一拐一拐地跑進樹叢。你跟過去，發現獵人藏起來的獵物箱。',loot:1},ng:{t:'夾子彈回來，夾到的是你的手指。',hp:-.12}},
    {l:'先替牠敷藥再放走',need:['pot',1],safe:1,ok:{t:'牠舔了舔你的手。走了沒多遠，牠叼回一塊被泥巴包住的礦石，放在你腳邊。',exp:2,stone:1}},
    {l:'不要多管閒事',safe:1,ok:{t:'你走了。背後的叫聲，一直到霧裡才聽不見。'}}]},
  {id:'m_rail',ar:'mine',n:'失控的礦車',t:'軌道上方傳來轟隆聲，一台裝滿礦石的礦車衝下坡——前面還有兩個礦工在敲岩壁！',o:[
    {l:'扳動道岔',a:'INT',dc:13,ok:{t:'礦車拐進廢棄的支線，撞成一堆。礦工們嚇得腿軟，硬塞給你一袋工錢。',gold:2.5,exp:1.5},ng:{t:'你扳錯了方向，礦車擦著你身邊衝過去。',hp:-.12}},
    {l:'用身體擋下來',a:'STR',dc:14,ok:{t:'你死命頂住車頭，礦車在礦工面前停了下來。散落的礦石裡有兩塊好料。',exp:3,stone:2},ng:{t:'車是停了，你也被撞飛到牆上。',hp:-.22}},
    {l:'大喊示警',safe:1,ok:{t:'礦工們滾到一旁，礦車撞上岩壁碎成一地。人沒事就好。',exp:.8}}]},
  {id:'s_dove',ar:'snow',n:'凍僵的信鴿',t:'雪地上躺著一隻信鴿，腳上還綁著小小的信筒，身體冷得跟石頭一樣。',o:[
    {l:'塞進懷裡暖牠',a:'VIT',dc:12,ok:{t:'牠在你懷裡醒了。信上寫著山腰補給洞的位置，你順路去拿了一些。',item:['pot2',1],exp:1.5},ng:{t:'你也冷得發抖，最後只能把牠放進避風的石縫。',hp:-.08}},
    {l:'灌一瓶魔力藥水生火',need:['eth',1],safe:1,ok:{t:'藍色的火燒了很久。鴿子醒來後不肯走，你讀了信——是給北方哨站的情報。',exp:3,gold:1.5}},
    {l:'取下信就好',safe:1,ok:{t:'信上的字被雪浸糊了，只看得出「霧」和「等」兩個字。',exp:.5}}]},
  {id:'c_altar',ar:'castle',n:'黑霧祭壇',t:'走廊盡頭有一座黑石祭壇，上面擺著空的供碗。霧在碗邊打轉，像是在等什麼。',o:[
    {l:'倒進一瓶高級治療藥水',need:['pot2',1],safe:1,ok:{t:'霧把藥水喝得一滴不剩，祭壇底下「喀」一聲彈開暗格，裡面放著一件裝備。',loot:1,exp:2}},
    {l:'砸了祭壇',a:'STR',dc:14,ok:{t:'黑石裂開，裡面嵌著兩塊還在發光的礦石。',stone:2,exp:3},ng:{t:'霧從裂縫噴出來，吸走了你的力氣。',hp:-.18,mp:-.15}},
    {l:'讀祭壇上的刻字',a:'INT',dc:14,ok:{t:'是一段祈禱：「替我們記得。」讀完之後，你的魔力莫名地滿了。',mp:.6,exp:3},ng:{t:'刻字在你眼前扭動，看久了頭痛欲裂。',mp:-.25}}]},
  {id:'p_kite',ar:'plain',n:'卡在樹上的風箏',t:'一個小女孩指著樹梢哭，她的風箏卡在枝頭，風一吹就快要扯破了。',o:[
    {l:'爬上去拿',a:'DEX',dc:10,ok:{t:'你把風箏完好地拿下來。小女孩的媽媽塞給你一袋烤餅乾。',exp:1.5,hp:.2},ng:{t:'樹枝斷了，你摔了個屁股著地。小女孩破涕為笑。',hp:-.06,exp:.5}},
    {l:'教她怎麼收線',a:'INT',dc:9,ok:{t:'風一轉向，風箏自己滑了下來。她說長大也要當冒險者。',exp:2},ng:{t:'線斷了，風箏飄向北方。',exp:.3}}]},
  {id:'p_goblin',ar:'plain',n:'哥布林的交易',t:'一隻落單的哥布林舉著一顆紫色石頭，比手畫腳地想跟你換東西。',o:[
    {l:'拿乾糧跟牠換',a:'LUK',dc:11,ok:{t:'牠開心地抱著乾糧跑了。石頭是一塊小小的霧晶，露娜說很有研究價值。',exp:2,gold:1.5},ng:{t:'牠搶了乾糧就跑，連石頭也沒留下。',gold:-.4}},
    {l:'問牠石頭哪來的',a:'INT',dc:12,ok:{t:'牠指了指北方，又學「穿斗篷的人」走路的樣子。你記下了這個情報。',exp:2.5},ng:{t:'牠聽不懂，嘰嘰喳喳地走了。',exp:.3}}]},
  {id:'f_wisp2',ar:'forest',n:'停住的蝴蝶',t:'霧邊的空氣裡，一隻藍色蝴蝶懸在半空，翅膀張開，一動也不動。',o:[
    {l:'伸手碰牠',a:'VIT',dc:12,ok:{t:'指尖一碰，蝴蝶突然拍拍翅膀飛走了。周圍的霧退了一點點。',exp:2.5,mp:.3},ng:{t:'一股寒意從指尖竄上來，你的手麻了好一陣子。',hp:-.1,mp:-.1}},
    {l:'把這一幕畫下來',a:'INT',dc:11,ok:{t:'露娜看了你的畫很久：「霧碰過的東西，會停在那一刻。」',exp:2},ng:{t:'畫得太醜，連你自己都看不懂。',exp:.3}}]},
  {id:'f_mushroom',ar:'forest',n:'發光的蘑菇圈',t:'樹根之間長了一圈發著紫光的蘑菇，中間的草地乾乾淨淨，好像有人常常坐在這裡。',o:[
    {l:'摘幾朵回去',a:'LUK',dc:11,ok:{t:'蜜可說這是上好的藥材，跟你高價收購。',gold:3},ng:{t:'孢子噴了你一臉，你打了一整天噴嚏。',hp:-.08}},
    {l:'坐在圈裡休息',safe:1,ok:{t:'你坐下來，四周安靜得只剩下呼吸聲。醒來時精神好多了。',hp:.25,mp:.25}}]},
  {id:'m_lamp',ar:'mine',n:'熄滅的礦燈',t:'坑道牆上掛著一排礦燈，全都熄了，只有最裡面一盞還在閃。',o:[
    {l:'把礦燈一盞盞點亮',a:'INT',dc:12,ok:{t:'燈光照亮了一條被遺忘的支坑，裡面堆著沒運走的礦石。',stone:1,gold:2},ng:{t:'燈油漏出來，差點燒到你的袖子。',hp:-.08}},
    {l:'朝著閃爍的燈走',a:'LUK',dc:12,ok:{t:'燈下躺著一個舊工具箱，裡面有前人留下的裝備。',loot:1},ng:{t:'燈在你靠近時熄了，你在黑暗中撞到頭。',hp:-.12}}]},
  {id:'m_miner',ar:'mine',n:'迷路的老礦工',t:'一個白髮礦工坐在岔路口發呆，嘴裡唸著三十年前的坑道編號。',o:[
    {l:'陪他找出口',a:'VIT',dc:11,ok:{t:'他記起了路，還告訴你一條通往深處的捷徑。',exp:2.5,item:['pot2',1]},ng:{t:'你們一起繞了好久才出來。',hp:-.08,exp:1}},
    {l:'問他三十年前的事',a:'INT',dc:12,ok:{t:'「我們挖到一面畫著人的牆，他們都在笑……然後礦坑就封了。」',exp:3},ng:{t:'他搖搖頭，什麼都想不起來。',exp:.3}}]},
  {id:'s_wolf',ar:'snow',n:'受傷的雪狼',t:'雪地上一隻雪狼拖著受傷的後腿，看見你，齜牙低吼，卻站不起來。',o:[
    {l:'替牠包紮',a:'VIT',dc:13,ok:{t:'牠舔了舔你的手，一拐一拐地跑進風雪。不久後，你在路邊發現牠叼來的一袋東西。',exp:2.5,loot:1},ng:{t:'牠咬了你一口，然後逃走了。',hp:-.15}},
    {l:'留下食物離開',safe:1,ok:{t:'你放下一塊肉，慢慢後退。雪狼一直看著你走遠。',exp:1.5}}]},
  {id:'s_aurora',ar:'snow',n:'山頂的極光',t:'夜裡的山頂上，綠色的光帶在天空流動。露娜說，霧最濃的那年，北方再也看不到極光。',o:[
    {l:'許個願',safe:1,ok:{t:'你閉上眼睛許願。睜開時，露娜正偷偷看你。',hp:.3,mp:.3,exp:1}},
    {l:'記錄光帶的方向',a:'INT',dc:13,ok:{t:'光帶指的方向，剛好是黑霧要塞。艾德溫說這份紀錄很珍貴。',exp:3,gold:1.5},ng:{t:'冷到手抖，什麼都沒寫好。',hp:-.06}}]},
  {id:'c_knight',ar:'castle',n:'跪著的黑騎士',t:'大廳裡一具黑色鎧甲單膝跪地，手按著劍。鎧甲胸口掛著遠征隊的徽章。',o:[
    {l:'取下徽章',a:'LUK',dc:13,ok:{t:'徽章背面刻著名字。你把它收好，要帶回去給艾德溫。',exp:3,gold:1},ng:{t:'鎧甲突然動了一下，你嚇得退開。',hp:-.12}},
    {l:'對他行禮',safe:1,ok:{t:'你低頭行禮。鎧甲的頭盔好像微微點了一下。',exp:2}}]},
  {id:'c_engine',ar:'castle',n:'嗡嗡作響的管線',t:'牆裡的銅管發出低沉的嗡嗡聲，一路通往要塞深處。管子上結著一層霧晶。',o:[
    {l:'敲下霧晶',a:'STR',dc:13,ok:{t:'敲下的霧晶還很完整，能賣不少錢。',gold:4},ng:{t:'管子噴出一陣冷霧，凍傷了你的手。',hp:-.15}},

    {l:'抄下封蠟上的日期',a:'INT',dc:12,ok:{t:'封存的日期全都是同一天——遠征隊出發的隔天。艾德溫沉默了很久。',exp:3.5},ng:{t:'字跡被水泡糊了。',exp:.5}}]});
/* ===== 旅人劇情線：在對應地圖的事件格有機會遇到；該張劇情插圖到了才會出現 ===== */

const TRAV={
 toby:{n:'托比',s:[
  {t:'一個戴著過大郵差帽的少年從草叢裡衝出來，後面追著三隻哥布林。帆布郵包裡的信撒了一地。「拜託！別讓牠們踩到那封信！」',o:[
   {l:'擋住哥布林',ok:{t:'哥布林被你嚇跑了。少年抱著一封泛黃的信喘氣：「我叫托比，郵差。這封信……我一定要送到北方要塞。」',exp:1.5},aff:1},
   {l:'幫他撿信',ok:{t:'你撿回所有的信。最舊的那封寫著「北方要塞・遠征隊收」。托比把它塞回最裡層：「是我爸沒送出去的。」',gold:1},aff:1}]},
  {t:'霧邊的林道上排著一列小石頭。托比蹲在地上，一顆一顆往前擺。「霧會讓路跑掉，可是石頭不會。」',o:[
   {l:'陪他一起排',ok:{t:'你們排了很長一段。托比說他爸以前也是這樣送信的，「郵差的路，要自己做記號」。',exp:2},aff:1},
   {l:'問他為什麼非送不可',ok:{t:'「二十年前，我爸替遠征隊送補給。這是他回來後說好要送的最後一封。可是他後來生病了……」托比低頭擺下一顆石頭。',exp:1.5},aff:0}]},
  {t:'礦坑口，托比正跟一個礦工比手畫腳。礦工搖頭：「要塞？小鬼，那裡的路三十年前就塌了。」',o:[
   {l:'替他問清楚路線',ok:{t:'你問出一條舊軍道。托比把路線抄在信封背面，字歪歪扭扭的。',exp:2},aff:1},
   {l:'勸他先回家',ok:{t:'「我知道危險。」托比把帽子壓低，「可是信在我手上，就是我的工作。」',gold:1},aff:0}]},
  {t:'暴風雪裡，一團毯子在雪地上慢慢移動。是托比，臉凍得通紅，郵包緊緊抱在胸前。',o:[
   {l:'把他拉進避風處',ok:{t:'你生了火。托比捧著熱湯說：「謝謝……我差點以為，這封信要跟我一起停在雪裡了。」',hp:.2,exp:2},aff:1},
   {l:'把自己的斗篷給他',ok:{t:'托比裹著你的斗篷，小聲地說：「等我送完信，一定還你。這是郵差的承諾。」',exp:1.5},aff:2}]},
  {t:'要塞的廢墟裡，立著一個生鏽的遠征隊信箱。托比站在前面，手上的信抖個不停。',o:[
   {l:'陪他把信投進去',ok:{t:'信落進信箱，發出很輕的一聲。托比對著信箱敬了一個郵差的禮：「送達了。」',exp:3,gold:2},aff:1,end:'托比抹了抹眼睛，把信箱的蓋子擦亮：「爸，你沒做完的，我幫你做完了。」他把你的名字寫在郵差工作簿最後一頁，說以後你的信，他免費送。'},
   {l:'建議他拆開來看',ok:{t:'信是寫給艾德溫的：「對不起，那天我沒有等你們回來。」托比把信重新折好：「我回去親手交給他。」',exp:3},aff:0,end:'回程的路上，托比一直在練習要怎麼把信交給艾德溫。他說，有些信要送到人手上，才算送達。'}]}]},
 greta:{n:'葛蕾塔',s:[
  {t:'草原酒館的角落，一個臉上有疤的灰髮女人翻著一本破舊名冊，見人就問：「認不認識一個叫雷歐的年輕人？二十年前在霧邊站崗。」',o:[
   {l:'請她喝一杯',ok:{t:'「葛蕾塔，前傭兵教官。」她一口乾了酒，「當年是我下令撤退的。害他們背了二十年的逃兵罪名。」',exp:1.5},aff:1},
   {l:'幫她問酒館老闆',ok:{t:'老闆說雷歐好像往北邊去了。葛蕾塔把這行字記在名冊上，用力畫了一個圈。',gold:1},aff:1}]},
  {t:'森林裡，葛蕾塔拄著缺口的戰斧，正替一個迷路的年輕獵人帶路。「跟緊，別看霧。」',o:[
   {l:'一起護送獵人',ok:{t:'獵人平安出林。葛蕾塔說：「以前我也這樣帶著一群毛頭小子。後來，我把他們丟在霧邊。」',exp:2},aff:1},
   {l:'問她戰斧的缺口',ok:{t:'「撤退那天砍斷的旗桿。」她摸著缺口，「我要他們走，自己最後一個走。這是我唯一做對的事。」',exp:1.5},aff:1}]},
  {t:'礦坑深處，葛蕾塔和一個滿臉煤灰的礦工對望。礦工手上的十字鎬掉在地上：「……教官？」',o:[
   {l:'讓他們好好談',ok:{t:'你退到坑道口。很久以後，葛蕾塔走出來，名冊上「雷歐」兩個字旁邊多了一個勾。',exp:2.5},aff:1},
   {l:'告訴雷歐撤退的真相',ok:{t:'你說出第六章驛站裡老騎士說的事。雷歐哭了：「原來不是我們丟下崗位……」葛蕾塔拍拍他的肩膀。',exp:2},aff:2}]},
  {t:'雪山上的舊哨站，牆上刻著一排名字。葛蕾塔用斧刃在最後補上一個新的。',o:[
   {l:'問她刻的是誰',ok:{t:'「我自己。」她說，「當年的哨站名單上，唯獨沒有寫指揮官的名字。現在補上了。」',exp:2},aff:1},
   {l:'幫她把名字刻深一點',ok:{t:'兩個人一起刻，刻到手都麻了。她笑了：「這樣，風雪二十年也刮不掉。」',exp:2,hp:-.05},aff:1}]},
  {t:'黑霧要塞的城牆上，葛蕾塔望著重新開通的北方大道。身後站著幾個當年的部下。',o:[
   {l:'向她敬禮',ok:{t:'她回了一個標準的軍禮：「破霧者，你替我們把路打通了。」',exp:3,gold:2},aff:1,end:'葛蕾塔把名冊交給你：「上面的人，我都找到了。這本，替我交給王都。告訴他們，我們沒有逃。」她和部下們一起，站在城牆上守了最後一次夜。'},
   {l:'問她以後打算怎麼辦',ok:{t:'「回草原開個訓練場。」她笑，「這次教的，是怎麼活著回家。」',exp:3},aff:0,end:'後來，晨星鎮外多了一座傭兵訓練場。門口掛著一面舊軍旗，旗桿上有一道缺口。'}]}]},
 milo:{n:'米洛',s:[
  {t:'草原上，一個戴眼鏡的青年被野兔撞翻在地，捲軸散了一地。「啊啊我的比例尺！」',o:[
   {l:'幫他撿捲軸',ok:{t:'「謝謝！我叫米洛，王都學院的……呃，算是逃學的製圖學生。我要畫第一張霧退以後的北方地圖！」',exp:1.5},aff:1},
   {l:'趕走那隻野兔',ok:{t:'野兔被你趕跑。米洛扶好眼鏡：「牠已經撞了我三次了。我懷疑牠討厭地圖。」',gold:1},aff:1}]},
  {t:'森林裡，米洛盯著自己剛畫的地圖發呆。「不可能……這條路昨天在左邊，今天跑到右邊了。」',o:[
   {l:'告訴他霧會讓路移動',ok:{t:'米洛眼睛一亮：「所以要用霧不會碰的東西當基準……星星！我晚上再來量！」',exp:2.5},aff:1},
   {l:'問他為什麼要畫地圖',ok:{t:'「我老師想重畫北方地圖，被學院開除了。他說地圖不該說謊。我想替他畫完。」',exp:1.5},aff:1}]},
  {t:'礦坑壁畫前，米洛一邊抄寫一邊碎碎唸：「三百年前的人，比例畫得比學院教授還準……」',o:[
   {l:'幫他舉燈',ok:{t:'你舉燈照亮整面壁畫。米洛發現壁畫其實是一張地圖，標著霧最早出現的位置。',exp:3},aff:1},
   {l:'叫他小心落石',ok:{t:'一塊石頭剛好砸在他剛才站的地方。米洛臉色發白：「……我會記得在地圖上標『危險』。」',exp:1.5},aff:0}]},
  {t:'雪山營火邊，米洛攤開地圖，手凍得發抖。「你知道嗎，學院的地圖，北方那一塊是空白的。」',o:[
   {l:'跟他聊路上的見聞',ok:{t:'你說了一整晚。米洛把你說的每一個地名都畫了進去：「這張地圖，有一半是你的。」',exp:2.5},aff:2},
   {l:'把火生旺一點',ok:{t:'火光照亮了地圖。米洛說：「等我畫完，第一份送給你。」',hp:.2,exp:1.5},aff:1}]},
  {t:'黑霧要塞的城頭，米洛握著筆，在地圖最上方畫下最後一筆。',o:[
   {l:'看他畫完',ok:{t:'「完成了。霧退以後的北方。」米洛把地圖舉起來，手在發抖。',exp:3,gold:2},aff:1,end:'米洛把第一份副本送給你，地圖角落寫著一行小字：「與破霧者同行繪製」。他說要帶著正本回學院，替老師討一個公道。'},
   {l:'問他要不要回學院',ok:{t:'「回去，然後讓他們把地圖掛在大廳。」米洛笑了，「就算會被罵也一樣。」',exp:3},aff:0,end:'幾個月後，王都學院的大廳掛上了一張新的北方地圖。作者欄寫著兩個名字：米洛，和他的老師。'}]}]},
 are:{n:'阿蕾',s:[
  {t:'一個紅褐色辮子的牧羊女，舉著彎頭牧羊杖，正跟一群哥布林對峙。腳邊一隻白山羊咩咩叫。「把我家的羊還來！」',o:[
   {l:'站到她旁邊',ok:{t:'哥布林丟下兩隻羊跑了。「我叫阿蕾，這是雪球。」她摸著山羊，「牠們拿羊去換那種紫色石頭。」',exp:1.5},aff:1},
   {l:'用乾糧跟哥布林交換',ok:{t:'哥布林收了乾糧就放羊走。阿蕾氣鼓鼓的：「你太好心了！」但還是道了謝。',gold:-.3,exp:1},aff:1}]},
  {t:'森林的霧邊，雪球一直用鼻子嗅著地面，不肯走。阿蕾蹲下來：「雪球，是哥哥的味道嗎？」',o:[
   {l:'跟著雪球走',ok:{t:'雪球帶你們找到一頂舊草帽。阿蕾抱著帽子很久沒說話：「哥哥兩年前追羊追進霧裡……」',exp:2.5},aff:1},
   {l:'拉住她別靠近霧',ok:{t:'「我知道。」阿蕾停下來，「我只是想知道，他是不是也『停住』了。」',exp:1.5},aff:1}]},
  {t:'礦坑的貨箱堆裡，阿蕾翻出一條舊項鍊，手在發抖。「這是我送給哥哥的……怎麼會在這裡？」',o:[
   {l:'幫她查貨箱的來源',ok:{t:'貨箱烙著「王立氣象院」。阿蕾握緊項鍊：「所以他們也收霧裡的東西……」',exp:2.5},aff:1},
   {l:'安慰她',ok:{t:'「項鍊在，就代表他還有一部分在這裡。」阿蕾點點頭，把項鍊戴上。',exp:1.5},aff:2}]},
  {t:'雪山的懸崖邊，阿蕾腳下一滑，雪球死命咬住她的裙角。',o:[
   {l:'衝過去拉她上來',ok:{t:'你把她拉了上來。雪球累得趴在雪地上，阿蕾抱著牠哭了又笑。',exp:2.5,hp:-.06},aff:1},
   {l:'丟繩子給她',ok:{t:'她抓住繩子爬了上來。「謝謝……還有雪球，今晚給你吃最好的草。」',exp:2},aff:1}]},
  {t:'黑霧要塞前，霧退去後留下一大片空地。阿蕾坐在地上，雪球靠在她身邊。',o:[
   {l:'陪她坐一下',ok:{t:'「露娜說，霧裡的人可能還活著，只是停住了。」阿蕾看著北方，「那我就在這裡等他。」',exp:3,gold:2},aff:1,end:'阿蕾在要塞前搭了一個小牧場。每天傍晚，她都會朝北方吹一聲口哨，那是她和哥哥小時候約好的回家信號。'},
   {l:'勸她回家',ok:{t:'「爸媽也在等我。」她站起來拍拍裙子，「好，回家。可是我每年都會回來。」',exp:3},aff:0,end:'阿蕾回到草原牧場。她在牧場最北邊插了一根木樁，上面掛著哥哥的草帽，說等他回來時，一眼就能找到家。'}]}]},
 simon:{n:'老賽門',s:[
  {t:'草原的篝火邊，一個白鬍子老人彈著魯特琴，唱著一首沒人聽過的老歌。曲子很慢，像是在等誰。',o:[
   {l:'坐下來聽',ok:{t:'老人唱完一段，朝你點點頭，什麼都沒說，又開始唱第二遍。',exp:1.5,mp:.2},aff:1},
   {l:'丟一枚硬幣',ok:{t:'他收下硬幣，在琴桿上刻了一道痕。你發現琴桿上已經刻滿了痕。',gold:-.2,exp:1},aff:1}]},
  {t:'倒下的樹王旁，老賽門閉著眼睛唱歌。這次是不同的一段，歌詞提到「綠色的門」。',o:[
   {l:'問他歌詞的意思',ok:{t:'他搖搖頭，指了指自己的喉嚨，又指了指北方。好像是在說：答案在那裡。',exp:2},aff:1},
   {l:'跟著哼',ok:{t:'你哼對了調子。老人第一次睜開眼睛看你，嘴角動了一下。',exp:2},aff:1}]},
  {t:'礦坑壁畫前，老賽門停下腳步，手指輕輕撫過畫裡那些微笑的人。他開口了，聲音沙啞：「……就是這裡。」',o:[
   {l:'等他說下去',ok:{t:'「我家族代代唱這首歌。三百年，沒人知道是什麼意思。」他看著壁畫，「原來，他們是笑著走進去的。」',exp:3},aff:2},
   {l:'把壁畫抄給他',ok:{t:'他接過你抄的圖，看了很久：「謝謝。我眼睛不好，一直看不清楚。」',exp:2},aff:1}]},
  {t:'雪山的避難小屋裡，老賽門把一張寫滿歌詞的紙遞給露娜。「妳研究霧。妳會懂的。」',o:[
   {l:'讓露娜唸出來',ok:{t:'露娜唸到一半停住了：「這段……跟霧晶裡錄到的聲音，是同一個節奏。」',exp:3},aff:1},

function saveCode(){const j=JSON.stringify(S);let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))|0;return 'AO1.'+btoa(unescape(encodeURIComponent(j)))+'.'+(h>>>0).toString(36)}
function loadCode(code){try{const [v,b,c]=code.trim().split('.');if(v!=='AO1')throw 0;const j=decodeURIComponent(escape(atob(b)));let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))|0;
  if((h>>>0).toString(36)!==c)throw 0;const o=JSON.parse(j);if(!o||!o.name||!o.cls)throw 0;return o}catch(e){return null}}

  {v:'15.3',d:'2026-11-26',t:'難度與遊俠調整',b:'配裝變強了，大副本的困難與煉獄跟著變硬。遊俠的連射打法加強。'},
  {v:'15.2',d:'2026-11-26',t:'戰法併入流派',b:'不再手動切換戰法：身上湊出特定共鳴，打法就會自己改變。流派名稱拿掉「流」字。'},
  {v:'15.1',d:'2026-11-26',t:'插圖全面換新',b:'標題、城鎮、各地區、冒險事件的插圖全部重畫。占星師等十六段居民故事各有自己的插圖。'},
  {v:'15.0',d:'2026-11-26',t:'流派與套裝合併、戰鬥演出',b:'套裝併入流派：原本的套裝裝備改成帶一個詞綴，同種詞綴湊 2、3 件就有共鳴。招式圖卡先亮相，特效與命中跟在後面。每個地區有自己的戰鬥音樂。魔物依種族有不同的攻擊動作。'},
  {v:'14.6',d:'2026-11-26',t:'後期職業平衡',b:'高等級時劍士不再一枝獨秀，法師與遊俠更耐打。'},
  {v:'14.5',d:'2026-11-26',t:'大副本「霧都長征」',b:'第三個大副本開放：要塞、石板路、地下書庫連成一趟，共三段。這三個地區的戰鬥背景也各多了三張。法師與遊俠後期變耐打了；後期首領下手輕了一點。'},
  {v:'14.4',d:'2026-11-25',t:'大副本「凍脈深坑」、戰鬥背景',b:'第二個大副本開放：穿過礦坑、爬上雪山，有新魔物與中首領。草原、森林、礦坑、雪山的戰鬥背景各多了三張，一趟冒險裡每場都不一樣。'},
  {v:'14.3',d:'2026-11-25',t:'進階職重製、文字精簡',b:'八個進階職的被動會隨戰法改變，部分招式加強。戰鬥訊息與說明改短，不再附攻略建議——自己試出來吧。'},
  {v:'14.2',d:'2026-11-25',t:'職業重製',b:'每個職業多了第二種戰法，到角色頁切換。劍士變硬了；遊俠、法師、神官的部分招式加強。大副本難度重新調整。'},
  {v:'14.1',d:'2026-11-25',t:'霧蝕',b:'被霧纏住的魔物變得更難打——把霧打散看看。露娜的燈也幫得上忙。同種詞綴湊 2 件會改寫部分招式。戰鬥中的魔物放大了。'},
  {v:'14.0',d:'2026-11-25',t:'大副本內容包',b:'大副本「翠原迷森」加入新魔物、中首領與三種難度。有些傳說裝只在這裡掉。強化每級 8%→6%，各階武器基礎值拉平。老玩家可到冒險頁領一套新版套裝。角色頁新增屬性專精。'},
  {v:'13.7',d:'2026-11-25',t:'魔物與掉落等級自適應',b:'魔物等級會跟著你的等級走：在牠原本的等級往上一段區間內調整（一般魔物最多 +8 級、首領最多 +6 級），不會比原本低，並且永遠比你低至少 1 級，所以回到前面的地區不再是一刀一隻。掉落的裝備階級也跟著你的等級：最多比該地區高一階，且不超過目前章節解封的階級。高塔與試煉不變。'},
  {v:'13.6',d:'2026-11-25',t:'掉落率調整',b:'整體掉落率減半，讓好裝備更有份量：一般怪掉裝備 12%→6%、精英 50%→25%、蝕化怪 100%→50%、首領額外一件 40%→20%；稀有以上的比例減半（史詩 2.6%→1.3%、傳說 0.4%→0.2%）；魔物專屬裝備 4%→2%、首領專屬裝備 8%→4%；寶箱升史詩的機率、素材、藥水、強化石、精英寶石也減半。「寶物守衛必掉裝備」、首領必掉的強化石與寶石不變。首領專屬裝備的保底取消。大副本深入加成改為每段 +15%。'},
  {v:'13.5',d:'2026-11-25',t:'大副本「翠原迷森」（試玩）',b:'冒險頁新增第一個大副本：把微風草原和迷霧森林串成一趟。打倒一段的首領後可以直接深入下一段——不回城、不回血，劇情會在途中接著演。每連續深入一段，稀有以上裝備的機率加成 +15%、首領專屬裝備機率 ×1.2。已通關的玩家可以從任一已解鎖的段落開始。原本的單區冒險仍然保留。'},
  {v:'13.4',d:'2026-11-25',t:'戰鬥卡住保險、露娜招式改名',b:'修正「沉沒書庫」打倒魔物後卡住不動：該區掉落裝備時會出錯，導致戰鬥無法結算（感謝回報）。另外新增保險機制，戰鬥指令鎖住超過 10 秒會自動解開，敵人已倒下則直接結算，不會再停在原地。露娜的招式改成一般魔法師的名稱：魔法彈、火球術、治癒術、魔法護盾、驅散術、奧義星光爆裂（效果不變）。'},
  {v:'13.3',d:'2026-11-25',t:'露娜台詞調整、切回分頁不再卡頓',b:'露娜新增一批依戰況說的話：首領蓄力、暴走、成功打斷、你閃開攻擊、敵人快倒下、戰鬥拖太久，以及遇到成群、精英、飛行魔物或你血量偏低時的開場提醒。切到別的 App 或分頁再回來時，不會再把積欠的音樂音符與戰鬥特效一口氣播出來而卡住。露娜放招時不再喊口號（像「照路之光・撐住！」這類），只顯示招式名。另外拿掉、改寫了一批比較尷尬的台詞（戰鬥喊話、出發前的話、營火閒聊與戰敗後的安慰），讓她說話更自然。'},
  {v:'13.2',d:'2026-11-25',t:'旅途插圖換新畫風',b:'旅途中遇到的五位人物（阿蕾、葛蕾塔、米洛、賽門、托比）的插圖換成新畫風，共 25 張。第三章首領預告圖重畫完成。露娜的「燈光術」演出換成新姿勢。'},
  {v:'13.1',d:'2026-11-25',t:'露娜立繪重畫、NPC 與蓋爾換新畫風',b:'露娜的全身立繪與招式圖重畫：提燈掛在腰間，招式改為放出燈光與祈禱治癒（不再揮拳）；治癒時出現祈禱演出，攻擊時偶爾出現燈光術演出。晨星鎮 9 位 NPC（含三種表情）、5 位旅途中遇到的人物、夥伴蓋爾都換成新畫風；蓋爾在戰鬥中改用頭像表情並有出招演出。章節首領預告圖 6 張與牧羊女阿蕾的旅途插圖也換新。其餘旅途插圖繪製中。'},
  {v:'13.0',d:'2026-11-25',t:'冒險途中重新整理不再丟進度',b:'冒險到一半關掉或重新整理頁面，回來會自動接回同一趟路線：已拿到的金幣、經驗、戰利品、祝福與霧核都保留。如果是在戰鬥中離開，會回到那場戰鬥之前，需要重新打一次（HP、MP 維持離開時的狀態）。戰敗畫面改用新畫風的負傷插圖。'},
  {v:'12.9',d:'2026-11-25',t:'劇情插圖全數換新',b:'退回重畫的 7 張劇情插圖審查通過並上線：礦坑兩張（女主角手部修正）、迷霧森林腳印（主角改為彎身查看）、沉沒書庫（提燈數量修正）、公會大廳（接待員恢復原本造型）。主線七章 42 張劇情插圖至此全部是新畫風。'},
  {v:'12.8',d:'2026-11-25',t:'劇情插圖換新畫風、街道盜賊重畫',b:'主線七章的劇情插圖換成新的動畫畫風，主角與露娜都是定稿造型（先上線 35 張，逐張檢查過手部、臉部與動作；其餘 7 張有瑕疵退回重畫中，暫時維持舊圖）。街道盜賊重畫完成，換上新的動作圖：雙手握匕首的姿勢已修正。'},
  {v:'12.7',d:'2026-11-25',t:'魔物動作圖',b:'42 種魔物換上新畫風的動作圖，全部正面朝向你：待機、兩種攻擊動作與倒地；首領與特殊魔物多一個大招動作。普通攻擊會輪流使出兩種動作，首領施放技能時改用大招姿勢，被擊倒會換成倒地圖。原本靠調色區分的亞種（毒沼史萊姆、熔岩蝙蝠、水晶魔像等）現在都有自己的造型。'},
  {v:'12.6',d:'2026-11-25',t:'魔物攻擊衝擊感、隨時撤退',b:'魔物的普通攻擊現在會撲向畫面，並依類型打出不同的衝擊演出（爪擊、重砸、魔彈），命中時頭像被擊退、畫面震動，重擊會更強烈。魔物圖不再被上方資訊欄或下方隊伍欄蓋住，會自動縮放到中間的空位。冒險途中任何時候（戰鬥以外）都能從右上角「撤退」回城，戰利品照樣保留。'},
  {v:'12.5',d:'2026-11-25',t:'畫風重製與全新戰鬥畫面',b:'主角與露娜全面換上新的動畫畫風：12 個職業男女各一套全新立繪。戰鬥畫面重新設計——魔物站在畫面中央，我方改在下方以頭像顯示；普通攻擊與受傷時頭像會換表情，施放技能會切入職業專屬的招式姿勢圖，受到重創時會跳出戰損插圖；魔物放技能時改用全螢幕動畫演出（爪擊、震地、咆哮、魔彈），並打出招式名稱。'},
  {v:'12.4',d:'2026-11-23',t:'夜探奇襲、兩種新霧紋、魔力彈',b:'營地與霧窯多了第四個選擇「夜探」：不休息，摸黑去探前面的路，下一場強敵或首領戰由你奇襲——牠一開始來不及反應，你的第一擊傷害 +50%。中段強敵新增兩種霧紋：「漲潮」（每回合攻擊 +12%，拖越久越痛，要速戰速決）與「反震」（單次打太重會震回自己身上，多段攻擊和持續傷害比較吃香）。魔法型首領（樹王、霜龍等）的普通攻擊改成「魔力彈」，看的是魔抗而不是防禦，法系職業比較扛得住、只堆防禦的角色要留意。九顆精鍛霧核換上帶金色箍環的正式圖示。修正：敵人暈眩時預告仍顯示牠下回合會出招，現在會標示「暈眩中」。'},
  {v:'12.3',d:'2026-11-23',t:'營地抉擇：休整、磨刃、搜刮',b:'營地不再只是回血，天亮前只夠做一件事：休整（回復 35% HP／MP）、磨刃（不休息，本趟冒險傷害 +12%，最多兩次）、搜刮（不休息，拿金幣與治療藥水）。帶著霧核時的霧窯也多了「磨刃」可以選。五張地圖各多一個新事件，路邊的磨刀匠、岩縫裡的溫泉、封死的軍械庫也有機會磨刃。營地選項、裂紋霧核與三種霧紋換上正式圖示。修正手機戰鬥中「全自動」按鈕蓋住指令按鈕的問題。'},
  {v:'12.2',d:'2026-11-23',t:'崩解霧核、換霧核的老人',b:'新增第十一顆「崩解霧核」：每命中敵人 5 下（多段招式每段都算）就打出「崩解」，下一次行動傷害 +50%，狀態列會顯示累積進度，連擊流和多段招式特別吃香（精鍛後只要 4 下）。選霧核時，和你目前流派契合的那顆會標出來。帶著霧核冒險時，路上可能遇到「換霧核的老人」，補差價或殺價把霧核換成另一顆。握有「下一擊 +50%」時狀態列會亮起提示。全自動遇到打不斷的首領蓄力會先防禦，不再硬吃毀滅一擊。草原首領哥布林戰酋調弱（攻擊約 -19%、HP 約 -15%），畢竟那時露娜還沒加入。'},
  {v:'12.1',d:'2026-11-23',t:'霧窯：休息，還是重鍛霧核',b:'帶著霧核走到營地時，營地旁多了一座「霧窯」，今晚只夠做一件事：在營火旁休息（回復 35% HP 與 MP），或是不休息、把霧核送進窯裡重鍛成「精鍛霧核」——十顆霧核的效果都會提升（例如獵牙 +30% → +45%、磐石護盾 20% → 32%、湧泉每回合回魔 6% → 10%）。血還夠就賭一把變強，殘血就老實睡覺。另外：成功打斷首領蓄力後，首領會露出破綻，你的下一擊傷害 +50%。平衡：霜雪山脈與黑霧要塞的首領再加強一些；大魔導士「墜星」威力下修（原本兩回合就能打倒雪山首領）。'},
  {v:'12.0',d:'2026-11-23',t:'霧紋強敵與裂紋霧核',b:'每趟冒險中段的強敵現在會帶一種「霧紋」，出發時就看得到：疊甲（同回合越打越硬，適合單發重擊）、霧隱（每回合第一擊減半，持續傷害能逼牠現形）、記仇（血越少打越痛，要一口氣收尾）。霧紋強敵比以前更耐打、更兇，金幣也更多，出發前先想好帶什麼招。修正：打倒帶特性的敵人後，補上來的小怪不會再繼承牠的特性。另外新增第十顆「裂紋霧核」：敵人身上每多一種異常狀態，你的傷害就再高一截。'},
  {v:'11.9',d:'2026-11-23',t:'打斷首領蓄力',b:'首領蓄力準備放【毀滅一擊】時，除了防禦多了一個選擇：在牠蓄力的那一回合打出足夠傷害（首領 HP 的 12%）就能直接打斷，牠會失去那一回合並陷入虛弱。預告下方有打斷進度條，打得到時會提示；每打斷一次，下次門檻會提高。留著大招等牠蓄力、或靠夥伴與灼燒補傷害，都是辦法——但沒打到門檻就得硬吃整招。新增第九顆「破勢霧核」：打斷門檻 -30%，打斷後首領多暈眩 1 回合。另外，森林之後的首領攻擊與 HP 小幅提高，自動戰鬥也學會抓時機打斷。'},
  {v:'11.8',d:'2026-11-23',t:'霧核有了圖示，新增「淬鍊霧核」',b:'七顆霧核換上正式圖示，選擇畫面與戰鬥狀態列都看得到。新增第八顆「淬鍊霧核」：拿了之後下一場戰鬥敵人攻擊 +25%，撐過去以後這趟冒險你的傷害 +25%，而且每場開場回復 15% HP——先苦後甘，離首領還有一段路時才會出現。'},
  {v:'11.7',d:'2026-11-23',t:'雲端帳號',b:'設定新增「雲端帳號」：註冊帳號和密碼後，手機和電腦登入同一個帳號就會共用同一份進度並自動同步。原本的轉移碼和存檔碼也還能用。'},
  {v:'11.6',d:'2026-11-22',t:'霧核：中段強敵的戰利品',b:'打倒冒險中段的強敵後，牠會留下三顆「霧核」讓你帶走一顆，效果持續到這趟冒險結束：獵牙（對滿血敵人更痛）、斷罪（收尾更狠）、沸血（殘血反擊）、磐石（開場護盾）、湧泉（每回合回魔）、餘燼（敵人開場灼燒虛弱）、貪婪（金幣與掉寶變多，但敵人更兇）。配合自己的流派挑，後面兩段路和首領的打法會不一樣。'},
  {v:'11.5',d:'2026-11-22',t:'冒險路線加長',b:'每次冒險從 6 段加長為 8 段：中段固定出現一隻強敵，打完後的岔路一定有營地可以休息，再走兩段才到首領。獎勵也跟著變多。'},
  {v:'11.4',d:'2026-11-21',t:'魔物蓄力姿勢',b:'全部魔物與首領新增「蓄力姿勢」：牠們準備放大招時會擺出預備動作並泛紅光，看到就該防禦或搶先打斷。'},
  {v:'11.3',d:'2026-11-21',t:'戰鬥演出再升級',b:'多段技能會一下一下跳出每段傷害與連段數；大傷害數字更大；灼燒、連擊、引爆等效果以標籤跳出；擊破魔物有「擊破」大字、首領登場有警示橫幅；HP 低於三成畫面邊緣泛紅；戰鬥背景會緩緩移動。'},
  {v:'11.2',d:'2026-11-21',t:'戰鬥表現強化',b:'爆擊與最後一擊會頓格並推近鏡頭；灼燒、中毒、荊棘、守護反擊、露娜等額外傷害改用不同顏色的數字跳出；魔物蓄力時全身泛紅光；奧義技能會出現角色頭像特寫。'},
  {v:'11.1',d:'2026-11-21',t:'狂戰士新造型',b:'狂戰士全套立繪重新設計：獸皮披肩、紅色戰紋、尖刺肩甲與缺口巨劍，更有野性；另修正多個職業站姿。'},
  {v:'11.0',d:'2026-11-21',t:'流派共鳴',b:'①全新「流派共鳴」：裝備上的稀有詞綴（烈焰、連擊、震擊、吸血、守護、先機、絕境、荊棘、疾風、收割）湊到 2 件、3 件會產生共鳴，直接改變戰鬥方式，例如灼燒疊三層、技能觸發連擊、致命傷撐住一次。角色頁新增「我的流派」。②鐵匠鋪新增「銘刻詞綴」：稀有以上裝備可以指定詞綴，打造自己的流派。③稀有、史詩裝備出現詞綴的機率大幅提高。④精英與首領戰後顯示「戰報」，看得到傷害來自哪裡。⑤技能配置：技能多於 4 招時，要選 4 招帶進戰鬥（Lv.30 起 5 招），招式組合也是流派的一部分。⑥惡夢與高塔首領每週輪換「首領特性」（鋼皮、不死、魔障、狂怒、尖刺），要換流派來攻略，星象台可查看本週特性。火山／遠征隊／輕裝／森林 4 件套也算一件詞綴。'},
  {v:'10.5',d:'2026-11-21',t:'自動戰鬥防守節制',b:'修正惡夢難度下自動戰鬥一直防禦：只有對方大招會打掉三成五以上血量才防禦；連續防守兩次後，除非下一招會被打倒，否則一定改為攻擊。'},
  {v:'10.4',d:'2026-11-21',t:'自動戰鬥再調整',b:'①自動戰鬥先判斷能不能收掉對手：一擊能打倒就直接攻擊；兩回合內能打倒、又不會被反殺時，不再防禦、反擊或上增益。②自動戰鬥與全自動的節奏加快 25%。'},
  {v:'10.3',d:'2026-11-21',t:'露娜羈絆',b:'修正露娜羈絆在營火對話看完後就無法再提升的問題：現在和露娜一起完成冒險、打倒首領、每天營火閒聊都會累積羈絆（每天上限 1.5）。'},
  {v:'10.2',d:'2026-11-21',t:'自動戰鬥更積極',b:'自動戰鬥不再過度保守：只有對方大招真的會痛才防禦，反擊與護盾只在預告重擊時使用，增益只對耐打的精英與首領開，回血與喝藥改在血量三成以下（或下回合會被打很痛時）才做。'},
  {v:'10.1',d:'2026-11-21',t:'掉寶一鍵換上＋特級藥水',b:'①打贏後的戰利品卡片，若比身上那件強，會標出強多少，按「換上」直接裝備，不用再翻背包。②第五章起道具店賣「特級治療藥水」（回復 800 HP，240 G），自動戰鬥會依缺血量挑大瓶或小瓶喝。③騎士、遊俠、祭司、大魔導士、咒術師、神射手、刺客、主教的站姿立繪重畫上線。'},
  {v:'10.0',d:'2026-11-21',t:'全自動強化',b:'全自動回城時會自動整備：簽到、領每日、占卜、分配屬性點與技能點、換上更好的裝備、補足藥水；練到下一區等級會自動前往新地區。血量偏低時岔路會優先走營地、避開埋伏；金幣不夠休息但血量還夠時不再停止。'},
  {v:'9.9',d:'2026-11-21',t:'電腦版版面',b:'用電腦寬螢幕開啟時，遊戲畫面自動放大置中，左側顯示角色、裝備與今日任務，右側顯示排行榜、系統訊息與更新公告。'},
  {v:'9.8',d:'2026-11-20',t:'裝置轉移',b:'設定新增「裝置轉移」：舊裝置按「產生轉移碼」得到 6 碼，在新裝置輸入就能搬走進度，24 小時內有效、用一次就失效。原本的存檔碼也還能用。'},
  {v:'9.7',d:'2026-11-20',t:'用道具換結果的新事件',b:'①五張地圖各多一個事件：突來的雷雨、捕獸夾上的狐狸、失控的礦車、凍僵的信鴿、黑霧祭壇。②部分選項可以「消耗藥水」換穩定的報酬，身上沒有就不能選。③要花錢的選項會標出價格，錢不夠時不能選。④修正事件扣魔力時可能變成負數的問題。⑤劍士、法師待機與站姿立繪重畫（手部更自然）。'},
  {v:'9.6',d:'2026-11-20',t:'各地新事件＋狂戰士新造型',b:'①五張地圖各多一個專屬事件：翻倒的貨車、滴蜜的大樹、發光的瓦斯、被雪埋住的雪橇、地牢裡的人，有的要花錢或冒險換裝備。②狂戰士男女換上新服裝（深紅短戰袍＋單邊肩甲），全部動作與頭像重畫。'},
  {v:'9.5',d:'2026-11-20',t:'排行榜改版',b:'排行榜顯示前 100 名，新增戰力／等級／討伐／強化四種排行與職業篩選，顯示頭像、主線章節、最後上線時間與你的名次。'},
  {v:'9.5',d:'2026-11-20',t:'自動戰鬥會喝魔力藥水',b:'自動／全自動戰鬥遇到首領、精英等硬敵時，魔力見底會自動喝魔力藥水（缺得多才用高級版），不再只能普攻硬磨。'},
  {v:'9.4',d:'2026-11-20',t:'生活機能調整',b:'①占星師新增「每日星象」：每天免費占卜一次，抽一個整天有效的祝福（經驗、金幣、掉寶、爆擊、屬性連鎖）。②每日任務獎勵大幅提高，三項全完成再送寶石與強化石。③裝備強化到 +10 會多開一個寶石孔，精英魔物也會掉寶石。'},
  {v:'9.3',d:'2026-11-20',t:'強化改版',b:'強化加入鐵鎚演出；6% 機率「大成功」直接 +2。+7 以上失敗仍會降一級。'},
  {v:'9.2',d:'2026-11-20',t:'攻防與屬性改版',b:'①魔物防禦與魔抗隨等級成長，破甲、穿透與物理／魔法的選擇更重要。②主角新增「魔抗」，布甲、輕甲、項鍊、戒指提供，重甲防禦高但魔抗低。③新增火、冰、雷、暗抗性，魔物屬性招式會被抗性減傷，森林／火山／雪地／雷擊套裝附帶對應抗性，詞條也會出現。④屬性連鎖：冰凍時火攻「碎冰」、灼燒時冰攻「蒸發」、雷打冰凍「導電」、雷打中毒「毒爆」、聖打虛弱「淨化」、暗打流血「血蝕」，傷害提高。'},
  {v:'9.1',d:'2026-11-20',t:'立繪重繪',b:'12 個職業男女的站姿立繪全部重新繪製，手部改為自然放鬆或握住武器。'},
  {v:'9.0',d:'2026-11-20',t:'異常狀態特效',b:'中毒、灼燒、流血、虛弱、再生、暈眩、冰凍都改成發光質感：腳下有脈動光圈，加上毒霧、煙、冰霧、光粒等層次。'},
  {v:'8.9',d:'2026-11-20',t:'物理特效',b:'斬擊、打擊、射擊命中時加上發光火花、斬痕殘光、衝擊波、碎石與地面揚塵，打擊感更強。'},
  {v:'8.8',d:'2026-11-20',t:'元素特效',b:'冰、雷、聖光、暗、毒等所有元素粒子都改成發光質感；魔物技能也加上元素光粒，不再只是一團簡單的光。'},
  {v:'8.7',d:'2026-11-20',t:'火焰特效',b:'所有火焰類特效改成會發光的火光（點火、火焰風暴、鬥氣、灼燒、魔物火焰技能），火的質感更亮更真。'},
  {v:'8.6',d:'2026-11-20',t:'魔物放大',b:'史萊姆、蝙蝠、角兔、書蠹等小型魔物，以及狼、雷鷹，在戰鬥畫面中放大顯示。「全自動」按鈕改為進入地圖後才出現。'},
  {v:'8.5',d:'2026-11-20',t:'露娜新台詞',b:'露娜會依你的職業、進階職、性別說不同的話；你放技能時她也會即時反應。出發與營火時也有專屬閒聊。'},
  {v:'8.4',d:'2026-11-20',t:'全自動與站位',b:'全自動時自己點岔路或選項，就不會再擲骰子，直接照你的選擇走。露娜改站在主角後方。'},
  {v:'8.3',d:'2026-11-20',t:'法師強化',b:'角色面板改為「物理攻擊／魔法攻擊」，職業主攻會標亮。法杖魔攻 +15%，木戒指系列新增魔攻，木珠串系列魔攻提高。隨機詞條不再出現用不到的屬性（法師不會再抽到物理攻擊、力量）。'},
  {v:'8.2',d:'2026-11-20',t:'裝備改名',b:'裝備、套裝與詞綴名稱改得更直白好懂，例如「翠影」套裝改為「森林」、「秘紋頭環」改為「刻紋頭環」、「渴血」改為「吸血」。能力完全不變。'},
  {v:'8.1',d:'2026-11-20',t:'玩家意見回報',b:'城鎮新增「意見回報」：錯誤、建議、平衡、美術都可以留言，所有玩家都看得到，開發者會不定期回覆。'},
  {v:'8.0',d:'2026-11-20',t:'開服大改版',b:'① 全職業立繪、頭像、魔物重新繪製，造型統一。② 第七章「沉沒的檔案館」開放。③ 裝備增加到 116 件，進階職業有專屬武器。④ 每張地圖有自己的探索特性與專屬事件。⑤ 新增五位旅人，冒險途中可能遇見他們。'},
  {v:'7.8',d:'2026-11-20',t:'第七章「沉沒的檔案館」',b:'第二部第七章開放：潛入大教堂底下的王都地下書庫，找出遠征隊名冊的真相。新地區積水書庫（Lv.30–33）、四種新魔物與首領「檔案守門人」，各自有專屬掉落裝備。劇情插圖全面換成主角通常造型，所有裝備都有專屬圖示，隊友露娜與蓋爾在戰鬥中也有動作了。'},
  {v:'7.7',d:'2026-11-20',t:'每章探索不同',b:'每張地圖有自己的地區特性：草原順風寶箱多、森林迷霧遮住岔路、礦坑會落石、雪山酷寒扣 HP、要塞霧蝕魔物更多、灰石街道盜賊橫行、地下書庫積水扣 MP。每張地圖也有 4 個專屬探索事件，會優先出現，例如走散的羊群、停住的蝴蝶、礦坑深處的歌聲、山頂的極光、跪著的黑騎士、廢棄驛站的帳本。灰石街道的三種魔物也有了專屬掉落裝備。'},
  {v:'7.6',d:'2026-11-20',t:'裝備擴充',b:'裝備從 70 件增加到 116 件。8 個進階職業各有兩把專屬武器（Lv.20、Lv.26），附帶職業特色效果；頭、身、腳、戒指、項鍊每一階多一條路線，例如法冠、輕甲、重靴、力量戒、智者項鍊，同一階可以依職業和打法挑選。'},
  {v:'7.5',d:'2026-11-20',t:'美術全面翻新',b:'12 個職業男女全部動作圖與站姿依統一規格重繪：武器、服裝固定，比例與角度一致。10 種新魔物與 5 位區域領主換上正式立繪，魔物專屬裝備也有了專屬圖示。'},
  {v:'7.4',d:'2026-11-19',t:'區域領主',b:'每張地圖新增一位區域領主：巨角兔王、月牙狼王、白骨礦工頭、冰川巨人王、黑霧將軍。岔路上出現「👹 領主巢穴」時才會遇到，首領級強度，每位固定掉落一種寶石（黃玉、月石、紅玉、翠玉、藍玉），也有機會掉裝備。'},
  {v:'7.3',d:'2026-11-19',t:'首領寶石分類',b:'每位首領固定掉一種寶石：哥布林戰酋＝紅玉（攻擊）、腐根樹王＝翠玉（HP）、鑽岩巨蟲＝黃玉（爆擊）、凜冬霜龍＝月石（迴避）、黑霧大術士澤諾斯＝藍玉（魔力）；第二部首領隨機掉落五種之一。點首領圖像可查看。'},
  {v:'7.2',d:'2026-11-19',t:'寶石改為首領限定',b:'鑲嵌寶石改為只有首領會掉落：主線首領必掉 1 顆、惡夢首領有機會 2 顆、無盡之塔首領 30%。合成、分解、異變種、惡夢小怪不再產出寶石。已持有與已鑲嵌的寶石全部回收，每顆補償 120 G。'},
  {v:'7.1',d:'2026-11-19',t:'掛機時也能冒險',b:'背景掛機期間可以照常出發冒險、挑戰無盡之塔、開全自動，掛機收益會繼續累積，不用再先結束掛機。'},
  {v:'7.0',d:'2026-11-19',t:'裂甲擊破甲、新站姿立繪',b:'劍士的「裂甲擊」現在會劈開護甲，無視物理抗性（史萊姆、幽靈這類不怕刀砍的魔物，改用裂甲擊就能打出正常傷害，命中時跳出「裂甲！」）。角色頁裝備欄的站姿立繪全部 12 職業男女到齊；劍士全套戰鬥圖換成新版。'},
  {v:'6.9',d:'2026-11-19',t:'魔物專屬裝備',b:'10 種新魔物各有一件史詩級專屬裝備，帶有獨特效果：毒沼凝晶戒、雷角疾靴、噬魂菇冠、幽影狼皮甲、熔岩蝠翼墜、水晶核心、暴雪狼牙鍊、雪暴精靈之冠、血誓戰靴、虛無幽魂斗篷。一般 4%、精英 12%、寶藏魔物 30%、徘徊強敵 50% 掉落；點魔物圖像可看牠掉什麼。'},
  {v:'6.8',d:'2026-11-19',t:'新魔物與稀有遭遇',b:'每張地圖新增 2 種魔物（毒沼史萊姆、雷角野兔、噬魂紫菇、幽影狼、熔岩蝙蝠、水晶魔像、暴雪狼、雪暴精靈、血誓騎士、虛無幽魂），各有不同技能與弱點。冒險中可能遇到閃閃發亮的「寶藏魔物」（3 回合內打倒才拿得到大量金幣與裝備）和危險的「徘徊強敵」（強大但掉落豐厚）。'},
  {v:'6.7',d:'2026-11-19',t:'裝備隨機性提升',b:'新掉落的裝備多了「品質」：主屬性在 85%～125% 之間隨機，3% 機率出現 130%～140% 的【完美】裝備；附加詞條數值浮動加大（70%～130%）；稀有以上有 20% 機率多一條詞條。同名同稀有度的裝備也會有明顯差異，值得多刷幾件挑最好的。'},
  {v:'6.6',d:'2026-11-19',t:'裝備封印',b:'比主線進度更遠的地區裝備會暫時「封印」：屬性依超前的階數降低，稀有詞綴與首領專屬效果暫時無效。裝備不會消失，推進主線到該地區就自動完全解除。已經在無盡之塔拿到高階裝備的冒險者也適用。之前因為在塔裡打倒首領而被誤標「已通關」的地區會自動恢復成正確的主線進度。'},
  {v:'6.5',d:'2026-11-19',t:'無盡之塔掉落調整',b:'無盡之塔掉落的裝備階級不再超過主線進度；塔內首領改為掉 1 件精良以上裝備（原本 2 件稀有以上），一般魔物掉落率降低；首領專屬傳說要先在主線擊敗該首領才會在塔裡掉落，機率 3%。超出主線進度的樓層改為有機會掉強化石。修正在塔裡打倒首領會被誤算成主線通關的問題。'},
  {v:'6.4',d:'2026-11-19',t:'裝備平衡',b:'前期裝備主屬性提升（第 1 階 +40%、第 2 階 +20%），普通與精良在前期更有用；附加詞條的數值浮動變小，比較不會抽到很爛的詞條；稀有詞綴的效果改為依裝備階級成長（第 1 階 50%，第 6 階滿值），避免低階傳說一件打天下。爆擊與爆傷詞條維持不變。'},
  {v:'6.3',d:'2026-11-19',t:'背包篩選升級',b:'裝備頁可以依部位（武器、頭盔、鎧甲、鞋子、戒指、項鍊）、稀有度（精良以上～傳說）篩選，並可只看「▲更強」、套裝、詞綴／閃耀／專屬裝備；排序可選戰力、稀有度、等級、最新。設定會記住。'},
  {v:'6.2',d:'2026-11-19',t:'懸賞情報＋新圖',b:'旅行商人開始兜售「懸賞情報」：花一筆金幣，下一場普通戰鬥就會遇上守寶的精英魔物——更危險，但打倒必掉裝備、金幣 ×2。要不要賭，看你的血量和藥水。神射手、聖殿騎士（女）、主教共 5 張動作圖重畫上線（弓弦、握杖修正、拿掉多餘特效）。'},
  {v:'6.1',d:'2026-11-19',t:'一鍵販售',b:'背包裝備頁新增「一鍵販售普通、精良」與「一鍵販售稀有以下」，鎖定、裝備中、閃耀與帶稀有詞綴的裝備都會保留。'},
  {v:'6.0',d:'2026-11-19',t:'裝備改名',b:'首領專屬裝備改成符合新首領名稱：戰酋黑晶護符、腐根樹王之心、鑽岩巨顎、凜冬龍鱗鎧、黑霧魔冠。其他不合理的名稱也一併修正：雷霆權杖、霜風長弓、天使聖錘、雷步戰靴、祭司短槌、祈禱戰錘、黑狼牙項鍊、岩晶墜飾、岩晶戒、橡木指環、黑狼之牙。已持有的裝備會自動顯示新名稱。'},
  {v:'5.9',d:'2026-11-19',t:'狀態實體特效',b:'中毒會冒出綠色毒泡、燃燒會有火焰與火星往上竄、流血會滴落在地上、冰凍會被冰殼包住、暈眩頭上轉星星、弱化往下沉的紫色箭頭、再生飄綠色十字，角色身上也會泛出對應顏色的光。怪物情報裡的印記改成圖示。'},
  {v:'5.8',d:'2026-11-19',t:'戰鬥畫面精簡',b:'怪物資訊框只留名稱、血條與下回合預告；點怪物圖像或資訊框就能看完整數值（攻防、弱點、韌性爆抗、狀態），查看時戰鬥自動暫停，關閉後繼續。'},
  {v:'5.7',d:'2026-11-19',t:'怪物韌性與爆抗',b:'爆擊率與爆擊傷害維持原本的強度；改為讓怪物擁有「韌性」（降低你的爆擊率）與「爆抗」（降低爆擊額外傷害），越後面的地圖、精英、首領、惡夢與強敵化的魔物越高，戰鬥畫面可以看到數值。'},
  {v:'5.6',d:'2026-11-19',t:'排行榜可看玩家裝備',b:'點排行榜上的玩家，就能看到他的角色立繪、六個部位的裝備與能力值。修正重新整理後會被當成新玩家的問題。'},
  {v:'5.5',d:'2026-11-19',t:'線上戰力排行榜',b:'排行榜開始連線真實玩家：遊戲每 5 分鐘自動上傳你的戰力，榜上標「玩家」的都是真人。伺服器暫時連不上時，會自動改回顯示 NPC 與好友戰力碼。'},
  {v:'5.4',d:'2026-11-19',t:'強敵化',b:'裝備太強、可以一招秒殺魔物時，魔物會「強敵化」：血量與攻擊依你的實力提升，同時給更多經驗與金幣。前期與正常裝備時不受影響。'},
  {v:'5.3',d:'2026-11-19',t:'露娜的職業：燈術士',b:'露娜有了自己的職業【燈術士】與技能：燈火彈、蒼焰、照路之光（治療）、守燈結界（看到敵人大招替你擋 40%）、霧散之光（削弱敵人）、奧義誓約之燈（每場一次）。技能隨章節與羈絆解鎖，角色頁可查看。戰鬥畫面中露娜站到主角身後、尺寸放大，出招時會喊招式名並有專屬特效。'},
  {v:'5.2',d:'2026-11-19',t:'人物會說話了＋好友戰力榜',b:'露娜、主角和鎮上的人更像真人：戰鬥中會即時對話（開戰、首領、爆擊、危急、完美防禦、勝利），營火時和露娜聊天、隨章節慢慢聊開她的過去，岔路前也會閒聊；鎮上 NPC 的招呼會依劇情進度、時間和你的狀態改變。排行榜可以用「戰力碼」加入真實好友一起比。'},
  {v:'5.1',d:'2026-11-19',t:'自動收益調整',b:'全自動冒險與背景掛機的收益減半：全自動戰鬥的經驗、金幣與一般裝備掉落減半（首領與寶物守衛不受影響）；背景掛機的經驗、金幣、裝備與素材減半。手動遊玩收益不變。'},
  {v:'5.0',d:'2026-11-19',t:'更新廣播',b:'遊戲更新後，畫面上方會出現跑馬燈系統廣播告訴你更新了什麼；遊玩中有新版本推出時，也會即時廣播並提供「立即更新」按鈕。'},
  {v:'4.9',d:'2026-11-19',t:'背景掛機＋人物裝備欄',b:'冒險頁新增「背景掛機」：選地圖後角色自動打怪，關掉遊戲也會累積（最多 12 小時），隨時結束並看結算畫面。角色與背包的裝備改成人物立繪兩側分部位擺放，點部位就能看裝備詳細資料。'},
  {v:'4.8',d:'2026-11-19',t:'斬殺線：看準時機收尾',b:'敵人血量掉到一擊就能收掉時，敵方狀態列會亮出「🗡 普攻可斬殺」或「🗡 技能可斬殺」，提醒你這回合不必再架刀防守，直接出手結束戰鬥（多隻敵人同時在場時不顯示）。自動戰鬥也學會了：能一擊收掉就用最省 MP 的招式直接斬殺；對方攻擊不痛、下回合就能打完時，不再浪費回合招架。實測全自動劍士防守回合從約 45% 降到約 27%。'},
  {v:'4.7',d:'2026-11-19',t:'全自動放慢＋命運骰子',b:'全自動速度放慢一半，方便觀戰；遇到岔路、事件或劇情抉擇時再放慢，並擲出命運骰子：1～3 走左邊、4～6 走右邊。'},
  {v:'4.6',d:'2026-11-19',t:'特效定位修正',b:'技能特效改成依照角色與魔物的實際位置與大小定位：魔法陣、冰晶、火柱、震地、藤蔓都落在腳下影子處，命中光效在身體中心，首領、飛行魔物、小型魔物都對得準。'},
  {v:'4.5',d:'2026-11-19',t:'魔物改名',b:'魔物與首領名稱重新整理，更有魄力也更合理：尖角野兔、哥布林掠奪者、哥布林戰酋、瘴氣毒菇、黑森狼、枯藤樹精、腐根樹王、吸血蝙蝠、亡骸礦工、礦脈岩魔像、鑽岩巨蟲、霜牙雪狼、凍晶妖精、冰川巨人、凜冬霜龍、墮落黑騎士、怨靈魅影、煉獄魔衛、黑霧大術士澤諾斯。'},
  {v:'4.4',d:'2026-11-19',t:'首領寶物堆：三箱選一',b:'討伐首領後，戰利品旁會多出一堆寶物，但只能帶走一箱：👑 金冠寶箱（穩拿大把金幣＋強化石）、💠 蒼紋寶箱（一件稀有以上裝備，12% 升為史詩）、⛓️ 封印寶箱（35% 史詩裝備、可能帶職業套裝，否則落空）。缺錢、缺裝還是賭一把，由你決定。另外法師前期火力稍微收斂：點火 160%→140%、霜針 160%→150%（原本每場不到 3 回合，比其他職業快一倍）。'},
  {v:'4.3',d:'2026-11-19',t:'劍士手感調整：更重的普攻與鬥志',b:'劍士原本打一隻怪要 11 回合以上、MP 很快見底只能乾砍。現在劍士普攻威力 +15%，命中時燃起「鬥志」回復 5% MP；裂甲擊 140%→155%。普攻疊破綻、攢 MP，裂甲擊一口氣疊兩層，再找時機十字裂斬清算——節奏比以前更有來回。實測劍士每場戰鬥回合數約減半，與神官相近。'},
  {v:'4.2',d:'2026-11-19',t:'物理特效與實體印記',b:'命中時火花、碎石、冰片、水滴、火星與煙塵會受重力落下、在地面彈跳、浮起飄散；被擊中的角色會像彈簧一樣晃回原位。法師等職業的印記不再只是文字：會變成環繞敵人的發光符印（灼焰、冰晶、蝕魂、奧術、星），引爆時被吸進敵人體內炸開。'},
  {v:'4.1',d:'2026-11-19',t:'稀有詞綴：裝備會觸發特殊效果',b:'藍色、紫色裝備現在有 6% 機率帶「稀有詞綴」，掉落時會跳出戰利品卡片。新增四種觸發型詞綴（傳說裝備也會出現）：⚔ 背水（HP 低於 35% 傷害 +30%）、🌵 荊棘（被打中反彈 25% 傷害）、🍃 疾風（每場第一下必中必爆擊）、🌾 收割（每擊倒一個敵人回 10% HP／MP）。背水要冒險壓血、荊棘適合硬吃傷害的打法——要穿哪件，看你怎麼打。'},
  {v:'4.0',d:'2026-11-19',t:'回血怪不再無限再生',b:'史萊姆、樹精、骷髏這類會回血的怪，每用一次回復量只剩上次的 60%，而且用完要隔兩回合才能再用，不會再卡在打不死的長戰。灼燒中的敵人回復量減半：行動預告會顯示這次大約回多少，看到它要回血，先點火再打。自動戰鬥也會在敵人準備回血時優先用灼燒招。'},
  {v:'3.9',d:'2026-11-19',t:'首領前哨：戰前準備三選一',b:'在首領前哨可以先做一項戰前準備，但只能選一個：🔭 偵察動向（花金幣，首領開場 HP -12%）、🪤 布置陷阱（拿一瓶治療藥水當誘餌，首領開場中毒 4 回合、攻擊下降）、🔥 營火調息（免費回 30% HP／MP，但火光會驚動首領，攻擊 +12%）。錢、藥水、血量，看你缺哪個再決定。全自動也會依狀態挑一項。'},
  {v:'3.8',d:'2026-11-19',t:'首領前哨＋自動戰鬥會用毒和火',b:'走到首領前會先停在「首領前哨」：顯示首領等級、你的 HP／MP／藥水和勝算，要硬闖還是帶著戰利品撤退由你決定。全自動在等級差太多或狀態太差時會先撤退練功，不再一直衝去送死掉金幣。自動戰鬥會把中毒、灼燒、虛弱、暈眩的價值算進去：遊俠會用蛇牙箭、法師更常點火，對付厚血的敵人更有效率。'},
  {v:'3.7',d:'2026-11-19',t:'遊俠專注增傷＋自動戰鬥會看預告',b:'遊俠的專注現在每層讓攻擊 +6%，「屏息」提前到 Lv.5 就能學，雙矢每箭 90%→100%：攢專注變強、什麼時候一箭打光要自己拿捏。自動戰鬥變聰明了：看到敵人下回合要出傷害招，劍士會先架招架反擊、法師會先開薄冰鏡；打首領和精英時會先上增益（伏身、晨禱、鬥氣解放）。冒險地點卡片新增提醒：首領已現身但你等級還不夠時，會先告訴你終點會碰上它。'},
  {v:'3.6',d:'2026-11-19',t:'開局兩招＋閃耀裝備',b:'四職業 Lv.1 就有兩招可選：劍士多了招架反擊、法師多了霜針、遊俠多了蛇牙箭、神官多了審光；原本 Lv.5 的招式提前到 Lv.3。劍士的破綻現在每層讓攻擊 +6%，疊越多越痛。新增 5% 機率掉落「✧閃耀」裝備：多一條詞條、最強詞條 ×1.5，洗練也不會消失。撿到史詩、傳說或閃耀裝備時，勝利畫面會跳出發光的戰利品卡片。'},
  {v:'3.5',d:'2026-11-19',t:'路線與事件改版',b:'岔路會標出危險度，還可能出現特殊標記：💎寶物守衛、💰懸賞、☠詛咒之地、👑大寶箱（小心寶箱怪）、💧靈泉、🎲命運之地。事件選項直接顯示成功率；成功有機會獲得本趟祝福，失敗可能驚動魔物開戰，大成功必掉裝備。同一趟不會遇到重複事件。'},
  {v:'3.4',d:'2026-11-18',t:'敵人行動預告',b:'所有怪物都會在頭上顯示下回合要做什麼。看到紅色⚠大招時按防禦：傷害只剩 25%，還會看穿破綻，下次攻擊 +50%。'},
  {v:'3.3',d:'2026-11-18',t:'特效打磨＋怪物招式改名',b:'特效改成有過程的動畫：聚氣、出招、命中、收尾，魔法陣逐筆畫出、光柱由天劈落、護盾張開再碎裂。施放時角色會衝刺或發光。怪物 57 招都照招式名稱重新設計，並把不順的招式名稱改得更自然。'},
  {v:'3.2',d:'2026-11-18',t:'特效全面重做',b:'改成線上遊戲風格的發光特效：月牙刀光、彗星拖尾、光柱、魔法陣、雷擊、冰晶、火焰。命中時角色閃白、火花爆散、傷害數字彈跳，爆擊更有感。'},
  {v:'3.1',d:'2026-11-18',t:'技能特效重做',b:'移除科幻感的粒子特效，主角 53 招與怪物 57 招全部改成描邊手繪風、照招式名稱設計的動畫：斬擊弧光、火球、冰錐、落雷、光柱、巨鎚、天秤、捕獸夾、咬合、毒霧、藤蔓纏繞等。'},
  {v:'3.0',d:'2026-11-18',t:'全新畫風',b:'全遊戲美術換成新畫風：主角 12 職業男女全部動作、每個技能專屬姿勢、所有怪物、立繪、背景、事件、劇情圖、圖示全面重畫；新增手繪戰鬥特效。'},
  {v:'2.9.1',d:'2026-11-18',t:'BOSS 戰調整',b:'取消對 BOSS 的每回合傷害上限（原本 12%，惡夢 10%），打多少算多少。'},
  {v:'2.9',d:'2026-11-18',t:'設定更新',b:'「全自動」按鈕改成進入關卡後才出現。設定新增「畫面震動＋手機震動」開關，可以關掉。'},
  {v:'2.8',d:'2026-11-17',t:'全自動冒險',b:'右下角新增「全自動」按鈕：自動隨機選路、自動處理事件與祭壇、自動戰鬥；冒險結束會回城休息再出發同一地區。戰敗或金幣不夠休息時自動停止，再按一次即可關閉。'},
  {v:'2.7',d:'2026-11-17',t:'地區音樂與載入改善',b:'每個地區都有自己的探索音樂：草原、迷霧森林、廢棄礦坑、霜雪山脈、黑霧要塞、灰石街道、無盡之塔。圖片載入失敗會自動重試三次。特效改成較柔和的手繪風格。'},
  {v:'2.6',d:'2026-11-17',t:'怪物招式特效',b:'所有怪物招式都換上專屬特效：落石會真的砸下碎石、冰錐是冰柱、催眠粉會飄星星、落雷校正是一道巨雷劈下……招式名稱和畫面一致。'},
  {v:'2.5',d:'2026-11-17',t:'屬性弱點',b:'每種魔物都有弱點屬性（傷害 ×1.5）與抗性屬性（×0.6），打中弱點會跳出「弱點！」。點戰鬥中的怪物名稱可查看弱點、招牌技能與詞綴；圖鑑也會標示。自動戰鬥會優先使用打得到弱點的技能。'},
  {v:'2.4',d:'2026-11-17',t:'戰鬥演出強化',b:'主角每個技能都有專屬動作（陸續上線）。受傷、倒地改在命中瞬間才出現。新增打擊頓幀、擊退、震屏、會彈跳的碎石與塵土，箭矢改為拋物線飛行。'},
  {v:'2.3',d:'2026-11-17',t:'首領蓄力技',b:'首領會每隔幾回合蓄力，下一回合放出無法閃避的【毀滅一擊】。看到蓄力提示就先防禦，傷害會降到四分之一。'},
  {v:'2.2',d:'2026-11-17',t:'物理／魔法傷害區分',b:'魔物新增魔法抗性：魔力造成的傷害看魔抗，攻擊造成的傷害看防禦。防禦型怕魔法、魔法型怕物理，圖鑑會標示弱點。'},
  {v:'2.1',d:'2026-11-17',t:'首領戰調整',b:'首領新增「首領護甲」：每回合受到的傷害最多為最大 HP 的 12%（惡夢 10%）。首領 HP 降到一半時會進入狂怒，獲得護盾並提升攻擊。裝備練起來後，首領戰不會再三下結束。'},

function faTick(){faDraw();if(!FA||!S||FA.busy)return;if(FA.hold&&Date.now()-FA.hold<1500)return;

function faTown(){const msgs=[];try{checkDaily();

  if(S.pts>0){const main=CLS[S.cls].basic==='MAG'?'INT':CLS[S.cls].atk;let n=0;while(S.pts>0&&n<999){const k=(n++%3===2)?'VIT':main;if(S.attr[k]>=ATTRMAX){const o=Object.keys(ATTR).find(x=>S.attr[x]<ATTRMAX);if(!o)break;S.pts--;S.attr[o]++;continue}S.pts--;S.attr[k]++}msgs.push('配點')}
  if(S.sp>0){const ks=mySkills().filter(k=>(S.skl[k]||1)<5&&SK[k].dmg).sort((a,b)=>(S.skl[a]||1)-(S.skl[b]||1));const all=ks.length?ks:mySkills().filter(k=>(S.skl[k]||1)<5);let i=0;while(S.sp>0&&all.length){const k=all[i++%all.length];if((S.skl[k]||1)<5){S.sp--;S.skl[k]=(S.skl[k]||1)+1}else if(all.every(x=>(S.skl[x]||1)>=5))break}msgs.push('升技能')}
  {const ch=autoEquip6();if(ch)msgs.push(`換上 ${ch} 件裝備`)}
  const tier=TLV.reduce((a,v,i)=>v<=S.lv?i:a,0),hp=tier>=2?'pot2':'pot',mp=tier>=2?'eth2':'eth',keep=S.lv*4*3;let bought=0;

  if(bought)msgs.push(`補了 ${bought} 瓶藥`);

  save()}catch(e){}if(msgs.length)toast('全自動整備：'+msgs.join('、'))}
