<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1c2440"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蒼藍誓約 Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面：直式單欄。上 HUD、世界頻道、中央捲動區、下方五格導覽。日式線上 RPG 的象牙面板加金棕框線。 */
  --sky:#a9d6ef; --paper:#f7f0dc; --panel:#fffaf0; --panel2:#f0e4c4;
  --line:#a67c3d; --ink:#2c2742; --sub:#6f6683;
  --navy:#27345f; --navy2:#3c4f8f; --gold:#f0c24b;
  --hp:#dc4b4b; --mp:#3d82d6; --exp:#58a84a;
  --r0:#77717f; --r1:#3c9a4a; --r2:#2f7fd0; --r3:#9a4fd0; --r4:#dc8413;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(var(--sky),var(--paper) 38%);overflow:hidden}

/* HUD */
#hud{display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(var(--navy2),var(--navy));color:#fff;border-bottom:2px solid var(--gold)}
.ava{width:52px;height:52px;flex:none;border:2px solid var(--gold);border-radius:8px;overflow:hidden}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hud-n{display:flex;gap:6px;align-items:baseline;font-size:11px;white-space:nowrap;overflow:hidden}
.hud-n b{font-family:var(--display);font-size:14px;color:var(--gold)}
.hud-n .pw{margin-left:auto;color:#ffe9a8}
.hud-r{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:11px;font-variant-numeric:tabular-nums}
.cur{padding:0 6px;border-radius:9px;background:rgba(0,0,0,.28);white-space:nowrap}
.cur.g{color:#ffe08a}.cur.d{color:#a8e4ff}
.set{font-size:11px;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 6px}
.bar{position:relative;height:11px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .3s}
.bar.hp i{background:linear-gradient(#ff8a7a,var(--hp))}.bar.mp i{background:linear-gradient(#8cc0ff,var(--mp))}.bar.exp i{background:linear-gradient(#a6e08f,var(--exp))}
.bar span{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;color:#fff;text-shadow:0 0 2px #000;font-variant-numeric:tabular-nums}
.bar.exp{height:6px}.bar.exp span{display:none}
.bar.lg{height:16px;background:#cfc3a3}.bar.lg span{line-height:16px;font-size:11px}

#chat{height:24px;line-height:24px;padding:0 10px;font-size:12px;background:rgba(39,52,95,.86);color:#e8ecff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat b{color:var(--gold);font-weight:500}#chat .sys{color:#ffb3a3}
#chat span{display:inline-block;animation:slide .35s}
@keyframes slide{from{transform:translateY(100%);opacity:0}}

#main{flex:1;overflow-y:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:12px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(var(--navy2),var(--navy));border-top:2px solid var(--gold)}
#nav button{position:relative;padding:7px 0 8px;color:#c6cdea;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{display:grid;place-items:center;width:40px;height:28px;border-radius:14px}
#nav button i svg{width:22px;height:22px}
#nav button.on{color:var(--gold)}#nav button.on i{background:rgba(240,194,75,.18)}
.ico svg{width:22px;height:22px}
#nav .dot{position:absolute;top:5px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hp)}
.pre #hud,.pre #chat,.pre #nav{display:none}

/* 共用 */
h2{font-family:var(--display);font-size:18px;color:var(--navy);text-wrap:balance}
h3{font-family:var(--display);font-size:16px;color:var(--navy)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 2px 0 rgba(86,60,20,.25);display:flex;flex-direction:column;gap:8px}
.panel>h3{border-bottom:1px dashed var(--line);padding-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row>.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12px}
.btn{padding:8px 12px;border-radius:8px;border:2px solid var(--line);background:linear-gradient(#fffdf5,var(--panel2));font-weight:700;color:var(--navy);box-shadow:0 2px 0 rgba(86,60,20,.3);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:linear-gradient(var(--navy2),var(--navy));color:var(--gold);border-color:var(--gold)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.big{padding:12px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:7px 0;border-radius:8px 8px 0 0;border:2px solid var(--line);border-bottom:none;background:var(--panel2);font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--panel);color:var(--navy)}
.tabs+.panel{border-top-left-radius:0;border-top-right-radius:0;margin-top:-12px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:var(--navy);color:var(--gold);white-space:nowrap}
.tag.red{background:var(--hp);color:#fff}.tag.ok{background:var(--exp);color:#fff}.tag.off{background:#b9b2a2;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}.c4{color:var(--r4)}
.ico{flex:none;width:38px;height:38px;border-radius:8px;border:2px solid currentColor;background:#fff;font-family:var(--display);font-size:17px;display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;width:100%}
.item .grow{flex:1;min-width:0}.item b{display:block}.item .sub{display:block}
.empty{text-align:center;color:var(--sub);padding:18px 0}

/* 插畫預留位 */
.art{position:relative;overflow:hidden;border-radius:8px;border:2px dashed var(--line);background:repeating-linear-gradient(45deg,#efe2bd 0 10px,#f7edd2 10px 20px);width:100%}
.art.r169{aspect-ratio:16/9}.art.r34{aspect-ratio:3/4}.art.r11{aspect-ratio:1/1}
.art-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px;color:#7a5c2a}
.art-ph em{font-style:normal;font-size:10px;padding:0 6px;border:1px solid currentColor;border-radius:8px}
.art-ph b{font-family:var(--display);font-size:14px}
.art-ph i{font-style:normal;font-size:10px;font-family:ui-monospace,Menlo,monospace;opacity:.8;word-break:break-all}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art img.under{z-index:0}.art.has img.under{display:none}.art img:not(.under){z-index:1}
.art.mini img{object-position:50% 12%}
.art.mini{border:none;border-radius:0;height:100%}.art.mini em,.art.mini i{display:none}.art.mini b{font-size:11px}

/* 標題 */
.title{display:flex;flex-direction:column;gap:12px}
.title h1{font-family:var(--display);font-weight:900;font-size:34px;color:var(--navy);letter-spacing:.12em;text-align:center}
.title .en{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--sub)}
.title label,.lbl{font-weight:700;color:var(--navy);font-size:13px}
input,textarea{font:inherit;width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.cls-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cls{border:2px solid transparent;border-radius:10px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:13px}
.cls .art i,.cls .art em{display:none}
.cls.on{border-color:var(--navy);background:var(--panel2)}

/* 城鎮 */
.banner{position:relative}.banner .cap{position:absolute;left:8px;bottom:8px;background:rgba(39,52,95,.88);color:#fff;padding:2px 10px;border-radius:6px;font-family:var(--display)}
.banner .cap small{font-family:var(--body);color:var(--gold);margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fac{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;box-shadow:0 2px 0 rgba(86,60,20,.25)}
.fac .pt{width:44px;height:58px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fac b{display:block;font-family:var(--display);color:var(--navy)}.fac span{font-size:11px;color:var(--sub)}

/* 冒險 */
.area{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.area.lock{opacity:.55}
.pips{display:flex;gap:6px;justify-content:center}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:11px;color:var(--sub)}
.pip.done{background:var(--exp);border-color:var(--exp);color:#fff}.pip.now{background:var(--gold);color:var(--navy);font-weight:700}
.pip.boss{border-color:var(--hp);color:var(--hp)}
.die{width:84px;height:84px;margin:4px auto;border-radius:16px;border:3px solid var(--navy);background:#fff;font-family:var(--display);font-weight:900;font-size:38px;display:grid;place-items:center;color:var(--navy);box-shadow:0 4px 0 var(--navy)}
.die.ok{border-color:var(--exp);color:var(--exp);box-shadow:0 4px 0 var(--exp)}.die.ng{border-color:var(--hp);color:var(--hp);box-shadow:0 4px 0 var(--hp)}
.calc{text-align:center;font-variant-numeric:tabular-nums}
.opt{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;white-space:normal}

/* 戰鬥 */
.battle{display:flex;flex-direction:column;gap:8px}
.stage{position:relative;height:clamp(230px,52vh,440px);border:2px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(#bfe6fb 0 55%,#9ed27f 55%)}
.stage.bg-forest{background:linear-gradient(#5b6f8f 0 50%,#3f6b4a 50%)}
.stage.bg-mine{background:linear-gradient(#3b3440 0 50%,#6b5847 50%)}
.stage.bg-snow{background:linear-gradient(#cfe3f5 0 52%,#f4f8fc 52%)}
.stage.bg-castle{background:linear-gradient(#2a1838 0 52%,#4a2740 52%)}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spr{position:absolute}
.spr.foe{right:7%;top:9%;width:38%}
.spr.me{left:5%;bottom:3%;width:32%}
.plat{position:absolute;left:-12%;right:-12%;bottom:-8px;height:26px;border-radius:50%;background:rgba(0,0,0,.22)}
.ibox{position:absolute;background:var(--panel);border:2px solid var(--navy);border-radius:8px 2px 8px 2px;padding:4px 8px;font-size:12px;box-shadow:2px 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;gap:3px}
.ibox.foe-i{left:8px;top:8px;width:50%}.ibox.me-i{right:8px;bottom:8px;width:54%}
.ibox .nm{display:flex;justify-content:space-between;gap:6px;font-weight:700;white-space:nowrap;overflow:hidden}
.ibox .num{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
.ibox .chip{font-size:10px;padding:0 5px}
.bbar{height:8px;background:#4a4458;border-radius:4px;overflow:hidden;border:1px solid #2c2742}
.bbar.s{height:5px}
.bbar i{display:block;height:100%;transition:width .6s ease-out .15s}
.bbar i.g{background:#4fce5d}.bbar i.y{background:#f0c24b}.bbar i.r{background:#e2483f}.bbar i.m{background:var(--mp)}
.in-r{animation:inR .5s ease-out}.in-l{animation:inL .5s ease-out}
@keyframes inR{from{transform:translateX(160%)}}@keyframes inL{from{transform:translateX(-160%)}}
.lunge-me{animation:lgM .4s}@keyframes lgM{40%{transform:translate(38%,-28%)}}
.lunge-foe{animation:lgF .4s}@keyframes lgF{40%{transform:translate(-38%,28%)}}
.spr.hit .art{animation:hitA .5s .2s}@keyframes hitA{0%,40%,80%{opacity:.15;transform:translateX(-5px)}20%,60%{opacity:1;transform:translateX(5px)}}
.spr.faint{animation:faint .5s .6s forwards}@keyframes faint{to{transform:translateY(60%);opacity:0}}
.spr.glow .art{animation:glow .7s}@keyframes glow{50%{box-shadow:0 0 18px 6px #fff7b0;filter:brightness(1.4)}}
.quake{animation:quake .4s .2s}@keyframes quake{20%,60%{transform:translate(-6px,3px)}40%,80%{transform:translate(6px,-3px)}}
.fl{position:absolute;inset:-10%;border-radius:50%;opacity:0;animation:fl .45s .2s;pointer-events:none}
@keyframes fl{30%{opacity:.95;transform:scale(1.1)}to{opacity:0;transform:scale(1.5)}}
.el-phys{background:linear-gradient(135deg,transparent 45%,#fff 48% 52%,transparent 55%);border-radius:0}
.el-fire{background:radial-gradient(#fff3a0,#ff7a2f 45%,transparent 70%)}
.el-ice{background:radial-gradient(#fff,#5fc4ff 45%,transparent 70%)}
.el-thunder{background:radial-gradient(#fff,#ffe14a 45%,transparent 70%)}
.el-holy{background:radial-gradient(#fff,#ffe9a0 45%,transparent 70%)}
.el-dark{background:radial-gradient(#e6c2ff,#5a2a8a 45%,transparent 70%)}
.el-poison{background:radial-gradient(#f0ffc2,#7ac23a 45%,transparent 70%)}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-size:28px;color:#fff;-webkit-text-stroke:1.5px var(--hp);opacity:0;animation:pop .8s .2s forwards;pointer-events:none;white-space:nowrap;z-index:3}
.dmg.cr{font-size:40px;color:var(--gold)}
.dmg.heal{color:#c9ffc2;-webkit-text-stroke:1.5px #2c8a3a;top:10%}
.dmg.miss{font-size:20px;-webkit-text-stroke:1.5px var(--navy)}
@keyframes pop{from{opacity:0;top:45%}25%{opacity:1}80%{opacity:1}to{opacity:0;top:0}}
.cutin{position:absolute;left:0;right:0;top:40%;padding:4px 0;background:linear-gradient(90deg,transparent,var(--navy) 20% 80%,transparent);color:var(--gold);font-family:var(--display);font-weight:900;font-size:20px;text-align:center;letter-spacing:.2em;animation:cut .9s forwards;pointer-events:none;z-index:4}
.cutin.bad{background:linear-gradient(90deg,transparent,#6b1f2a 20% 80%,transparent);color:#fff}
@keyframes cut{from{transform:translateX(-100%);opacity:0}20%,75%{transform:none;opacity:1}to{transform:translateX(100%);opacity:0}}
.msg{background:var(--panel);border:3px double var(--navy);border-radius:8px;padding:8px 12px;min-height:66px;white-space:pre-line;font-size:13px;font-weight:500}
.art.has{border-color:transparent;background:none}.art.has .art-ph{display:none}
.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cmd.col{grid-template-columns:1fr 1fr}
.cmd .btn{padding:10px 4px;white-space:normal;line-height:1.25}
.cmd .btn small{display:block;font-weight:400;font-size:10px;color:var(--mp)}

/* 角色 */
.char-top{display:grid;grid-template-columns:38% 1fr;gap:10px}
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.stat-g div{display:flex;justify-content:space-between;border-bottom:1px dotted #d8c79b}
.attr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.step{display:flex;gap:6px;align-items:baseline}.step i{font-style:normal;color:var(--sub)}.step.done{color:var(--exp)}

/* 浮層 */
#modal{position:absolute;inset:0;background:rgba(20,22,40,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:86%;display:flex;flex-direction:column;background:var(--paper);border-top:3px solid var(--gold);border-radius:14px 14px 0 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:linear-gradient(var(--navy2),var(--navy));border-radius:11px 11px 0 0}
.sheet-h h3{color:var(--gold)}.x{color:#fff;font-size:24px;line-height:1;padding:0 6px}
.sheet-b{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#story{position:absolute;inset:0;z-index:30;background:#141628;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px}
.say{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:10px 12px;min-height:118px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.say .pt{width:60px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.say .who{font-family:var(--display);color:var(--navy)}
.say .nx{grid-column:1/-1;text-align:right;font-size:11px;color:var(--sub)}
#story .skip{align-self:flex-end;color:#fff;border:1px solid #fff;border-radius:6px;padding:2px 10px;font-size:12px}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%}
#toast div{background:rgba(39,52,95,.95);color:#fff;border:1px solid var(--gold);padding:5px 14px;border-radius:16px;font-size:13px;animation:tin 2.2s forwards;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}85%{opacity:1}to{opacity:0}}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}
/* 性別選擇 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:8px 6px;border:2px solid var(--line);border-radius:8px;background:var(--panel2);font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button.on{background:linear-gradient(var(--navy2),var(--navy));color:var(--gold);border-color:var(--gold)}
.seg small{font-weight:400;font-size:11px}
/* 魔物與角色待機動態 */
.spr .art img{transform-origin:50% 100%}
.spr.foe .art img{animation:breathe 2.2s ease-in-out infinite}
.spr.foe.boss .art img{filter:drop-shadow(0 0 8px rgba(110,20,60,.55))}
.spr.foe.boss:not(.fly) .art img{animation-duration:3s}
.spr.foe.fly .art img{animation:hover 2.6s ease-in-out infinite}
.spr.foe.fly .plat{animation:shad 2.6s ease-in-out infinite}
.spr.me .art img{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.035,.965)}}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9%) rotate(1.5deg)}}
@keyframes shad{50%{transform:scale(.72);opacity:.5}}
/* 裝備 */
.gsec{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:#fff}
.subl{font-size:13px;font-weight:500}
.up{color:var(--exp)}.down{color:var(--hp)}.son{color:var(--exp);font-weight:700}
.tag.upt{background:var(--exp);color:#fff}
.row.wrap{flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchips button{padding:3px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:700;color:var(--sub)}
.fchips button.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.attr small{font-size:11px;margin-left:2px}
/* 技能演出：施法→飛行→命中，與普攻明顯區分 */
.stage .spr{z-index:2}.stage .ibox{z-index:4}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(8,10,28,.55);opacity:0;animation:dim 1.5s forwards}
@keyframes dim{10%,70%{opacity:1}to{opacity:0}}

<body>
<div id="app" class="pre">
  <header id="hud"></header>
  <div id="chat"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="tip" hidden></div>

  <div id="toast"></div>
</div>
<script>
/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.MISS=new Set();
/* 載入失敗先重試一次；失敗名單每 2 分鐘清空，避免網路抖一下就永遠不顯示 */
setInterval(()=>MISS.clear(),120000);
const PRE={};function preload(ks){ks.forEach(k=>{const sk=shKey(k);if(sk)k=sk.f;else if(k in ATL)k='atlas_ui';if(!k||PRE[k]||MISS.has(k))return;const i=new Image();i.decoding='async';i.src='art/'+k+'.webp';PRE[k]=i})}
window.reTry=(img,key)=>{if(img.dataset.r)return false;img.dataset.r=1;setTimeout(()=>{img.src='art/'+key+'.webp?r='+Date.now()},700);return true};
const ASZ={r169:'1280×720',r34:'768×1024',r11:'768×768'};
/* 插畫位：把圖檔放到 art/<key>.png 就會自動取代預留框 */
const ATL={"icon_a_0":0,"icon_a_1":1,"icon_a_2":2,"icon_a_3":3,"icon_a_4":4,"icon_f_0":5,"icon_f_1":6,"icon_f_2":7,"icon_f_3":8,"icon_f_4":9,"icon_h_0":10,"icon_h_1":11,"icon_h_2":12,"icon_h_3":13,"icon_h_4":14,"icon_n_0":15,"icon_n_1":16,"icon_n_2":17,"icon_n_3":18,"icon_n_4":19,"icon_r_0":20,"icon_r_1":21,"icon_r_2":22,"icon_r_3":23,"icon_r_4":24,"icon_u_dragon":25,"icon_u_gob":26,"icon_u_tree":27,"icon_u_worm":28,"icon_u_zenos":29,"icon_w_cleric_0":30,"icon_w_cleric_1":31,"icon_w_cleric_2":32,"icon_w_cleric_3":33,"icon_w_cleric_4":34,"icon_w_mage_0":35,"icon_w_mage_1":36,"icon_w_mage_2":37,"icon_w_mage_3":38,"icon_w_mage_4":39,"icon_w_ranger_0":40,"icon_w_ranger_1":41,"icon_w_ranger_2":42,"icon_w_ranger_3":43,"icon_w_ranger_4":44,"icon_w_swordsman_0":45,"icon_w_swordsman_1":46,"icon_w_swordsman_2":47,"icon_w_swordsman_3":48,"icon_w_swordsman_4":49,"item_dust":50,"item_eth":51,"item_eth2":52,"item_gem_b":53,"item_gem_g":54,"item_gem_r":55,"item_gem_w":56,"item_gem_y":57,"item_m_dark":58,"item_m_fang":59,"item_m_gel":60,"item_m_ice":61,"item_m_ore":62,"item_pot":63,"item_pot2":64,"item_stone":65,"item_tok":66,"pass_am":67,"pass_as":68,"pass_bk":69,"pass_bp":70,"pass_cl1":71,"pass_cl2":72,"pass_cl3":73,"pass_kn":74,"pass_mg1":75,"pass_mg2":76,"pass_mg3":77,"pass_rg1":78,"pass_rg2":79,"pass_rg3":80,"pass_sn":81,"pass_sw1":82,"pass_sw2":83,"pass_sw3":84,"pass_tp":85,"pass_wl":86,"skill_aegis":87,"skill_arrowstorm":88,"skill_barrier":89,"skill_bash":90,"skill_berserk":91,"skill_bless":92,"skill_charge":93,"skill_collapse":94,"skill_curse":95,"skill_deadshot":96,"skill_dodge":97,"skill_doom":98,"skill_drain":99,"skill_dshot":100,"skill_explo":101,"skill_feast":102,"skill_field":103,"skill_fire":104,"skill_firestorm":105,"skill_flurry":106,"skill_guard":107,"skill_hammer":108,"skill_heal":109,"skill_hold":110,"skill_holy":111,"skill_holycharge":112,"skill_ice":113,"skill_judge":114,"skill_meteor":115,"skill_miracle":116,"skill_missiles":117,"skill_nova":118,"skill_pierce":119,"skill_pshot":120,"skill_purify":121,"skill_rage":122,"skill_rain":123,"skill_reap":124,"skill_revive":125,"skill_sanct":126,"skill_skyslash":127,"skill_slash":128,"skill_smite":129,"skill_smoke":130,"skill_snipe":131,"skill_stab":132,"skill_thousand":133,"skill_thunder":134,"skill_trap":135,"skill_warcry":136,"skill_whirl":137,"skill_wrath":138},ATC=12,ATR=12;
const SHO=['','mage','ranger','cleric','knight','berserker','archmage','warlock','sniper','assassin','bishop','templar'];
const shKey=k=>{const m=k&&k.match(/^story_ch(\d)_(intro|mid|outro)_([mf])(?:_(\w+))?$/);if(!m)return null;const i=SHO.indexOf(m[4]||'');return i<0?null:{f:`sheet_ch${m[1]}_${m[2]}_${m[3]}`,i}};
const shPos=i=>`background-position:${(i%4)/3*100}% ${Math.floor(i/4)/2*100}%`;
function art(key,label,r='r169',extra='',under){
  const sk=shKey(key);if(sk)return `<div class="art ${r} ${extra} has" data-art="${key}"><i class="sht" style="background-image:url(art/${sk.f}.webp);${shPos(sk.i)}"></i></div>`;
  const src=artSrc(key);
  const u=under&&under!==src&&!MISS.has(under)&&PRE[under]?`<img class="under" src="art/${under}.webp" alt="">`:'';
  const img=src?`${u}<img src="art/${src}.webp" alt="" onload="this.parentNode.classList.add('has')" onerror="reTry(this,'${src}')||artErr(this,'${src}')">`:'';
  return `<div class="art ${r} ${extra}" data-art="${key}"><div class="art-ph"><em>插畫位</em><b>${label}</b><i>${key}.png · ${ASZ[r]}</i></div>${img}</div>`;
}
/* 男女版插畫還沒到時，先退回共用版 */
const ALT=k=>{if(!k)return null;{const m=k.match(/^portrait_(npc_\w+?)(?:_(smile|serious))?$/);if(m)return m[2]?`portrait_${m[1]}`:m[1]}{const m=k.match(/^portrait_(\w+?)_([mf])(?:_(smile|serious))?$/);if(m){return m[3]?`portrait_${m[1]}_${m[2]}`:`class_${m[1]}_${m[2]}`}}{const m=k.match(/^(story_ch\d_\w+?_[mf])_(\w+)$/);if(m){const a=m[2];if(ADV[a]){const base=Object.keys(CLS).find(c=>(CLS[c].adv||[]).includes(a));return base&&base!=='swordsman'?m[1]+'_'+base:m[1]}return m[1]}}let m=k.match(/^(.*)_(hurt|low|win|lose|atk|skill|cast)$/);if(m)return m[1];m=k.match(/^ally_(\w+)$/);if(m)return 'npc_'+m[1];if(/^event_/.test(k))return 'area_'+AREAS[RUN?RUN.area:0].id;m=k.match(/^(.*)_(m|f)$/);if(m)return m[1];m=k.match(/^story_ch(\d)_(mid|pre)$/);return m?'area_'+AREAS[+m[1]-1].id:null};
/* 小圖示：有插畫就蓋在線條圖示上 */
const icon=(key,fb)=>key in ATL?`${fb}<i class="ii at" style="background-position:${(ATL[key]%ATC)/(ATC-1)*100}% ${Math.floor(ATL[key]/ATC)/(ATR-1)*100}%"></i>`:`${fb}${MISS.has(key)?'':`<img class="ii" src="art/${key}.webp" alt="" onerror="reTry(this,'${key}')||(MISS.add('${key}'),this.remove())">`}`;
const gIco=id=>icon('icon_'+id,SLOTCH[GEAR[id].slot]);
function artSrc(k){while(k&&MISS.has(k))k=ALT(k);return k}
function artErr(img,src){MISS.add(src);const a=artSrc(ALT(src));if(a){delete img.dataset.r;img.onerror=()=>reTry(img,a)||artErr(img,a);img.src='art/'+a+'.webp'}else img.remove()}
function tx(t){if(!S)return t;const f=S.sex==='f';t=t.replace(/\{wfix\}/g,{swordsman:'劍磨好了',mage:'法杖的杖頭我重新嵌緊了',ranger:'弓弦換了新的',cleric:'戰錘的握柄重新纏好了'}[S.cls]||'武器整理好了');return t.replace(/\{name\}/g,S.name).replace(/\{([^{}|]*)\|([^{}|]*)\}/g,(_,a,b)=>f?b:a)}
const you=t=>S&&S.sex==='f'?String(t).replace(/你/g,'妳'):t;
const HK=()=>`class_${S.adv||S.cls}_${S.sex}`;
const SCLS=()=>S.adv?'_'+S.adv:S.cls==='swordsman'?'':'_'+S.cls;
const PKEY=(e)=>`portrait_${S.adv||S.cls}_${S.sex}${e?'_'+e:''}`;
const heroFace=t=>/謝謝|一起|嗯|太好|請多指教|好！/.test(t)?'smile':/[！？]|……|對不起|別|不/.test(t)?'serious':'';
const SKEY=(n,io)=>`story_ch${n}_${io}_${S.sex}${SCLS()}`;
function toast(t){const T=$('#toast');while(T.children.length>=3)T.firstChild.remove();const d=document.createElement('div');d.textContent=t;T.appendChild(d);setTimeout(()=>d.remove(),2300)}

/* ============ 資料 ============ */

  b:[['旁白','你們在山腰的岩縫裡找到一面凹陷的圓盾，盾面刻著一隻歪歪扭扭的熊。'],['巴爾德','……是他畫的。說是隊徽，醜得要命。'],['巴爾德','我會把它補好，掛在店門口。這樣他在哪裡都看得到，晨星鎮的鐵匠還在打鐵。'],['巴爾德','謝了。強化費……這次算你便宜一點。']],

 /* ---- 蜜可：神秘商人 ---- */
 {id:'miko1',npc:'蜜可',fac:'shop',ch:1,n:'假藥水事件',key:'area_forest',
  a:[['蜜可','{name}！大事不好！有客人拿著「蜜可牌治療藥水」來退貨，說喝了會一直打噴嚏！'],['蜜可','可是那根本不是我做的！瓶子是仿的，標籤上的字還寫錯——我的「蜜」才不是長那樣！'],['蜜可','我聞過了，裡面加了迷霧森林的紫菇孢子。有人在森林裡採菇做假貨。'],['蜜可','幫我去菇群那邊看看？不用抓人，只要找出孢子是從哪裡來的就好！']],
  req:{type:'kill',mob:'shroom',c:5,d:'在迷霧森林擊敗毒菇怪 5 隻，追查孢子來源'},
  b:[['旁白','菇群中央有一個被踩平的空地，留著攤販用的木架和一頂舊斗篷。'],['蜜可','這斗篷……是那個「神秘商人」的。他常在路邊跟冒險者賭運氣。'],['蜜可','咦？斗篷內袋縫著一張紙條。「給小蜜：店要顧好，帳要記好。」'],['蜜可','……這是爸爸的字。'],['蜜可','他五年前說要出門進貨，就再也沒回來。原來他一直在附近亂晃？還賣假藥水？！'],['蜜可','{name}，下次遇到那個神秘商人，幫我把他抓回來。我要親自跟他算帳！']],

 {id:'miko2',npc:'蜜可',fac:'shop',pre:'miko1',ch:2,n:'帳要記好',key:'town_bg',

 /* ---- 瑪莎：雪夜的信 ---- */
 {id:'mar1',npc:'瑪莎',fac:'inn',ch:1,n:'旅店的屋頂',key:'town_bg',

 {id:'mar2',npc:'瑪莎',fac:'inn',pre:'mar1',ch:4,n:'櫃台下的地圖',key:'town_bg',

 {id:'boy1',npc:'托托',fac:'inn',ch:1,n:'托托的最後一隻羊',key:'area_plain',

 {id:'edw1',npc:'艾德溫',fac:'temple',ch:2,n:'老書記的筆記',key:'area_forest',
  a:[['艾德溫','{name}，你知道二十年前那支遠征隊，為什麼會失敗嗎？'],['艾德溫','因為我們把霧當成天災，以為只要走得夠快就能穿過去。'],['艾德溫','我回來以後，花了二十年研究霧晶。可是手上的樣本太少，一直解不開它的構造。'],['艾德溫','幫我帶三塊霧晶碎片回來。這次，我想在你們出發前找出答案。']],

/* ============ 狀態 ============ */
const KEY='azure_oath_save_v1';
let S=null,TAB='town',RUN=null,B=null,MODAL=null,STORY=null;
let NEWCLS='swordsman',NEWSEX='m',BAGF='all',NEWNAME='',BAGTAB='gear',QTAB='main',AUTO=false,CHATQ=[];
let BAKT=0;function save(){try{if(S&&S.ach)checkAch()}catch(e){}try{const j=JSON.stringify(S);localStorage.setItem(KEY,j);if(Date.now()-BAKT>300000){BAKT=Date.now();localStorage.setItem(KEY+'_bak',j)}}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s)S=JSON.parse(s)}catch(e){S=null}if(!S||!S.cls){try{const b=localStorage.getItem(KEY+'_bak');if(b){S=JSON.parse(b);setTimeout(()=>toast('主存檔損壞，已從備份還原'),800)}}catch(e){}}}
function newGame(name,cls,sex){
  S={created:Date.now(),v:2,name,cls,sex,adv:null,lv:1,exp:0,gold:100,attr:Object.assign({},CLS[cls].base),pts:0,sp:0,skl:{},hp:1,mp:1,
     eq:{weapon:null,head:null,body:null,feet:null,ring:null,neck:null},gear:[],items:{pot:3,eth:1},uid:1,
     main:{ch:0,step:0,prog:0,acc:false},side:{},nst:{},cleared:{},flags:{},bond:0,
     st:{kills:0,run:0,enh:0,check:0,craft:0,nmboss:0},tut:{},dex:{m:{},g:{}},ach:{},tower:{best:0},daily:{date:'',kill:0,run:0,enh:0,got:{},sign:false}};
  const w=addGear(`w_${cls}_0`,0),a=addGear('a_0',0),f=addGear('f_0',0);S.eq.weapon=w.u;S.eq.body=a.u;S.eq.feet=f.u;
  learn(true);const s=stats();S.hp=s.HP;S.mp=s.MP;checkDaily();save();
}
/* 舊存檔升級：三格裝備 → 六格、四階稀有度 → 五階 */
function migrate(){if(!S)return;dexInit();if(!S.tut){S.tut={};if(S.lv>=5)for(const k in TIPS)if(k!=='tower'&&k!=='ally'&&k!=='adv20')S.tut[k]=1}if(!S.nst)S.nst={};if(S.gem){S.gold+=S.gem*5;S.gem=0}for(const g of S.gear||[])if(!g.sock)g.sock=g.r>=4?[null,null]:g.r>=3?[null]:[];if(!S.sex)S.sex='m';if(!S.flags)S.flags={};if(S.bond==null)S.bond=0;if((S.v||1)>=2)return;
  const om=[0,1,3,4];
  for(const g of S.gear){if(g.id.startsWith('c_'))g.id='r_'+g.id.slice(2);g.r=om[g.r]??g.r;
    if(GEAR[g.id]){if(!g.sub)g.sub=rollSubs(GEAR[g.id].t,g.r);if(g.r>=4&&!g.sp)g.sp=pick(Object.keys(SPEC))}g.lock=!!g.lock}
  S.gear=S.gear.filter(g=>GEAR[g.id]);const e=S.eq||{};
  S.eq={weapon:e.weapon||null,head:null,body:e.armor||null,feet:null,ring:e.acc||null,neck:null};S.v=2;save()}
function checkDaily(){const d=new Date().toDateString();if(S.daily.date!==d)S.daily={date:d,kill:0,run:0,enh:0,got:{},sign:false}}

try{MUTE=localStorage.getItem(KEY+'_mute')==='1';BGMOFF=localStorage.getItem(KEY+'_bgm')==='0'}catch(e){}
function ctx(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();c.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.Q.value=.4;lp.connect(c);MG=AC.createGain();MG.gain.value=.22;MG.connect(lp);const lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=3200;lp2.Q.value=.4;lp2.connect(c);BG=AC.createGain();BG.gain.value=.11;BG.connect(lp2);
  /* 紅白機風噪音：1-bit LFSR，高頻與低頻兩種 */
  const mk=(hold,short)=>{const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);let r=1,v=1;for(let i=0;i<d.length;i++){if(i%hold===0){const bit=((r>>0)^(r>>(short?6:1)))&1;r=(r>>1)|(bit<<14);v=(r&1)?1:-1}d[i]=v}return b};
  NBH=mk(2,false);NBL=mk(24,false);
  /* 方波佔空比 12.5% / 25% / 50% */
  [.125,.25,.5].forEach(dt=>{const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*dt);WAVE[dt]=AC.createPeriodicWave(re,im)})}
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function ac(){return MUTE?null:ctx()}
function osc(a,w){const o=a.createOscillator();if(w==='tri')o.type='triangle';else o.setPeriodicWave(WAVE[w===.125?.25:w||.5]);return o}
/* 方波音：f→f2 滑音，階梯式音量 */
function sq(f,d,v,t0,f2,w,out){const a=out?ctx():ac();if(!a)return;const t=a.currentTime+(t0||0),o=osc(a,w),g=a.createGain();
  o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.1,t+.008);g.gain.setValueAtTime((v||.1)*.6,t+d*.5);g.gain.linearRampToValueAtTime(0,t+d+.03);o.connect(g);g.connect(out||MG);o.start(t);o.stop(t+d+.05)}
function nz(d,v,t0,low,rate,out){const a=out?ctx():ac();if(!a)return;const t=a.currentTime+(t0||0),s=a.createBufferSource(),g=a.createGain();
  s.buffer=low?NBL:NBH;s.playbackRate.value=rate||1;s.loop=true;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime((v||.2)*.55,t+.006);g.gain.linearRampToValueAtTime(0,t+d+.03);s.connect(g);g.connect(out||MG);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
const arp=(fs,st,d,v,t,w)=>fs.forEach((f,i)=>sq(f,d,v,(t||0)+i*st,0,w));

  win(){[[392,.1],[523,.1],[659,.1],[784,.3],[659,.1],[784,.5]].reduce((tt,[f,d])=>{sq(f,d*.95,.09,tt,0,.25);sq(f/2,d*.95,.07,tt,0,'tri');return tt+d},0)},
  lose(){[[392,.3],[370,.3],[349,.3],[330,.8]].reduce((tt,[f,d])=>{sq(f,d*.95,.09,tt,0,.5);sq(f/2,d*.95,.08,tt,0,'tri');return tt+d},0)},
  enc(){[0,1,2,3,4,5].forEach(i=>sq(i%2?880:660,.05,.07,i*.05,0,.25));sq(1320,.2,.08,.3,0,.125)},

function bgmTick(){const a=ctx();if(!a||!BGMCUR)return;const tr=BGM[BGMCUR],st=60/tr.bpm/2;
  while(BGMT<a.currentTime+.15){tr.ch.forEach(c=>{const tk=c._t||(c._t=c.n.trim().split(/\s+/)),i=BGMI%tk.length,x=tk[i];
      if(c.w==='nz'){if(x!=='.'&&x!=='-')drum(x,BGMT);return}
      if(x==='.'||x==='-')return;let L=1;while(tk[(i+L)%tk.length]==='-'&&L<16)L++;const f=NOTE(x);if(f)sq(f,st*L*.92,c.v,BGMT-a.currentTime,0,c.w,BG)});

/* ============ 計算 ============ */
const need=lv=>Math.round((30+lv*28+lv*lv*4)*(2+lv*.8+Math.max(0,lv-25)*1.2));
const CHLV=[1,7,13,19,24,26];const chLvOk=()=>S.lv>=(CHLV[S.main.ch]||1);
const xpPen=L=>{const d=S.lv-L-5;return d>0?Math.max(.2,1-d*.15):1};
const clsName=()=>S.adv?ADV[S.adv].n:CLS[S.cls].n;
const gearBy=u=>S.gear.find(g=>g.u===u);
function gearStat(g){const b=GEAR[g.id],m=(1+.2*g.r)*(1+.08*g.p),o={};for(const k in STATN)if(b[k])o[k]=Math.round(b[k]*m);return o}
function gearAll(g){const o=gearStat(g),ad=(k,v)=>o[k]=(o[k]||0)+v;for(const x of g.sub||[])ad(x.k,x.v);if(g.sp)ad(g.sp,SPEC[g.sp].v);const u=GEAR[g.id].uq;if(u)for(const k in u)ad(k,u[k]);
  for(const gm of g.sock||[])if(gm)for(const k in ITEMS[gm].gem)ad(k,ITEMS[gm].gem[k]);return o}
const gearName=g=>`${g.set!=null?SETS[g.set].n+'・':''}${GEAR[g.id].uniq?'「'+GEAR[g.id].n+'」':GEAR[g.id].n}${g.p?` +${g.p}`:''}`;
const gearDesc=g=>Object.entries(gearStat(g)).map(([k,v])=>fmt(k,v)).join('　')+((g.sub||[]).length?`　詞條×${g.sub.length}`:'')+(g.sp?`　【${SPEC[g.sp].n}】`:'')+(GEAR[g.id].uniq?'　專屬':'')+((g.sock||[]).length?`　孔 ${(g.sock||[]).filter(Boolean).length}/${g.sock.length}`:'');
function gearPower(g){const o=gearAll(g),mg=CLS[S.cls].basic==='MAG',W={atk:mg?1:3,mag:mg?3:.8,def:2.5,hp:.25,mp:.25,crit:4,cd:1.5,eva:3,ls:5,atkp:mg?2:6,magp:mg?6:2,STR:mg?1.5:4,DEX:3,INT:mg?4:1.5,VIT:3,LUK:3};
  let v=0;for(const k in o)v+=o[k]*(W[k]||3);return Math.round(v)}
function setCounts(){const c={};for(const sl in SLOTS){const g=gearBy(S.eq[sl]);if(g&&g.set!=null)c[g.set]=(c[g.set]||0)+1}return c}
function gearTotals(){const e={},add=o=>{for(const k in o)e[k]=(e[k]||0)+o[k]};
  for(const sl in SLOTS){const g=gearBy(S.eq[sl]);if(g)add(gearAll(g))}
  const c=setCounts();for(const i in c){if(c[i]>=2)add(SETS[i].b2);if(c[i]>=4)add(SETS[i].b4)}
  for(const id in PASS)if(PASS[id].st&&hasP(id))add(PASS[id].st);return e}
function stats(){const e=gearTotals(),a={},c=CLS[S.cls],v=k=>e[k]||0,p=k=>1+v(k)/100;for(const k in ATTR)a[k]=S.attr[k]+v(k);
  return{HP:Math.round((60+a.VIT*12+S.lv*8+v('hp'))*p('hpp')),MP:Math.round((20+a.INT*5+S.lv*3+v('mp'))*p('mpp')),ATK:Math.round((a[c.atk]*2+v('atk'))*p('atkp')),MAG:Math.round((a.INT*2.2+v('mag'))*p('magp')),
    DEF:Math.round((a.VIT*1.2+v('def'))*p('defp')),CRIT:Math.min(75,Math.round(5+a.LUK*.6+a.DEX*.2+v('crit'))),CD:150+v('cd'),EVA:Math.min(45,Math.round(a.DEX*.6+v('eva'))),
    LS:v('ls'),REGEN:v('regen'),MPCUT:Math.min(50,v('mpcut')),BURN:v('burn'),DOUBLE:v('double'),STUN:v('stun'),GUARD:v('guard'),SHIELD:v('shield'),MPREG:v('mpreg'),RESMAX:v('resmax'),BRKCD:v('brkcd'),DETAMP:v('detamp'),FOCUSATK:v('focusatk'),ANSWER:v('answer'),HEALP:v('healp'),FAITHG:v('faithg'),A:a}}
function power(){const s=stats();return Math.round(s.HP/4+s.MP/4+s.ATK*3+s.MAG*3+s.DEF*2.5+s.CRIT*4+(s.CD-150)*1.5+s.EVA*3+s.LS*5+(s.BURN+s.DOUBLE+s.STUN+s.GUARD+s.SHIELD)*3)}
const mpCost=k=>Math.max(1,Math.round(SK[k].mp*(1-stats().MPCUT/100)));
function clamp(){const s=stats();S.hp=Math.min(S.hp,s.HP);S.mp=Math.min(S.mp,s.MP)}
function mySkills(){return Object.keys(SK).filter(k=>(SK[k].c===S.cls||SK[k].c===S.adv)&&S.lv>=SK[k].lv)}
function learn(quiet){for(const k of mySkills())if(!S.skl[k]){S.skl[k]=1;if(!quiet)toast(`習得技能【${SK[k].n}】`)}}
function addItem(id,n){S.items[id]=(S.items[id]||0)+n;if(S.items[id]<=0)delete S.items[id]}
function rollSubs(t,r){return Object.keys(SUBS).sort(()=>Math.random()-.5).slice(0,Math.min(4,r)).map(k=>({k,v:Math.max(1,Math.round(SUBS[k](t)*(.7+Math.random()*.3)))}))}
function addGear(id,r,set){const g={u:S.uid++,id,r,p:0,sub:rollSubs(GEAR[id].t,r),lock:false,sock:r>=4?[null,null]:r>=3?[null]:[]};if(r>=4&&!GEAR[id].uniq)g.sp=pick(Object.keys(SPEC));if(set!=null)g.set=set;S.gear.push(g);if(S.dex)S.dex.g[id]=1;return g}
function rollRar(minR,bonus){const w=RW.map((x,i)=>i<minR?0:x*(i>=2?bonus||1:1)),t=w.reduce((a,b)=>a+b);let r=Math.random()*t;for(let i=0;i<5;i++){if((r-=w[i])<0)return i}return 4}
function makeGear(tier,r,hard){const sl=pick(Object.keys(SLOTS)),id=sl==='weapon'?`w_${S.cls}_${tier}`:`${SLOTP[sl]}_${tier}`;
  const g=addGear(id,r,hard&&r>=3&&Math.random()<.4?CSET[S.cls]:r>=2&&Math.random()<.35?ASET(tier):null);if(r>=3)sys(`恭喜 ${S.name} 獲得【${gearName(g)}】！`);return g}
const rollGear=(tier,minR,bonus,hard)=>makeGear(tier,rollRar(minR||0,bonus),hard);
function dismantle(g){const d=DIS[g.r][0]+g.p*2,st=DIS[g.r][1];addItem('dust',d);if(st)addItem('stone',st);for(const gm of g.sock||[])if(gm)addItem(gm,1);if(g.r>=3&&Math.random()<.4){const gm=pick(GEMS);addItem(gm,1);toast(`分解時取得 ${ITEMS[gm].n}`)}S.gear=S.gear.filter(x=>x.u!==g.u);return [d,st]}
function gainExp(n){
  S.exp+=n;let up=false;
  while(S.lv<40&&S.exp>=need(S.lv)){S.exp-=need(S.lv);S.lv++;S.pts+=2;S.sp++;const g=CLS[S.cls].grow;for(const k in g)S.attr[k]+=g[k];up=true}
  if(S.lv>=40)S.exp=Math.min(S.exp,need(40)-1);
  if(up)for(const id in PASS)if(PASS[id].lv===S.lv&&hasP(id))toast(`習得被動【${PASS[id].n}】`);
  if(up){const s=stats();S.hp=s.HP;S.mp=s.MP;learn();toast(`升級！Lv.${S.lv}　屬性點 +2　技能點 +1`);if(S.lv%5===0)sys(`${S.name} 升到了 Lv.${S.lv}！`)}
}
function give(rw){const t=[];
  const gd=(rw.gold||0)+(rw.gem||0)*5;if(gd){S.gold+=gd;t.push(`${gd} G`)}
  
  if(rw.items)for(const k in rw.items){addItem(k,rw.items[k]);t.push(`${ITEMS[k].n}×${rw.items[k]}`)}
  if(rw.exp){t.push(`${rw.exp} EXP`);gainExp(rw.exp)}
  return t.join('、')}
const rwText=rw=>[(rw.gold||rw.gem)&&`${(rw.gold||0)+(rw.gem||0)*5} G`,rw.exp&&`${rw.exp} EXP`,...Object.entries(rw.items||{}).map(([k,v])=>`${ITEMS[k].n}×${v}`)].filter(Boolean).join('、');
/* 進度追蹤：主線、支線、每日共用 */
function track(type,key,n=1){
  const m=S.main;
  if(m.acc&&m.ch<CH.length){const st=CH[m.ch].steps[m.step];
    if(st&&st.type===type&&st.mob===key){m.prog+=n;if(type==='boss'||m.prog>=st.n){m.step++;m.prog=0;toast(m.step>=CH[m.ch].steps.length?'主線目標達成，回公會回報':'主線進度更新')}}}
  for(const q of SQ){const s=S.side[q.id];if(!s||s.done)continue;
    if(q.type==='kill'&&type==='kill'&&q.mob===key)s.prog+=n;
    if(q.type==='stat'&&q.key===type)s.prog+=n}
  if(type==='kill')for(const q of NST){const t=S.nst[q.id];if(t&&!t.done&&q.req&&q.req.type==='kill'&&q.req.mob===key)t.prog+=n}
  if(type in S.daily&&typeof S.daily[type]==='number')S.daily[type]+=n;
  if(type in S.st)S.st[type]+=n;
}
function sqProg(q){const s=S.side[q.id];
  if(q.type==='item')return S.items[q.item]||0;
  if(q.type==='adv')return S.adv?1:0;
  if(q.type==='plus')return Math.max(0,...S.gear.map(g=>g.p));
  return s?s.prog:0}
const mainReady=()=>S.main.acc&&S.main.ch<CH.length&&S.main.step>=CH[S.main.ch].steps.length;
const questDot=()=>(typeof NST!=='undefined'&&nstDot())||mainReady()||(!S.main.acc&&S.main.ch<CH.length&&chLvOk())||SQ.some(q=>S.side[q.id]&&!S.side[q.id].done&&sqProg(q)>=q.c);

function artList(){const L=[['title_bg','標題主視覺','1280×720'],['town_bg','晨星鎮全景','1280×720']];

function okLine(l){if(!Array.isArray(l))return true;const c=l[2];if(!c)return true;if(c==='m'||c==='f')return S.sex===c;
  if(c[0]==='#')return !!S.flags[c.slice(1)];if(c[0]==='!')return !S.flags[c.slice(1)];if(c.startsWith('bond>='))return (S.bond||0)>=+c.slice(6);if(c.startsWith('bond<'))return (S.bond||0)<+c.slice(5);return true}

  const [w,t]=L,who=tx(w),hero=w==='{name}',nk=NPC[w],k=hero?PKEY(heroFace(t)):nk&&nk.startsWith('npc_')?'portrait_'+nk+(heroFace(t)?'_'+heroFace(t):''):nk;
  el.innerHTML=`<button class="skip" data-a="storySkip">跳過</button>${art(STORY.key,STORY.label)}
   <button class="say" data-a="storyNext" style="text-align:left">${k?`<div class="pt">${art(k,who,'r34','mini')}</div>`:'<span></span>'}<div><div class="who">${esc(who)}</div><p>${esc(you(tx(t)))}</p></div><div class="nx">點擊繼續 ▼</div></button>`}
function storyPick(i){const o=STORY.lines[STORY.i].choice[i],f=o.fx||{};
  if(!STORY.replay){if(f.bond){S.bond=(S.bond||0)+f.bond;toast(`與露娜的羈絆提升了`)}if(f.flag)S.flags[f.flag]=1;
    if(f.items)for(const k in f.items){addItem(k,f.items[k]);toast(`獲得 ${ITEMS[k].n}×${f.items[k]}`)}if(f.exp)gainExp(f.exp);save()}
  STORY.lines.splice(STORY.i+1,0,...(o.lines||[]));stNext()}

/* ============ 冒險流程 ============ */
const NODE={battle:['⚔','魔物的足跡','一般戰鬥'],event:['❗','奇怪的動靜','隨機事件・屬性檢定'],chest:['✦','閃光的東西','可能有寶箱'],rest:['☘','安全的營地','回復 HP 與 MP'],
  shrine:['✧','古老的祭壇','本次冒險獲得祝福'],merchant:['⚖','旅行商人','購買補給或神秘箱'],ambush:['☠','強敵的氣息','精英戰鬥・掉寶提升'],mystery:['？','濃霧籠罩','完全未知']};
function startRun(i,nm){const POOL=[['battle',5],['event',4],['chest',2],['rest',2],['shrine',1.5],['merchant',1.5],['ambush',1.5],['mystery',2]];
  const wp=ex=>{const P=POOL.filter(p=>p[0]!==ex);let r=Math.random()*P.reduce((a,b)=>a+b[1],0);for(const p of P)if((r-=p[1])<0)return p[0];return 'battle'};
  const nodes=['battle'],forks=[null];for(let k=1;k<5;k++){const x=wp(),y=wp(x);nodes.push(null);forks.push([x,y])}
  if(!nm&&S.main.acc&&S.main.ch===i&&!S.main.mid&&CH[i].mid){nodes[2]='story';forks[2]=null}
  nodes.push(nm||bossReady(i)?'boss':'elite');forks.push(null);
  RUN={area:i,nm:!!nm,step:-1,nodes,forks,bless:null,loot:{gold:0,exp:0,items:[]},view:{type:'start'}};render();$('#main').scrollTop=0}
const nAdds=el=>{const a=RUN.area,r=Math.random();if(el)return a>=3&&r<.5?1:0;return a>=3&&r<.2?2:a>=2&&r<.5?1:0};
function runNext(){const n=RUN.step+1;if(RUN.forks&&RUN.forks[n]&&!RUN.nodes[n]){RUN.view={type:'fork',opts:RUN.forks[n]};save();render();$('#main').scrollTop=0;return}
  RUN.step++;const a=AREAS[RUN.area],s=stats();let t=RUN.nodes[RUN.step];
  if(t==='mystery'){t=RUN.nodes[RUN.step]=pick(['battle','event','chest','ambush','merchant','shrine']);toast(`濃霧散去……是「${NODE[t][1]}」`)}
  if(t==='battle')startBattle(pick(a.mobs),'',nAdds());
  else if(t==='elite'||t==='ambush')startBattle(pick(a.mobs),'elite',nAdds(1));
  else if(t==='boss'){const i=RUN.area;if(!RUN.nm&&S.main.acc&&S.main.ch===i&&!S.main.pre&&CH[i].pre){play(CH[i].pre,`story_ch${i+1}_pre`,a.n,()=>{S.main.pre=true;save();startBattle(a.boss,'boss');render()});return}startBattle(a.boss,'boss')}
  else if(t==='story'){const i=RUN.area;play(CH[i].mid,SKEY(i+1,'mid'),a.n,()=>{S.main.mid=true;if(RUN)RUN.view={type:'res',title:'旅途見聞',text:you('你把這件事記在心裡，繼續前進。')};save();render()});return}
  else if(t==='event')RUN.view={type:'event',ev:pick(EVENTS),phase:'ask'};
  else if(t==='shrine')RUN.view={type:'shrine'};
  else if(t==='merchant'){const u=12+a.base*6;RUN.view={type:'shop',items:[['pot',Math.round(ITEMS.pot.price*.7)],['pot2',Math.round(ITEMS.pot2.price*.7)],['eth',Math.round(ITEMS.eth.price*.7)],['box',u*12]],bought:{}}}
  else if(t==='chest'){const g=Math.round((12+a.base*6)*(1.5+Math.random()));S.gold+=g;RUN.loot.gold+=g;let x=`你在岩縫中發現一只小寶箱，獲得 ${g} G`;
    if(Math.random()<.5){addItem('pot',1);x+='、治療藥水'}if(Math.random()<.15){addItem('stone',1);x+='、強化石'}if(Math.random()<.15){const gg=rollGear(RUN.area,1);x+='、'+gearName(gg);RUN.loot.items.push(gearName(gg))}RUN.view={type:'res',title:'發現寶箱',text:x+'。'}}
  else{S.hp=Math.min(s.HP,S.hp+Math.round(s.HP*.35));S.mp=Math.min(s.MP,S.mp+Math.round(s.MP*.35));
    const al=S.party&&S.party!=='none'&&ALLY[S.party]&&ALLY[S.party].open()?S.party:null,talk=al==='luna'?pick(['露娜望著營火：「媽媽做這盞燈的時候，說是為了讓人在霧裡找得到路。」','露娜把烤好的麵包分你一半：「別逞強。累了要說。」','露娜看著北方：「等霧散了，我想帶{你|妳}去看我們村子的麥田。」']):al==='gale'?pick(['蓋爾默默擦著那把短劍，劍柄上的名字被摸得發亮。','蓋爾：「騎士團守夜，第一個睡著的人要請全隊喝酒。……你別睡。」','蓋爾把披風丟給你：「山上的夜很冷。」']):'';
    RUN.view={type:'res',title:'營火休息',text:'你找到一處安全的營地稍作休息，回復了 35% 的 HP 與 MP。'+(talk?`<br><span class="sub">${talk}</span>`:'')}}
  save();render();$('#main').scrollTop=0}
function evPick(i){const v=RUN.view,o=v.ev.o[i];
  if(o.safe){v.phase='done';v.r=null;v.text=you(o.ok.t);v.gain=applyOut(o.ok,false);save();render();return}
  const d=R(1,20),mod=Math.floor(S.attr[o.a]/4),dc=o.dc+RUN.area*3,ok=d===20||(d!==1&&d+mod>=dc);
  v.phase='roll';render();let n=0;
  const tm=setInterval(()=>{const el=$('#die');if(el)el.textContent=R(1,20);
    if(++n>=10){clearInterval(tm);if(!RUN||RUN.view!==v)return;const out=ok?o.ok:o.ng;v.phase='done';v.r={d,mod,dc,ok,a:o.a};v.text=you(out.t);v.gain=applyOut(out,ok&&d===20);if(ok)track('check');save();render()}},70)}
function applyOut(o,crit){const unit=12+AREAS[RUN.area].base*6,s=stats(),g=[],m=crit?2:1;
  if(o.gold){let v=Math.round(unit*o.gold*(o.gold>0?m:1));if(v<0)v=-Math.min(S.gold,-v);S.gold+=v;if(v>0)RUN.loot.gold+=v;g.push(`${v>0?'+':''}${v} G`)}
  if(o.hp){const v=Math.round(s.HP*o.hp);S.hp=Math.max(1,Math.min(s.HP,S.hp+v));g.push(`HP ${v>0?'+':''}${v}`)}
  if(o.mp){const v=Math.round(s.MP*o.mp);S.mp=Math.min(s.MP,S.mp+v);g.push(`MP +${v}`)}
  if(o.stone){addItem('stone',o.stone);g.push(`強化石×${o.stone}`)}
  if(o.item){addItem(o.item[0],o.item[1]);g.push(`${ITEMS[o.item[0]].n}×${o.item[1]}`)}
  if(o.loot){const x=rollGear(RUN.area,crit?2:1);g.push(gearName(x));RUN.loot.items.push(gearName(x))}
  if(o.exp){const v=Math.round(unit*o.exp*m);RUN.loot.exp+=v;g.push(`+${v} EXP`);gainExp(v)}
  return g}
function finish(done){const l=RUN.loot,a=AREAS[RUN.area];let extra='';
  if(done){const bonus=Math.round((12+a.base*6)*2);S.gold+=bonus;track('run');extra=`<p>完成獎勵：${bonus} G</p>`}

/* ============ NPC 故事：狀態與流程 ============ */
function nstReqMet(q){const s=S.nst[q.id];if(!q.req)return true;if(!s)return false;
  return q.req.type==='kill'?s.prog>=q.req.c:(S.items[q.req.item]||0)>=q.req.c}
function nstProg(q){const s=S.nst[q.id]||{prog:0};return q.req.type==='kill'?Math.min(q.req.c,s.prog):Math.min(q.req.c,S.items[q.req.item]||0)}
function nstState(q){if(!S.nst)S.nst={};const s=S.nst[q.id];if(s&&s.done)return 'done';
  if(S.main.ch<q.ch||(q.pre&&!(S.nst[q.pre]||{}).done))return 'lock';
  if(!s)return 'new';return nstReqMet(q)?'ready':'prog'}
const nstFor=fac=>NST.filter(q=>q.fac===fac&&['new','ready'].includes(nstState(q)));
const nstDot=()=>NST.some(q=>['new','ready'].includes(nstState(q)));
function nstStart(id){const q=NST.find(x=>x.id===id);if(!q||nstState(q)!=='new')return;closeM();
  play(q.a,q.key,`${q.npc}的故事・${q.n}`,()=>{S.nst[id]={prog:0,done:false};if(!q.req)nstReward(q);else toast(`接下了「${q.n}」`);save();render()})}
function nstEnd(id){const q=NST.find(x=>x.id===id);if(!q||nstState(q)!=='ready')return;closeM();
  if(q.req&&q.req.type==='item')addItem(q.req.item,-q.req.c);
  play(q.b,q.key,`${q.npc}的故事・${q.n}`,()=>{nstReward(q);save();render()})}
function nstReward(q){S.nst[q.id]=Object.assign(S.nst[q.id]||{},{done:true});if(q.rw.flag)S.flags[q.rw.flag]=1;
  const t=give(q.rw);toast(`「${q.n}」完成：${t}`);sys(`${S.name} 完成了 ${q.npc} 的故事「${q.n}」`);
  if(q.rw.flag==='galeBack')toast('蓋爾可以成為同行夥伴了（角色頁切換）')}
function nstList(fac){const qs=NST.filter(q=>(!fac||q.fac===fac)&&nstState(q)!=='lock');
  return qs.map(q=>{const st=nstState(q);return `<div class="item"><span class="ico c4">${icon(NPC[q.npc]||'npc_boy','<b style="font-size:15px">'+q.npc[0]+'</b>')}</span><span class="grow"><b>${q.n}　<span class="sub">${q.npc}</span></b>
    <span class="sub">${st==='done'?'已完成':st==='new'?you('有話想對你說'):q.req?`${q.req.d}　<b>${nstProg(q)}/${q.req.c}</b>`:''}</span>${st!=='done'?`<span class="sub">獎勵：${rwText(q.rw)}</span>`:''}</span>
    ${st==='new'?`<button class="btn pri sm" data-a="nstStart" data-v="${q.id}">聽故事</button>`:st==='ready'?`<button class="btn pri sm" data-a="nstEnd" data-v="${q.id}">完成</button>`:st==='done'?`<button class="btn sm" data-a="nstReplay" data-v="${q.id}">回顧</button>`:'<span class="tag off">進行中</span>'}</div>`}).join('')}

function allyAuto(){if(S.party===undefined&&ALLY.luna.open())S.party='luna'}
function mkAlly(){if(!S.party||!ALLY[S.party]||!ALLY[S.party].open())return null;const s=stats(),pw=Math.max(s.ATK,s.MAG),bond=1+Math.min(20,S.bond||0)*.02;
  return S.party==='luna'?{id:'luna',n:'露娜',max:Math.round(s.HP*.7),pw:pw*.5*bond,def:s.DEF*.6,cd:0,heal:.2*bond}
                         :{id:'gale',n:'蓋爾',max:Math.round(s.HP*1.05),pw:pw*.62,def:s.DEF*1.1,cd:0}}
function allyAct(){const A=B.ally;if(!A||A.hp<=0||B.allyTurn===B.turn||B.hp<=0)return;B.allyTurn=B.turn;const s=stats();A.cd=Math.max(0,A.cd-1);
  const hit=(p,nm)=>{let d=A.pw*p*100/(100+B.def*(1+fbSum('def')))*(.9+Math.random()*.2);d=Math.max(1,Math.round(d));if(B.fshield>0){const ab=Math.min(B.fshield,d);B.fshield-=ab;d-=ab}B.hp=Math.max(0,B.hp-d);B.allyD=d;blog(`${A.n}${nm}，造成 ${d} 傷害`)};
  if(A.id==='luna'){
    if(S.hp<s.HP*.45&&!A.cd){const h=Math.round(s.HP*A.heal);S.hp=Math.min(s.HP,S.hp+h);A.cd=3;B.allyH=h;blog(`露娜舉起提燈：「撐住！」為你回復 ${h} HP`)}
    else if(B.turn%4===0){hit(1.6,'點燃燈火，【蒼焰】直擊');if(B.hp>0&&Math.random()<.4){B.st.burn=2;blog(`${B.name} 被蒼焰灼燒`)}}
    else hit(1,'的燈火彈');}
  else{if(!A.cd&&Math.random()<.35){A.cd=3;B.taunt=2;blog('蓋爾舉劍擋在你身前：「衝著我來。」')}
    else if(B.turn%3===0)hit(1.9,'揮出【雪葬】');else hit(1.1,'揮劍斬擊');}}
function allyTgt(){const A=B.ally;if(!A||A.hp<=0)return false;if(B.taunt>0){B.taunt--;return true}return Math.random()<.28}
function allyHurt(base,nm,src){const A=B.ally;let d=base*100/(100+A.def)*(.9+Math.random()*.2);d=Math.max(1,Math.round(d));A.hp=Math.max(0,A.hp-d);B.allyHit=d;
  blog(`${src} 的${nm}擊中了${A.n}，造成 ${d} 傷害`);if(A.hp<=0)blog(`${A.n}倒下了！`)}

const FK=['id','m','L','a','kind','mut','nm','aff','name','hp','max','atk','mag','def','crit','eva','fb','fshield','st','rage','bm'];
function swapFoe(i){const a=B.adds[i],cur={};FK.forEach(k=>{cur[k]=B[k];B[k]=a[k]});B.adds[i]=cur;B.fhp=null}
function addsAct(fx){const s=stats();for(const f of B.adds||[]){if(f.hp<=0||S.hp<=0)continue;
    if(f.st.stun>0){f.st.stun--;blog(`${f.name} 暈眩中`);continue}
    const base=f.atk*(.9+Math.random()*.2);
    if(allyTgt()){allyHurt(base,'攻擊',f.name);continue}
    if(Math.random()*100<s.EVA+buffSum('eva')){blog(`你閃開了 ${f.name} 的攻擊`);continue}
    let d=base*100/(100+s.DEF*(1+buffSum('def')));if(B.guard)d*=.5;d=Math.max(1,Math.round(d));
    let ab=0;if(B.shield>0){ab=Math.min(B.shield,d);B.shield-=ab;d-=ab}
    S.hp=Math.max(0,S.hp-d);fx.d=(fx.d||0)+d;blog(`${f.name} 的攻擊造成 ${d} 傷害${ab?`（護盾吸收 ${ab}）`:''}`);
    if(S.hp<=0&&B.endure){S.hp=1;B.endure=0;blog('鬥氣護體！以 1 HP 撐了下來')}}}
function addsDot(){for(const f of B.adds||[])for(const k of ['poison','burn'])if(f.hp>0&&f.st[k]>0){const d=Math.max(1,Math.round(f.max*(k==='poison'?.05:.04)));f.hp=Math.max(1,f.hp-d);f.st[k]--}}

const ACT={

  bAtk(){pAct('atk')},bGuard(){pAct('guard')},bFlee(){pAct('flee')},bSkill(v){pAct('skill',v)},bItem(v){pAct('item',v)},

  bagTab(v){BAGTAB=v;render()},gearF(v){BAGF=v;render()},qTab(v){QTAB=v;render()},
  useItem(k){if(RUN&&B)return;const it=ITEMS[k],s=stats();if(it.use.hp&&S.hp>=s.HP||it.use.mp&&S.mp>=s.MP){toast('已經是滿的');return}
    addItem(k,-1);if(it.use.hp)S.hp=Math.min(s.HP,S.hp+it.use.hp);if(it.use.mp)S.mp=Math.min(s.MP,S.mp+it.use.mp);save();render()},

  unequip(sl){S.eq[sl]=null;save();closeM();render()},

  buyGear(id){if(S.gold<GEAR[id].price)return;S.gold-=GEAR[id].price;addGear(id,0);toast(`購買了 ${GEAR[id].n}，已放入背包`);save();render()},
  enh(u){const g=gearBy(+u);if(!canEnh(g))return;S.gold-=enhCost(g);addItem('stone',-enhStone(g));track('enh');

  sockIn(v){const [u,gm]=v.split('|'),g=gearBy(+u);if(!g||!(S.items[gm]>0)||!(g.sock||[]).length)return;let i=g.sock.indexOf(null);if(i<0)i=0;g.sock[i]=gm;addItem(gm,-1);SFX.buff();toast(`鑲入 ${ITEMS[gm].n}`);save();render()},
  lock(u){const g=gearBy(+u);if(!g)return;g.lock=!g.lock;save();render()},
  dis(u){const g=gearBy(+u);if(!g||g.lock||Object.values(S.eq).includes(g.u))return;const [d,st]=dismantle(g);toast(`分解獲得 星塵×${d}${st?`、強化石×${st}`:''}`);save();closeM();render()},
  disAll(){const eqd=Object.values(S.eq),L=S.gear.filter(g=>g.r<=1&&!g.lock&&!eqd.includes(g.u));if(!L.length){toast('沒有可分解的普通或精良裝備');return}

  advance(k){if(S.lv<TRIAL.lv||S.adv||!S.trial)return;S.adv=k;WARM=0;const b=ADV[k].bonus;for(const a in b)S.attr[a]+=b[a];learn();const s=stats();S.hp=s.HP;S.mp=s.MP;sys(`${S.name} 轉職為【${ADV[k].n}】！`);toast(`轉職成功：${ADV[k].n}`);save();render()},
  mainAccept(){if(!chLvOk()){toast(`需要 Lv.${CHLV[S.main.ch]}`);return}const m=S.main,c=CH[m.ch];play(c.intro,SKEY(m.ch+1,'intro'),c.t+' 開場',()=>{m.acc=true;m.step=0;m.prog=0;save();render();toast('已接受主線任務')})},
