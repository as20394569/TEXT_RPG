<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1c2440"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蒼藍誓約 Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面：直式單欄。上 HUD、世界頻道、中央捲動區、下方五格導覽。日式線上 RPG 的象牙面板加金棕框線。 */
  --sky:#a9d6ef; --paper:#f7f0dc; --panel:#fffaf0; --panel2:#f0e4c4;
  --line:#a67c3d; --ink:#2c2742; --sub:#6f6683;
  --navy:#27345f; --navy2:#3c4f8f; --gold:#f0c24b;
  --hp:#dc4b4b; --mp:#3d82d6; --exp:#58a84a;
  --r0:#77717f; --r1:#3c9a4a; --r2:#2f7fd0; --r3:#9a4fd0; --r4:#dc8413;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(var(--sky),var(--paper) 38%);overflow:hidden}

/* HUD */
#hud{display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(var(--navy2),var(--navy));color:#fff;border-bottom:2px solid var(--gold)}
.ava{width:52px;height:52px;flex:none;border:2px solid var(--gold);border-radius:8px;overflow:hidden}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hud-n{display:flex;gap:6px;align-items:baseline;font-size:11px;white-space:nowrap;overflow:hidden}
.hud-n b{font-family:var(--display);font-size:14px;color:var(--gold)}
.hud-n .pw{margin-left:auto;color:#ffe9a8}
.hud-r{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:11px;font-variant-numeric:tabular-nums}
.cur{padding:0 6px;border-radius:9px;background:rgba(0,0,0,.28);white-space:nowrap}
.cur.g{color:#ffe08a}.cur.d{color:#a8e4ff}
.set{font-size:11px;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 6px}
.bar{position:relative;height:11px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .3s}
.bar.hp i{background:linear-gradient(#ff8a7a,var(--hp))}.bar.mp i{background:linear-gradient(#8cc0ff,var(--mp))}.bar.exp i{background:linear-gradient(#a6e08f,var(--exp))}
.bar span{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;color:#fff;text-shadow:0 0 2px #000;font-variant-numeric:tabular-nums}
.bar.exp{height:6px}.bar.exp span{display:none}
.bar.lg{height:16px;background:#cfc3a3}.bar.lg span{line-height:16px;font-size:11px}

#chat{height:24px;line-height:24px;padding:0 10px;font-size:12px;background:rgba(39,52,95,.86);color:#e8ecff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat b{color:var(--gold);font-weight:500}#chat .sys{color:#ffb3a3}
#chat span{display:inline-block;animation:slide .35s}
@keyframes slide{from{transform:translateY(100%);opacity:0}}

#main{flex:1;overflow-y:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:12px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(var(--navy2),var(--navy));border-top:2px solid var(--gold)}
#nav button{position:relative;padding:7px 0 8px;color:#c6cdea;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{display:grid;place-items:center;width:40px;height:28px;border-radius:14px}
#nav button i svg{width:22px;height:22px}
#nav button.on{color:var(--gold)}#nav button.on i{background:rgba(240,194,75,.18)}
.ico svg{width:22px;height:22px}
#nav .dot{position:absolute;top:5px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hp)}
.pre #hud,.pre #chat,.pre #nav{display:none}

/* 共用 */
h2{font-family:var(--display);font-size:18px;color:var(--navy);text-wrap:balance}
h3{font-family:var(--display);font-size:16px;color:var(--navy)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 2px 0 rgba(86,60,20,.25);display:flex;flex-direction:column;gap:8px}
.panel>h3{border-bottom:1px dashed var(--line);padding-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row>.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12px}
.btn{padding:8px 12px;border-radius:8px;border:2px solid var(--line);background:linear-gradient(#fffdf5,var(--panel2));font-weight:700;color:var(--navy);box-shadow:0 2px 0 rgba(86,60,20,.3);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:linear-gradient(var(--navy2),var(--navy));color:var(--gold);border-color:var(--gold)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.big{padding:12px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:7px 0;border-radius:8px 8px 0 0;border:2px solid var(--line);border-bottom:none;background:var(--panel2);font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--panel);color:var(--navy)}
.tabs+.panel{border-top-left-radius:0;border-top-right-radius:0;margin-top:-12px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:var(--navy);color:var(--gold);white-space:nowrap}
.tag.red{background:var(--hp);color:#fff}.tag.ok{background:var(--exp);color:#fff}.tag.off{background:#b9b2a2;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.drops{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}.drop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid currentColor;background:rgba(255,255,255,.75);position:relative;overflow:hidden;animation:dropIn .5s cubic-bezier(.2,1.6,.4,1) both}.drop.d3{color:var(--r3);box-shadow:0 0 12px rgba(180,110,255,.45)}.drop.d4{color:var(--r4);box-shadow:0 0 16px rgba(255,200,60,.6)}.drop.shn{color:#1593b3;box-shadow:0 0 14px rgba(60,200,240,.6)}.drop.shn b{color:#1593b3}.drop .grow{display:flex;flex-direction:column}.drop .sub{color:var(--sub);font-size:.85em}.drop::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:dropShine 1.6s .4s ease-out 2}@keyframes dropIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}@keyframes dropShine{to{transform:translateX(120%)}}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}.c4{color:var(--r4)}
.ico{flex:none;width:38px;height:38px;border-radius:8px;border:2px solid currentColor;background:#fff;font-family:var(--display);font-size:17px;display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;width:100%}
.item .grow{flex:1;min-width:0}.item b{display:block}.item .sub{display:block}
.empty{text-align:center;color:var(--sub);padding:18px 0}

/* 插畫預留位 */
.art{position:relative;overflow:hidden;border-radius:8px;border:2px dashed var(--line);background:repeating-linear-gradient(45deg,#efe2bd 0 10px,#f7edd2 10px 20px);width:100%}
.art.r169{aspect-ratio:16/9}.art.r34{aspect-ratio:3/4}.art.r11{aspect-ratio:1/1}
.art-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px;color:#7a5c2a}
.art-ph em{font-style:normal;font-size:10px;padding:0 6px;border:1px solid currentColor;border-radius:8px}
.art-ph b{font-family:var(--display);font-size:14px}
.art-ph i{font-style:normal;font-size:10px;font-family:ui-monospace,Menlo,monospace;opacity:.8;word-break:break-all}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art img.under{z-index:0}.art.has img.under{display:none}.art img:not(.under){z-index:1}
.art.mini img{object-position:50% 12%}
.art.mini{border:none;border-radius:0;height:100%}.art.mini em,.art.mini i{display:none}.art.mini b{font-size:11px}

/* 標題 */
.title{display:flex;flex-direction:column;gap:12px}
.title h1{font-family:var(--display);font-weight:900;font-size:34px;color:var(--navy);letter-spacing:.12em;text-align:center}
.title .en{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--sub)}
.title label,.lbl{font-weight:700;color:var(--navy);font-size:13px}
input,textarea{font:inherit;width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.cls-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cls{border:2px solid transparent;border-radius:10px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:13px}
.cls .art i,.cls .art em{display:none}
.cls.on{border-color:var(--navy);background:var(--panel2)}

/* 城鎮 */
.banner{position:relative}.banner .cap{position:absolute;left:8px;bottom:8px;background:rgba(39,52,95,.88);color:#fff;padding:2px 10px;border-radius:6px;font-family:var(--display)}
.banner .cap small{font-family:var(--body);color:var(--gold);margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fac{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;box-shadow:0 2px 0 rgba(86,60,20,.25)}
.fac .pt{width:44px;height:58px;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fac b{display:block;font-family:var(--display);color:var(--navy)}.fac span{font-size:11px;color:var(--sub)}

/* 冒險 */
.area{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.area.lock{opacity:.55}
.pips{display:flex;gap:6px;justify-content:center}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:11px;color:var(--sub)}
.pip.done{background:var(--exp);border-color:var(--exp);color:#fff}.pip.now{background:var(--gold);color:var(--navy);font-weight:700}
.pip.boss{border-color:var(--hp);color:var(--hp)}
.die{width:84px;height:84px;margin:4px auto;border-radius:16px;border:3px solid var(--navy);background:#fff;font-family:var(--display);font-weight:900;font-size:38px;display:grid;place-items:center;color:var(--navy);box-shadow:0 4px 0 var(--navy)}
.die.ok{border-color:var(--exp);color:var(--exp);box-shadow:0 4px 0 var(--exp)}.die.ng{border-color:var(--hp);color:var(--hp);box-shadow:0 4px 0 var(--hp)}
.calc{text-align:center;font-variant-numeric:tabular-nums}
.opt{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;white-space:normal}

/* 戰鬥 */
.battle{display:flex;flex-direction:column;gap:8px}
.stage{position:relative;height:clamp(230px,52vh,440px);border:2px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(#bfe6fb 0 55%,#9ed27f 55%)}
.stage.bg-forest{background:linear-gradient(#5b6f8f 0 50%,#3f6b4a 50%)}
.stage.bg-mine{background:linear-gradient(#3b3440 0 50%,#6b5847 50%)}
.stage.bg-snow{background:linear-gradient(#cfe3f5 0 52%,#f4f8fc 52%)}
.stage.bg-castle{background:linear-gradient(#2a1838 0 52%,#4a2740 52%)}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spr{position:absolute}
.spr.foe{right:7%;top:9%;width:38%}
.spr.foe.szs{right:2%;top:5%;width:50%}.spr.foe.szm{right:4%;top:7%;width:44%}
.spr.me{left:4%;bottom:2%;width:40%}
.plat{position:absolute;left:-12%;right:-12%;bottom:-8px;height:26px;border-radius:50%;background:rgba(0,0,0,.22)}
.ibox{position:absolute;background:var(--panel);border:2px solid var(--navy);border-radius:8px 2px 8px 2px;padding:4px 8px;font-size:12px;box-shadow:2px 2px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;gap:3px}
.ibox.foe-i{left:8px;top:8px;width:50%}.ibox.me-i{right:8px;bottom:8px;width:54%}
.ibox .nm{display:flex;justify-content:space-between;gap:6px;font-weight:700;white-space:nowrap;overflow:hidden}
.ibox .num{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
.ibox .chip{font-size:10px;padding:0 5px}
.bbar{height:8px;background:#4a4458;border-radius:4px;overflow:hidden;border:1px solid #2c2742}
.bbar.s{height:5px}
.bbar i{display:block;height:100%;transition:width .6s ease-out .15s}
.bbar i.g{background:#4fce5d}.bbar i.y{background:#f0c24b}.bbar i.r{background:#e2483f}.bbar i.m{background:var(--mp)}
.in-r{animation:inR .5s ease-out}.in-l{animation:inL .5s ease-out}
@keyframes inR{from{transform:translateX(160%)}}@keyframes inL{from{transform:translateX(-160%)}}
.lunge-me{animation:lgM .4s}@keyframes lgM{40%{transform:translate(38%,-28%)}}
.lunge-foe{animation:lgF .4s}@keyframes lgF{40%{transform:translate(-38%,28%)}}
.spr.hit .art{animation:hitA .5s .2s}@keyframes hitA{0%{filter:brightness(2.4) saturate(.3)}18%{filter:brightness(1.3)}40%,100%{filter:none}}
.spr.faint{animation:faint .5s .6s forwards}.faintl{animation:faint .5s 1.4s forwards}.dmg.eltag{font-size:13px;margin-top:-26px;color:#ffd34a}.dmg.eltag.r{color:#9fb0c8}.dmg.eltag.rend{color:#ffb070}@keyframes faint{to{transform:translateY(60%);opacity:0}}
.spr.glow .art{animation:glow .7s}@keyframes glow{50%{box-shadow:0 0 18px 6px #fff7b0;filter:brightness(1.4)}}
.quake{animation:quake .4s .2s}@keyframes quake{20%,60%{transform:translate(-6px,3px)}40%,80%{transform:translate(6px,-3px)}}
.fl{position:absolute;inset:-10%;border-radius:50%;opacity:0;animation:fl .45s .2s;pointer-events:none}
@keyframes fl{30%{opacity:.95;transform:scale(1.1)}to{opacity:0;transform:scale(1.5)}}
.el-phys{background:linear-gradient(135deg,transparent 45%,#fff 48% 52%,transparent 55%);border-radius:0}
.el-fire{background:radial-gradient(#fff3a0,#ff7a2f 45%,transparent 70%)}
.el-ice{background:radial-gradient(#fff,#5fc4ff 45%,transparent 70%)}
.el-thunder{background:radial-gradient(#fff,#ffe14a 45%,transparent 70%)}
.el-holy{background:radial-gradient(#fff,#ffe9a0 45%,transparent 70%)}
.el-dark{background:radial-gradient(#e6c2ff,#5a2a8a 45%,transparent 70%)}
.el-poison{background:radial-gradient(#f0ffc2,#7ac23a 45%,transparent 70%)}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-size:28px;color:#fff;-webkit-text-stroke:1.5px var(--hp);text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 10px rgba(255,255,255,.5);opacity:0;animation:pop .9s .2s forwards;pointer-events:none;white-space:nowrap;z-index:3}
.dmg.cr{font-size:44px;color:#ffe45a;-webkit-text-stroke:2px #c2410c;text-shadow:0 0 12px #ff8a2a,0 0 24px #ffb04a}
.dmg.heal{color:#c9ffc2;-webkit-text-stroke:1.5px #2c8a3a;top:10%}
.dmg.miss{font-size:20px;-webkit-text-stroke:1.5px var(--navy)}
@keyframes pop{0%{opacity:0;top:38%;transform:translateX(-50%) scale(2.4)}10%{opacity:1;transform:translateX(-50%) scale(.85)}17%{transform:translateX(-50%) scale(1.15)}24%{transform:translateX(-50%) scale(1)}75%{opacity:1;top:20%}100%{opacity:0;top:6%;transform:translateX(-50%) scale(1)}}
.cutin{position:absolute;left:0;right:0;top:40%;padding:4px 0;background:linear-gradient(90deg,transparent,var(--navy) 20% 80%,transparent);color:var(--gold);font-family:var(--display);font-weight:900;font-size:20px;text-align:center;letter-spacing:.2em;animation:cut .9s forwards;pointer-events:none;z-index:4}
.cutin.bad{background:linear-gradient(90deg,transparent,#6b1f2a 20% 80%,transparent);color:#fff}
@keyframes cut{from{transform:translateX(-100%);opacity:0}20%,75%{transform:none;opacity:1}to{transform:translateX(100%);opacity:0}}
.msg{background:var(--panel);border:3px double var(--navy);border-radius:8px;padding:8px 12px;min-height:66px;white-space:pre-line;font-size:13px;font-weight:500}
.art.has{border-color:transparent;background:none}.art.has .art-ph{display:none}
.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cmd.col{grid-template-columns:1fr 1fr}
.cmd .btn{padding:10px 4px;white-space:normal;line-height:1.25}
.cmd .btn small{display:block;font-weight:400;font-size:10px;color:var(--mp)}

/* 角色 */
.char-top{display:grid;grid-template-columns:38% 1fr;gap:10px}
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.stat-g div{display:flex;justify-content:space-between;border-bottom:1px dotted #d8c79b}
.stat-g .main{font-weight:700;color:#7a3fc0}.stat-g .main b{font-size:15px}
.attr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.step{display:flex;gap:6px;align-items:baseline}.step i{font-style:normal;color:var(--sub)}.step.done{color:var(--exp)}

/* 浮層 */
#modal{position:absolute;inset:0;background:rgba(20,22,40,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:86%;display:flex;flex-direction:column;background:var(--paper);border-top:3px solid var(--gold);border-radius:14px 14px 0 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:linear-gradient(var(--navy2),var(--navy));border-radius:11px 11px 0 0}
.sheet-h h3{color:var(--gold)}.x{color:#fff;font-size:24px;line-height:1;padding:0 6px}
.sheet-b{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#story{position:absolute;inset:0;z-index:30;background:#141628;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px}
.say{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:10px 12px;min-height:118px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.say .pt{width:60px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.say .who{font-family:var(--display);color:var(--navy)}
.say .nx{grid-column:1/-1;text-align:right;font-size:11px;color:var(--sub)}
#story .skip{align-self:flex-end;color:#fff;border:1px solid #fff;border-radius:6px;padding:2px 10px;font-size:12px}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%}
#toast div{background:rgba(39,52,95,.95);color:#fff;border:1px solid var(--gold);padding:5px 14px;border-radius:16px;font-size:13px;animation:tin 2.2s forwards;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}85%{opacity:1}to{opacity:0}}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}
/* 性別選擇 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:8px 6px;border:2px solid var(--line);border-radius:8px;background:var(--panel2);font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button.on{background:linear-gradient(var(--navy2),var(--navy));color:var(--gold);border-color:var(--gold)}
.seg small{font-weight:400;font-size:11px}
/* 魔物與角色待機動態 */
.spr .art img{transform-origin:50% 100%}
.spr.foe .art img{animation:breathe 2.2s ease-in-out infinite}

  a:[['蜜可','{name}！大事不好！有客人拿著「蜜可牌治療藥水」來退貨，說喝了會一直打噴嚏！'],['蜜可','可是那根本不是我做的！瓶子是仿的，標籤上的字還寫錯——我的「蜜」才不是長那樣！'],['蜜可','我聞過了，裡面加了迷霧森林的紫菇孢子。有人在森林裡採菇做假貨。'],['蜜可','幫我去菇群那邊看看？不用抓人，只要找出孢子是從哪裡來的就好！']],
  req:{type:'kill',mob:'shroom',c:5,d:'在迷霧森林擊敗瘴氣毒菇 5 隻，追查孢子來源'},
  b:[['旁白','菇群中央有一個被踩平的空地，留著攤販用的木架和一頂舊斗篷。'],['蜜可','這斗篷……是那個「神秘商人」的。他常在路邊跟冒險者賭運氣。'],['蜜可','咦？斗篷內袋縫著一張紙條。「給小蜜：店要顧好，帳要記好。」'],['蜜可','……這是爸爸的字。'],['蜜可','他五年前說要出門進貨，就再也沒回來。原來他一直在附近亂晃？還賣假藥水？！'],['蜜可','{name}，下次遇到那個神秘商人，幫我把他抓回來。我要親自跟他算帳！']],
  rw:{gold:500,exp:350,items:{eth:3}}},
 {id:'miko2',npc:'蜜可',fac:'shop',pre:'miko1',ch:2,n:'帳要記好',key:'town_bg',
  a:[['蜜可','我想通了。爸爸會躲，是因為欠了一屁股債，怕連累我。'],['蜜可','債主是礦坑那邊的走私商人，收的是史萊姆凝膠和黑狼之牙。'],['蜜可','把這些材料湊齊，我去幫他還。……當然，之後要他做牛做馬還給我！']],
  req:{type:'item',item:'m_fang',c:4,d:'交付黑狼之牙 4 個'},
  b:[['旁白','幾天後，道具店的櫃台後面多了一個披著舊斗篷的中年男人，正被蜜可罵得抬不起頭。'],['神秘商人','咳，這位冒險者，謝謝你。我女兒的脾氣……像她媽。'],['蜜可','爸！不准跟客人亂聊！去把貨架擦乾淨！'],['蜜可','{name}，從今天起，我們店裡的藥水打九折。別誤會，這不是謝禮，是……老客人優惠！'],['旁白','從那天起，道具店的帳本上多了一行很醜的字：「欠小蜜：一輩子。」']],
  rw:{gold:800,exp:700,items:{pot2:3},flag:'mikoDad'}},

 /* ---- 瑪莎：雪夜的信 ---- */
 {id:'mar1',npc:'瑪莎',fac:'inn',ch:1,n:'旅店的屋頂',key:'town_bg',
  a:[['瑪莎','{name}，昨晚的風把屋頂的瓦片吹掉了幾片，幫阿姨爬上去補一補？'],['旁白','屋頂上可以看見整個晨星鎮，還有北方地平線上那條淡淡的黑線。'],['瑪莎','你小時候就是坐在那個位置，說要看黑霧後面有什麼。','m'],['瑪莎','妳小時候就是坐在那個位置，說要看黑霧後面有什麼。','f'],['瑪莎','我那時候罵得好兇，其實是怕。怕{你|妳}哪天真的跑去了。'],['瑪莎','……結果{你|妳}現在真的要去了。'],{q:'{name} 怎麼回答？',choice:[
    {t:'「我會回來的。每一次都會。」',lines:[['瑪莎','嗯。旅店的門，永遠幫{你|妳}留著。']]},
    {t:'「阿姨，妳的燉肉是我回來的理由。」',lines:[['瑪莎','哈！那我可得多學幾道菜，把{你|妳}拴住才行。']]}]}],
  rw:{exp:300,items:{pot2:2}}},
 {id:'mar2',npc:'瑪莎',fac:'inn',pre:'mar1',ch:4,n:'櫃台下的地圖',key:'town_bg',
  a:[['瑪莎','{name}，坐下。要上山之前，阿姨有樣東西要給{你|妳}。'],['旁白','瑪莎從櫃台底下拿出一張折得很舊的地圖，邊角都磨破了。'],['瑪莎','你姨丈的。二十年前他跟著第一支遠征隊走了，沒有回來。','m'],['瑪莎','妳姨丈的。二十年前他跟著第一支遠征隊走了，沒有回來。','f'],['瑪莎','上面的記號是他走過的路。哪裡有洞穴可以躲雪，哪裡的冰會裂，他都畫了。'],['瑪莎','我本來想燒掉的。燒了好幾次，都下不了手。'],['瑪莎','你小時候爬屋頂看北邊，我那麼兇，就是怕……算了。拿去吧。','m'],['瑪莎','妳小時候爬屋頂看北邊，我那麼兇，就是怕……算了。拿去吧。','f'],['瑪莎','只要{你|妳}答應我一件事：走到他沒走完的地方，然後回來告訴我。']],
  rw:{exp:2500,items:{gem_w:1}}},

 /* ---- 托托（小男孩） ---- */
 {id:'boy1',npc:'托托',fac:'inn',ch:1,n:'托托的最後一隻羊',key:'area_plain',
  a:[['托托','{哥哥|姊姊}！還記得我嗎？在草原上被綁起來的那個！我叫托托！'],['托托','我現在在旅店幫瑪莎阿姨洗盤子。可是……我的羊還有一隻沒找回來，叫「棉花」。'],['托托','牠很笨，一定躲在尖角野兔的洞附近。拜託拜託！']],
  req:{type:'kill',mob:'hornrabbit',c:5,d:'在微風草原擊敗尖角野兔 5 隻，找回小羊'},
  b:[['旁白','尖角野兔的洞口，一團髒兮兮的白毛正在發抖。'],['托托','棉花！！'],['托托','{哥哥|姊姊}，謝謝{你|妳}！我決定了，我長大也要當冒險者！'],['{name}','當冒險者很危險喔。'],['托托','我知道！可是{你|妳}救了我，我也想救別人。這樣不行嗎？'],['瑪莎','……托托，先把盤子洗完再說。']],
  rw:{gold:300,exp:250,items:{pot:3}}},
 {id:'boy2',npc:'托托',fac:'inn',pre:'boy1',ch:3,n:'木劍與誓言',key:'town_bg',
  a:[['托托','{哥哥|姊姊}，你看！巴爾德大叔幫我做了一把木劍！'],['托托','跟我比一場！一下下就好！'],{q:'要怎麼跟托托比？',choice:[
    {t:'認真接招，讓他知道冒險不簡單',fx:{exp:200},lines:[['旁白','托托被輕輕絆倒了三次，第四次卻咬著牙站了起來。'],['托托','再、再一次！'],['{name}','……很好。會站起來的人，才有資格當冒險者。']]},
    {t:'故意輸給他',fx:{items:{pot:2}},lines:[['托托','我贏了！我贏了！'],['托托','……{哥哥|姊姊}，你是故意的吧。','m'],['托托','……姊姊，妳是故意的吧。','f'],['托托','下次要認真喔。等我長大，我要真的贏{你|妳}。']]}]},
   ['托托','對了，我想到一句很帥的話。我們冒險者小隊的誓言！'],['托托','「不管走多遠，我們都會回家。」……怎麼樣？']],
  rw:{exp:800,items:{stone:2}}},

 /* ---- 艾德溫：老書記的悔恨 ---- */
 {id:'edw1',npc:'艾德溫',fac:'temple',ch:2,n:'老書記的筆記',key:'area_forest',
  a:[['艾德溫','{name}，你知道二十年前那支遠征隊，為什麼會失敗嗎？'],['艾德溫','因為我們把霧當成天災，以為只要走得夠快就能穿過去。'],['艾德溫','我回來以後，花了二十年研究霧晶。可是手上的樣本太少，一直解不開它的構造。'],['艾德溫','幫我帶三塊霧晶碎片回來。這次，我想在你們出發前找出答案。']],
  req:{type:'item',item:'m_dark',c:3,d:'交付蝕霧碎片 3 個'},
  b:[['艾德溫','……奇怪。霧晶裡面，封著聲音。'],['艾德溫','我把它放在耳邊聽了一整晚。是一個小孩在數數，數到三十七就停住，然後重新開始。'],['艾德溫','二十年來我一直把霧當成天災。也許……它更像是一個記得東西的地方。'],['艾德溫','這份筆記你們帶著。上面寫了霧晶怕高熱、怕震動。打要塞的時候，用得上。']],
  rw:{gold:1200,exp:900,items:{eth2:2}}},
 {id:'edw2',npc:'艾德溫',fac:'temple',pre:'edw1',ch:4,n:'二十個名字',key:'area_castle',
  a:[['艾德溫','第一支遠征隊，二十個人。我把他們的名字刻在一塊木板上，二十年沒敢拿出來。'],['艾德溫','聽說要塞裡的墮落黑騎士，有些身上還掛著遠征隊的徽章。……那是被霧吞掉的人。'],['艾德溫','如果可以，把徽章帶回來。至少讓名字回到晨星鎮。']],
  req:{type:'kill',mob:'darkknight',c:4,d:'在黑霧要塞擊敗墮落黑騎士 4 隻，帶回遠征隊徽章'},
  b:[['旁白','艾德溫把四枚生鏽的徽章，一枚一枚擺在木板的名字旁邊。'],['艾德溫','……巴爾德的搭檔、瑪莎的丈夫，都在這裡。'],['艾德溫','這塊板子明天就掛到公會大廳。以後每支出發的隊伍，都要從它前面走過。'],['艾德溫','謝謝你，{name}。你讓一個老人終於能好好睡一覺了。']],
  rw:{gold:3000,exp:2500,items:{gem_b:1}}},

 /* ---- 占星師與蓋爾的歸來（主線完結後） ---- */
 {id:'ora1',npc:'占星師',fac:'altar',ch:2,n:'霧裡的星星',key:'title_bg',
  a:[['占星師','你相信星星會告訴人方向嗎？'],['占星師','黑霧來了以後，北方的星空就看不見了。旅人在霧裡迷路，就是因為少了星星。'],['占星師','可是最近，礦坑那邊的夜空有一顆星特別亮。……亮得像是有人在下面點燈。'],['占星師','吸血蝙蝠一直在擋那個方向的光。去趕走牠們，讓我看清楚那顆星。']],
  req:{type:'kill',mob:'bat',c:6,d:'擊敗吸血蝙蝠 6 隻，讓星光重現'},
  b:[['占星師','看清楚了。那不是星，是一盞燈，藍色的。'],['占星師','……守著那盞燈的，是一個銀頭髮的騎士。他每天晚上都朝晨星鎮的方向看。'],['占星師','露娜那孩子，每天晚上也朝北方看。你知道嗎？']],
  rw:{gold:900,exp:800,items:{gem_y:1}}},
 {id:'gale1',npc:'占星師',fac:'altar',pre:'ora1',ch:5,n:'城頭的頭盔',key:'area_castle',
  a:[['占星師','北方的那盞藍燈，還亮著。'],['露娜','……我知道。我每天晚上都看得到。'],['露娜','{name}，我想回要塞看看。哥哥的頭盔還在城頭，也許他留下了什麼。'],['占星師','要塞裡還有沒散掉的騎士在遊蕩。小心。']],
  req:{type:'kill',mob:'darkknight',c:5,d:'在黑霧要塞擊敗殘存的墮落黑騎士 5 隻'},
  b:[['旁白','城頭的頭盔底下壓著一張紙，是蓋爾的字。'],['旁白','「我去把村子挖出來。等它變回原來的樣子，我才有臉回去見妳。」'],['露娜','……笨蛋哥哥。誰要你一個人挖。'],['露娜','{name}，北方的村子。我們去接他。']],
  rw:{exp:3000,items:{stone:3}}},
 {id:'gale2',npc:'占星師',fac:'altar',pre:'gale1',ch:5,n:'融雪的村子',key:'area_snow',
  a:[['露娜','村子在冰龍棲地的後面。晶石正在融化，但冰川巨人把那裡當成了地盤。'],['露娜','哥哥一個人……一定撐不了多久。']],
  req:{type:'kill',mob:'frostgiant',c:4,d:'在霜雪山脈擊敗冰川巨人 4 隻，打開通往村子的路'},
  b:[['旁白','雪地裡，一座小村子的屋頂露出了一半。蓋爾跪在一棟木屋前，用手一點一點地挖著冰。'],['蓋爾','……你們不該來的。'],['露娜','你也不該一個人來。'],['蓋爾','我替那台機器收集了三年的晶石。這個村子變成這樣，有一半是我害的。我沒有資格——'],['{name}','巴爾德說，你還欠他一把劍的尾款。'],['蓋爾','……什麼？'],['{name}','劍柄上刻著「給要回家的人」。是你自己寫的。'],['旁白','蓋爾低下頭，很久很久以後，才慢慢站了起來。'],['蓋爾','……那就回去吧。總不能讓老頭子一直等。'],['露娜','嗯。村子我們一起挖。先回家。']],
  rw:{exp:4000,items:{gem_g:1},flag:'galeBack'}},
 {id:'gale3',npc:'巴爾德',fac:'smith',pre:'gale2',ch:5,n:'給要回家的人',key:'town_bg',
  a:[['巴爾德','喲，欠錢的總算上門了。'],['蓋爾','……我是來付尾款的。'],['巴爾德','拿去。錢先欠著，用一輩子還。'],['蓋爾','（握住劍柄）……比我記得的還輕。'],['巴爾德','是你變壯了。……歡迎回來，小子。'],['蓋爾','{name}。從今天起，讓我跟著你們。這次，我想用這把劍保護別人回家。'],['旁白','鐵匠舖的牆上空出一個位置。那把劍，終於跟著它的主人走了。']],
  rw:{exp:2000,items:{pot2:5}}}
];

/* ============ 狀態 ============ */
const KEY='azure_oath_save_v1';
let S=null,TAB='town',RUN=null,B=null,MODAL=null,STORY=null;
let NEWCLS='swordsman',NEWSEX='m',BAGF='all',NEWNAME='',BAGTAB='gear',QTAB='main',AUTO=false,CHATQ=[];
let BAKT=0;function save(){try{if(S&&S.ach)checkAch()}catch(e){}try{const j=JSON.stringify(S);localStorage.setItem(KEY,j);if(Date.now()-BAKT>300000){BAKT=Date.now();localStorage.setItem(KEY+'_bak',j)}}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s)S=JSON.parse(s)}catch(e){S=null}if(!S||!S.cls){try{const b=localStorage.getItem(KEY+'_bak');if(b){S=JSON.parse(b);setTimeout(()=>toast('主存檔損壞，已從備份還原'),800)}}catch(e){}}}
function newGame(name,cls,sex){
  S={created:Date.now(),v:2,name,cls,sex,adv:null,lv:1,exp:0,gold:100,attr:Object.assign({},CLS[cls].base),pts:0,sp:0,skl:{},hp:1,mp:1,
     eq:{weapon:null,head:null,body:null,feet:null,ring:null,neck:null},gear:[],items:{pot:3,eth:1},uid:1,
     main:{ch:0,step:0,prog:0,acc:false},side:{},nst:{},cleared:{},flags:{},bond:0,
     st:{kills:0,run:0,enh:0,check:0,craft:0,nmboss:0},tut:{},dex:{m:{},g:{}},ach:{},tower:{best:0},daily:{date:'',kill:0,run:0,enh:0,got:{},sign:false}};
  const w=addGear(`w_${cls}_0`,0),a=addGear('a_0',0),f=addGear('f_0',0);S.eq.weapon=w.u;S.eq.body=a.u;S.eq.feet=f.u;
  learn(true);const s=stats();S.hp=s.HP;S.mp=s.MP;checkDaily();save();

const gearSell=g=>Math.round(GEAR[g.id].price*.3*(1+g.r)*(1+g.p*.2));
function artList(){const L=[['title_bg','標題主視覺','1280×720'],['town_bg','晨星鎮全景','1280×720']];
  for(const k of [...Object.keys(CLS),...Object.keys(ADV)])for(const x of ['m','f'])L.push([`class_${k}_${x}`,(CLS[k]||ADV[k]).n+(x==='m'?' 男':' 女')+'立繪','768×1024']);
  for(const k in NPC)L.push([NPC[k],'NPC '+k,'768×1024']);
  AREAS.forEach(a=>{L.push(['area_'+a.id,'地圖 '+a.n,'1280×720']);L.push(['battle_'+a.id,'戰鬥背景 '+a.n,'1280×960'])});
  for(const k in MOBS)L.push(['mob_'+k,'魔物 '+MOBS[k].n,'768×768']);
  CH.forEach((c,i)=>{for(const x of ['m','f']){L.push([`story_ch${i+1}_intro_${x}`,c.t+' 開場','1280×720']);L.push([`story_ch${i+1}_outro_${x}`,c.t+' 結尾','1280×720'])}});
  EVENTS.forEach(e=>L.push(['event_'+e.id,'事件 '+e.n,'1280×720']));return L}

/* ============ 劇情 ============ */
function okLine(l){if(!Array.isArray(l))return true;const c=l[2];if(!c)return true;if(c==='m'||c==='f')return S.sex===c;
  if(c[0]==='#')return !!S.flags[c.slice(1)];if(c[0]==='!')return !S.flags[c.slice(1)];if(c.startsWith('bond>='))return (S.bond||0)>=+c.slice(6);if(c.startsWith('bond<'))return (S.bond||0)<+c.slice(5);return true}
function stNext(){do{STORY.i++}while(STORY.i<STORY.lines.length&&!okLine(STORY.lines[STORY.i]));if(STORY.i>=STORY.lines.length)storyEnd();else drawStory()}
function play(lines,key,label,after,replay){STORY={lines:[...lines],i:-1,key,label,after,replay};stNext()}
function drawStory(){const el=$('#story');if(!STORY){el.hidden=true;el.innerHTML='';return}
  const L=STORY.lines[STORY.i];el.hidden=false;
  if(!Array.isArray(L)){el.innerHTML=`<button class="skip" data-a="storySkip">跳過</button>${art(STORY.key,STORY.label)}
    <div class="say" style="display:flex;flex-direction:column"><div class="who">${esc(you(tx(L.q||'{name} 要怎麼做？')))}</div><div class="choices">${L.choice.map((o,i)=>o.cond&&!okLine(['','',o.cond])?'':`<button class="btn" data-a="storyPick" data-v="${i}">${esc(you(tx(o.t)))}</button>`).join('')}</div></div>`;return}
  const [w,t]=L,who=tx(w),hero=w==='{name}',nk=NPC[w],k=hero?PKEY(heroFace(t)):nk&&nk.startsWith('npc_')?'portrait_'+nk+(heroFace(t)?'_'+heroFace(t):''):nk;
  el.innerHTML=`<button class="skip" data-a="storySkip">跳過</button>${art(STORY.key,STORY.label)}
   <button class="say" data-a="storyNext" style="text-align:left">${k?`<div class="pt">${art(k,who,'r34','mini')}</div>`:'<span></span>'}<div><div class="who">${esc(who)}</div><p>${esc(you(tx(t)))}</p></div><div class="nx">點擊繼續 ▼</div></button>`}
function storyPick(i){const o=STORY.lines[STORY.i].choice[i],f=o.fx||{};
  if(!STORY.replay){if(f.bond){S.bond=(S.bond||0)+f.bond;toast(`與露娜的羈絆提升了`)}if(f.flag)S.flags[f.flag]=1;
    if(f.items)for(const k in f.items){addItem(k,f.items[k]);toast(`獲得 ${ITEMS[k].n}×${f.items[k]}`)}if(f.exp)gainExp(f.exp);save()}
  STORY.lines.splice(STORY.i+1,0,...(o.lines||[]));stNext()}
function storyEnd(){const f=STORY.after;STORY=null;drawStory();if(f)f()}

  {id:'a_shelf',ar:'archive',n:'倒塌的書架',t:'一排書架倒在黑水裡，底下壓著一個還在發光的檔案盒。',o:[
    {l:'抬起書架',a:'STR',dc:14,ok:{t:'盒子裡是一份沒被刮掉的名冊副本，還有一件陪葬的飾品。',exp:3,loot:1},ng:{t:'書架又滑回水裡，濺了你一身墨水。',hp:-.12}},
    {l:'從縫隙伸手去撈',a:'DEX',dc:13,ok:{t:'你撈到盒子，裡面有幾枚古金幣。',gold:3.5},ng:{t:'被書蠹咬了一口。',hp:-.1}}]},
  {id:'a_ink',ar:'archive',n:'自己寫字的羽毛筆',t:'一張桌子上，羽毛筆正在空白的紙上一筆一筆寫著一個名字，寫完就塗黑，再重寫一次。',o:[
    {l:'握住羽毛筆',a:'VIT',dc:14,ok:{t:'筆在你手中停了。紙上留下一個名字，沒有被塗黑。你覺得肩膀輕了一點。',exp:3.5,mp:.4},ng:{t:'筆尖刺進你的手，墨水滲進傷口。',hp:-.15,mp:-.15}},
    {l:'把那頁紙收起來',a:'LUK',dc:12,ok:{t:'紙背面寫著書庫暗門的位置。',gold:2,stone:1},ng:{t:'紙一碰就化成了黑水。',exp:.5}}]});
EVENTS.push(
  {id:'p_kite',ar:'plain',n:'卡在樹上的風箏',t:'一個小女孩指著樹梢哭，她的風箏卡在枝頭，風一吹就快要扯破了。',o:[
    {l:'爬上去拿',a:'DEX',dc:10,ok:{t:'你把風箏完好地拿下來。小女孩的媽媽塞給你一袋烤餅乾。',exp:1.5,hp:.2},ng:{t:'樹枝斷了，你摔了個屁股著地。小女孩破涕為笑。',hp:-.06,exp:.5}},

  {id:'p_goblin',ar:'plain',n:'哥布林的交易',t:'一隻落單的哥布林舉著一顆紫色石頭，比手畫腳地想跟你換東西。',o:[

    {l:'問牠石頭哪來的',a:'INT',dc:12,ok:{t:'牠指了指北方，又學「穿斗篷的人」走路的樣子。你記下了這個情報。',exp:2.5},ng:{t:'牠聽不懂，嘰嘰喳喳地走了。',exp:.3}}]},
  {id:'f_wisp2',ar:'forest',n:'停住的蝴蝶',t:'霧邊的空氣裡，一隻藍色蝴蝶懸在半空，翅膀張開，一動也不動。',o:[
    {l:'伸手碰牠',a:'VIT',dc:12,ok:{t:'指尖一碰，蝴蝶突然拍拍翅膀飛走了。周圍的霧退了一點點。',exp:2.5,mp:.3},ng:{t:'一股寒意從指尖竄上來，你的手麻了好一陣子。',hp:-.1,mp:-.1}},
    {l:'把這一幕畫下來',a:'INT',dc:11,ok:{t:'露娜看了你的畫很久：「霧碰過的東西，會停在那一刻。」',exp:2},ng:{t:'畫得太醜，連你自己都看不懂。',exp:.3}}]},
  {id:'f_mushroom',ar:'forest',n:'發光的蘑菇圈',t:'樹根之間長了一圈發著紫光的蘑菇，中間的草地乾乾淨淨，好像有人常常坐在這裡。',o:[
    {l:'摘幾朵回去',a:'LUK',dc:11,ok:{t:'蜜可說這是上好的藥材，跟你高價收購。',gold:3},ng:{t:'孢子噴了你一臉，你打了一整天噴嚏。',hp:-.08}},
    {l:'坐在圈裡休息',safe:1,ok:{t:'你坐下來，四周安靜得只剩下呼吸聲。醒來時精神好多了。',hp:.25,mp:.25}}]},
  {id:'m_lamp',ar:'mine',n:'熄滅的礦燈',t:'坑道牆上掛著一排礦燈，全都熄了，只有最裡面一盞還在閃。',o:[
    {l:'把礦燈一盞盞點亮',a:'INT',dc:12,ok:{t:'燈光照亮了一條被遺忘的支坑，裡面堆著沒運走的礦石。',stone:1,gold:2},ng:{t:'燈油漏出來，差點燒到你的袖子。',hp:-.08}},
    {l:'朝著閃爍的燈走',a:'LUK',dc:12,ok:{t:'燈下躺著一個舊工具箱，裡面有前人留下的裝備。',loot:1},ng:{t:'燈在你靠近時熄了，你在黑暗中撞到頭。',hp:-.12}}]},
  {id:'m_miner',ar:'mine',n:'迷路的老礦工',t:'一個白髮礦工坐在岔路口發呆，嘴裡唸著三十年前的坑道編號。',o:[
    {l:'陪他找出口',a:'VIT',dc:11,ok:{t:'他記起了路，還告訴你一條通往深處的捷徑。',exp:2.5,item:['pot2',1]},ng:{t:'你們一起繞了好久才出來。',hp:-.08,exp:1}},
    {l:'問他三十年前的事',a:'INT',dc:12,ok:{t:'「我們挖到一面畫著人的牆，他們都在笑……然後礦坑就封了。」',exp:3},ng:{t:'他搖搖頭，什麼都想不起來。',exp:.3}}]},
  {id:'s_wolf',ar:'snow',n:'受傷的雪狼',t:'雪地上一隻雪狼拖著受傷的後腿，看見你，齜牙低吼，卻站不起來。',o:[
    {l:'替牠包紮',a:'VIT',dc:13,ok:{t:'牠舔了舔你的手，一拐一拐地跑進風雪。不久後，你在路邊發現牠叼來的一袋東西。',exp:2.5,loot:1},ng:{t:'牠咬了你一口，然後逃走了。',hp:-.15}},
    {l:'留下食物離開',safe:1,ok:{t:'你放下一塊肉，慢慢後退。雪狼一直看著你走遠。',exp:1.5}}]},
  {id:'s_aurora',ar:'snow',n:'山頂的極光',t:'夜裡的山頂上，綠色的光帶在天空流動。露娜說，霧最濃的那年，北方再也看不到極光。',o:[
    {l:'許個願',safe:1,ok:{t:'你閉上眼睛許願。睜開時，露娜正偷偷看你。',hp:.3,mp:.3,exp:1}},
    {l:'記錄光帶的方向',a:'INT',dc:13,ok:{t:'光帶指的方向，剛好是黑霧要塞。艾德溫說這份紀錄很珍貴。',exp:3,gold:1.5},ng:{t:'冷到手抖，什麼都沒寫好。',hp:-.06}}]},
  {id:'c_knight',ar:'castle',n:'跪著的黑騎士',t:'大廳裡一具黑色鎧甲單膝跪地，手按著劍。鎧甲胸口掛著遠征隊的徽章。',o:[
    {l:'取下徽章',a:'LUK',dc:13,ok:{t:'徽章背面刻著名字。你把它收好，要帶回去給艾德溫。',exp:3,gold:1},ng:{t:'鎧甲突然動了一下，你嚇得退開。',hp:-.12}},
    {l:'對他行禮',safe:1,ok:{t:'你低頭行禮。鎧甲的頭盔好像微微點了一下。',exp:2}}]},
  {id:'c_engine',ar:'castle',n:'嗡嗡作響的管線',t:'牆裡的銅管發出低沉的嗡嗡聲，一路通往要塞深處。管子上結著一層霧晶。',o:[
    {l:'敲下霧晶',a:'STR',dc:13,ok:{t:'敲下的霧晶還很完整，能賣不少錢。',gold:4},ng:{t:'管子噴出一陣冷霧，凍傷了你的手。',hp:-.15}},
    {l:'順著管線找源頭',a:'INT',dc:14,ok:{t:'你畫下管線的走向，找到了一條通往引擎的捷徑。',exp:3.5},ng:{t:'管線繞成一團，你迷路了一陣子。',exp:.5}}]},
  {id:'r_toll',ar:'road',n:'私設的關卡',t:'幾個盜賊用破馬車擋住街道：「過路費，一人十枚金幣。」',o:[
    {l:'打過去',a:'STR',dc:13,ok:{t:'盜賊四散逃跑，留下他們搶來的東西。',gold:3,loot:1},ng:{t:'對方人多，你挨了幾下才突破。',hp:-.18}},
    {l:'付錢了事',safe:1,ok:{t:'你付了錢。盜賊頭目愣了一下，還找了零錢給你。',gold:-.8,exp:1}}]},
  {id:'r_field',ar:'road',n:'荒廢的麥田',t:'街道兩旁是一望無際的荒地，地上還插著褪色的稻草人。瑪莎說過，這裡以前全是麥田。',o:[
    {l:'在稻草人底下挖挖看',a:'LUK',dc:12,ok:{t:'稻草人底下埋著一個陶罐，裝著農家藏的積蓄和一封信：「等霧退了就回來」。',gold:3.5,exp:1},ng:{t:'只挖到石頭。',exp:.3}},
    {l:'把稻草人扶正',safe:1,ok:{t:'你把稻草人扶好。遠處好像有人家冒出了炊煙。',exp:1.5,hp:.15}}]},
  {id:'a_whisper',ar:'archive',n:'書架間的低語',t:'書架深處有人在小聲唸名字，一個接一個，聲音溼漉漉的。',o:[
    {l:'跟著一起唸',a:'VIT',dc:14,ok:{t:'唸完最後一個名字，低語停了。你覺得那些人好像說了聲謝謝。',exp:4,mp:.3},ng:{t:'名字越唸越多，你頭痛欲裂。',mp:-.25}},
    {l:'循聲找過去',a:'DEX',dc:13,ok:{t:'書架後面是一具積水妖，牠抱著一本名冊，看見你就化成水流走了，名冊留了下來。',exp:3,gold:2},ng:{t:'你踩進深水，整個人沉了一下。',hp:-.15}}]},
  {id:'a_seal',ar:'archive',n:'上了封蠟的箱子',t:'一個鐵箱上貼滿紅色封蠟，每一張都寫著「永久封存」。',o:[
    {l:'撬開封蠟',a:'STR',dc:14,ok:{t:'箱子裡是氣象院的舊儀器和一件裝備。',loot:1,stone:1},ng:{t:'封蠟一破，警報般的金光閃過，你被震退。',hp:-.18}},
    {l:'抄下封蠟上的日期',a:'INT',dc:12,ok:{t:'封存的日期全都是同一天——遠征隊出發的隔天。艾德溫沉默了很久。',exp:3.5},ng:{t:'字跡被水泡糊了。',exp:.5}}]});
/* ===== 旅人劇情線：在對應地圖的事件格有機會遇到；該張劇情插圖到了才會出現 ===== */

const TRAV={
 toby:{n:'托比',s:[
  {t:'一個戴著過大郵差帽的少年從草叢裡衝出來，後面追著三隻哥布林。帆布郵包裡的信撒了一地。「拜託！別讓牠們踩到那封信！」',o:[
   {l:'擋住哥布林',ok:{t:'哥布林被你嚇跑了。少年抱著一封泛黃的信喘氣：「我叫托比，郵差。這封信……我一定要送到北方要塞。」',exp:1.5},aff:1},
   {l:'幫他撿信',ok:{t:'你撿回所有的信。最舊的那封寫著「北方要塞・遠征隊收」。托比把它塞回最裡層：「是我爸沒送出去的。」',gold:1},aff:1}]},
  {t:'霧邊的林道上排著一列小石頭。托比蹲在地上，一顆一顆往前擺。「霧會讓路跑掉，可是石頭不會。」',o:[
   {l:'陪他一起排',ok:{t:'你們排了很長一段。托比說他爸以前也是這樣送信的，「郵差的路，要自己做記號」。',exp:2},aff:1},
   {l:'問他為什麼非送不可',ok:{t:'「二十年前，我爸替遠征隊送補給。這是他回來後說好要送的最後一封。可是他後來生病了……」托比低頭擺下一顆石頭。',exp:1.5},aff:0}]},
  {t:'礦坑口，托比正跟一個礦工比手畫腳。礦工搖頭：「要塞？小鬼，那裡的路三十年前就塌了。」',o:[
   {l:'替他問清楚路線',ok:{t:'你問出一條舊軍道。托比把路線抄在信封背面，字歪歪扭扭的。',exp:2},aff:1},
   {l:'勸他先回家',ok:{t:'「我知道危險。」托比把帽子壓低，「可是信在我手上，就是我的工作。」',gold:1},aff:0}]},
  {t:'暴風雪裡，一團毯子在雪地上慢慢移動。是托比，臉凍得通紅，郵包緊緊抱在胸前。',o:[
   {l:'把他拉進避風處',ok:{t:'你生了火。托比捧著熱湯說：「謝謝……我差點以為，這封信要跟我一起停在雪裡了。」',hp:.2,exp:2},aff:1},
   {l:'把自己的斗篷給他',ok:{t:'托比裹著你的斗篷，小聲地說：「等我送完信，一定還你。這是郵差的承諾。」',exp:1.5},aff:2}]},
  {t:'要塞的廢墟裡，立著一個生鏽的遠征隊信箱。托比站在前面，手上的信抖個不停。',o:[
   {l:'陪他把信投進去',ok:{t:'信落進信箱，發出很輕的一聲。托比對著信箱敬了一個郵差的禮：「送達了。」',exp:3,gold:2},aff:1,end:'托比抹了抹眼睛，把信箱的蓋子擦亮：「爸，你沒做完的，我幫你做完了。」他把你的名字寫在郵差工作簿最後一頁，說以後你的信，他免費送。'},
   {l:'建議他拆開來看',ok:{t:'信是寫給艾德溫的：「對不起，那天我沒有等你們回來。」托比把信重新折好：「我回去親手交給他。」',exp:3},aff:0,end:'回程的路上，托比一直在練習要怎麼把信交給艾德溫。他說，有些信要送到人手上，才算送達。'}]}]},
 greta:{n:'葛蕾塔',s:[
  {t:'草原酒館的角落，一個臉上有疤的灰髮女人翻著一本破舊名冊，見人就問：「認不認識一個叫雷歐的年輕人？二十年前在霧邊站崗。」',o:[
   {l:'請她喝一杯',ok:{t:'「葛蕾塔，前傭兵教官。」她一口乾了酒，「當年是我下令撤退的。害他們背了二十年的逃兵罪名。」',exp:1.5},aff:1},
   {l:'幫她問酒館老闆',ok:{t:'老闆說雷歐好像往北邊去了。葛蕾塔把這行字記在名冊上，用力畫了一個圈。',gold:1},aff:1}]},
  {t:'森林裡，葛蕾塔拄著缺口的戰斧，正替一個迷路的年輕獵人帶路。「跟緊，別看霧。」',o:[
   {l:'一起護送獵人',ok:{t:'獵人平安出林。葛蕾塔說：「以前我也這樣帶著一群毛頭小子。後來，我把他們丟在霧邊。」',exp:2},aff:1},
   {l:'問她戰斧的缺口',ok:{t:'「撤退那天砍斷的旗桿。」她摸著缺口，「我要他們走，自己最後一個走。這是我唯一做對的事。」',exp:1.5},aff:1}]},
  {t:'礦坑深處，葛蕾塔和一個滿臉煤灰的礦工對望。礦工手上的十字鎬掉在地上：「……教官？」',o:[
   {l:'讓他們好好談',ok:{t:'你退到坑道口。很久以後，葛蕾塔走出來，名冊上「雷歐」兩個字旁邊多了一個勾。',exp:2.5},aff:1},
   {l:'告訴雷歐撤退的真相',ok:{t:'你說出第六章驛站裡老騎士說的事。雷歐哭了：「原來不是我們丟下崗位……」葛蕾塔拍拍他的肩膀。',exp:2},aff:2}]},
  {t:'雪山上的舊哨站，牆上刻著一排名字。葛蕾塔用斧刃在最後補上一個新的。',o:[
   {l:'問她刻的是誰',ok:{t:'「我自己。」她說，「當年的哨站名單上，唯獨沒有寫指揮官的名字。現在補上了。」',exp:2},aff:1},
   {l:'幫她把名字刻深一點',ok:{t:'兩個人一起刻，刻到手都麻了。她笑了：「這樣，風雪二十年也刮不掉。」',exp:2,hp:-.05},aff:1}]},
  {t:'黑霧要塞的城牆上，葛蕾塔望著重新開通的北方大道。身後站著幾個當年的部下。',o:[
   {l:'向她敬禮',ok:{t:'她回了一個標準的軍禮：「破霧者，你替我們把路打通了。」',exp:3,gold:2},aff:1,end:'葛蕾塔把名冊交給你：「上面的人，我都找到了。這本，替我交給王都。告訴他們，我們沒有逃。」她和部下們一起，站在城牆上守了最後一次夜。'},
   {l:'問她以後打算怎麼辦',ok:{t:'「回草原開個訓練場。」她笑，「這次教的，是怎麼活著回家。」',exp:3},aff:0,end:'後來，晨星鎮外多了一座傭兵訓練場。門口掛著一面舊軍旗，旗桿上有一道缺口。'}]}]},
 milo:{n:'米洛',s:[
  {t:'草原上，一個戴眼鏡的青年被野兔撞翻在地，捲軸散了一地。「啊啊我的比例尺！」',o:[
   {l:'幫他撿捲軸',ok:{t:'「謝謝！我叫米洛，王都學院的……呃，算是逃學的製圖學生。我要畫第一張霧退以後的北方地圖！」',exp:1.5},aff:1},

function wanderPick(){const ar=AREAS[RUN.area].id,st=WMAP.indexOf(ar);if(st<0||RUN.wSeen||!S)return null;S.wander=S.wander||{};
  const c=Object.keys(TRAV).filter(id=>{const w=S.wander[id]||{st:0};return w.st===st&&ARTSET&&ARTSET.has(`story_w_${id}_${ar}`)});return c.length?pick(c):null}
function wanderEv(id){S.wander=S.wander||{};const w=(S.wander[id]=S.wander[id]||{st:0,aff:0}),T=TRAV[id],sc=T.s[w.st];
  return {id:'w_'+id,n:`旅人・${T.n}`,img:`story_w_${id}_${WMAP[w.st]}`,t:sc.t,w:id,o:sc.o.map(o=>Object.assign({safe:1},o))}}
function wanderDone(ev,o){const w=S.wander[ev.w];w.aff=(w.aff||0)+(o.aff||0);const last=w.st===4;w.st++;
  if(last){const hi=w.aff>=5;S.wander[ev.w].done=1;return (hi&&o.end?o.end:o.ok.t)+(hi?'\n（羈絆深厚的結局）':'')}return null}
function evPick(i){const v=RUN.view,o=v.ev.o[i];
  if(o.safe){v.phase='done';v.r=null;v.text=you(o.ok.t);v.gain=applyOut(o.ok,false);if(v.ev.w){const e=wanderDone(v.ev,o);if(e){v.text=you(e);const g=applyOut({gold:4,exp:4,stone:2},false);v.gain=v.gain.concat(g)}}save();render();return}
  const d=R(1,20),mod=Math.floor(S.attr[o.a]/4),dc=o.dc+RUN.area*3,ok=d===20||(d!==1&&d+mod>=dc);
  v.phase='roll';render();let n=0;
  const tm=setInterval(()=>{const el=$('#die');if(el)el.textContent=R(1,20);
    if(++n>=10){clearInterval(tm);if(!RUN||RUN.view!==v)return;const out=ok?o.ok:o.ng;v.phase='done';v.r={d,mod,dc,ok,a:o.a};v.text=you(out.t);v.gain=applyOut(out,ok&&d===20,v.fate);evTwist(v,ok,d);if(ok)track('check');save();render()}},70)}
function evTwist(v,ok,d){const T=['atk','def','luck'],N={atk:'劍之紋',def:'盾之紋',luck:'星之紋'};
  if(d===20){const x=minG(rollGear(RUN.area,2));v.gain.push('大成功獎勵：'+gearName(x));RUN.loot.items.push(gearName(x))}
  if(ok&&!RUN.bless&&Math.random()<(v.fate?.5:.25)){RUN.bless=pick(T);v.gain.push(`✨ 旅途祝福：${N[RUN.bless]}（本趟生效）`);v.text+='<br><span class="sub">離開時，你感覺有股溫暖的力量跟著你。</span>'}
  if(!ok&&Math.random()<(v.fate?.55:.3)){v.amb=1;v.text+='<br><b style="color:var(--hp)">動靜驚動了附近的魔物，牠們朝你衝過來了！</b>'}}
function applyOut(o,crit,fate){const unit=12+AREAS[RUN.area].base*6,s=stats(),g=[],m=(crit?2:1)*(fate?2:1);
  if(o.gold){let v=Math.round(unit*o.gold*(o.gold>0?m:1));if(v<0)v=-Math.min(S.gold,-v);S.gold+=v;if(v>0)RUN.loot.gold+=v;g.push(`${v>0?'+':''}${v} G`)}
  if(o.hp){const v=Math.round(s.HP*o.hp*(o.hp<0&&fate?2:1));S.hp=Math.max(1,Math.min(s.HP,S.hp+v));g.push(`HP ${v>0?'+':''}${v}`)}
  if(o.mp){const v=Math.round(s.MP*o.mp);S.mp=Math.min(s.MP,S.mp+v);g.push(`MP +${v}`)}
  if(o.stone){addItem('stone',o.stone);g.push(`強化石×${o.stone}`)}
  if(o.item){addItem(o.item[0],o.item[1]);g.push(`${ITEMS[o.item[0]].n}×${o.item[1]}`)}
  if(o.loot){const x=rollGear(RUN.area,crit?2:1);g.push(gearName(x));RUN.loot.items.push(gearName(x))}
  if(o.exp){const v=Math.round(unit*o.exp*m);RUN.loot.exp+=v;g.push(`+${v} EXP`);gainExp(v)}
  return g}
function finish(done){const l=RUN.loot,a=AREAS[RUN.area];let extra='';
  if(done){const bonus=Math.round((12+a.base*6)*2);S.gold+=bonus;track('run');extra=`<p>完成獎勵：${bonus} G</p>`}
  RUN=null;B=null;save();TAB='adv';render();
  openM('msg',{t:done?'冒險完成':'撤退回城',b:`<div class="panel"><h3>${a.n}　結算</h3><p>金幣 ${l.gold} G　／　經驗 ${l.exp} EXP</p>${l.items.length?`<p>戰利品：${l.items.join('、')}</p>`:''}${extra}</div><button class="btn pri big" data-a="closeM">確定</button>`})}

/* ============ NPC 故事：狀態與流程 ============ */
function nstReqMet(q){const s=S.nst[q.id];if(!q.req)return true;if(!s)return false;
  return q.req.type==='kill'?s.prog>=q.req.c:(S.items[q.req.item]||0)>=q.req.c}
function nstProg(q){const s=S.nst[q.id]||{prog:0};return q.req.type==='kill'?Math.min(q.req.c,s.prog):Math.min(q.req.c,S.items[q.req.item]||0)}
function nstState(q){if(!S.nst)S.nst={};const s=S.nst[q.id];if(s&&s.done)return 'done';
  if(S.main.ch<q.ch||(q.pre&&!(S.nst[q.pre]||{}).done))return 'lock';
  if(!s)return 'new';return nstReqMet(q)?'ready':'prog'}
const nstFor=fac=>NST.filter(q=>q.fac===fac&&['new','ready'].includes(nstState(q)));
const nstDot=()=>NST.some(q=>['new','ready'].includes(nstState(q)));
function nstStart(id){const q=NST.find(x=>x.id===id);if(!q||nstState(q)!=='new')return;closeM();
  play(q.a,q.key,`${q.npc}的故事・${q.n}`,()=>{S.nst[id]={prog:0,done:false};if(!q.req)nstReward(q);else toast(`接下了「${q.n}」`);save();render()})}
function nstEnd(id){const q=NST.find(x=>x.id===id);if(!q||nstState(q)!=='ready')return;closeM();
  if(q.req&&q.req.type==='item')addItem(q.req.item,-q.req.c);
  play(q.b,q.key,`${q.npc}的故事・${q.n}`,()=>{nstReward(q);save();render()})}
function nstReward(q){S.nst[q.id]=Object.assign(S.nst[q.id]||{},{done:true});if(q.rw.flag)S.flags[q.rw.flag]=1;
  const t=give(q.rw);toast(`「${q.n}」完成：${t}`);sys(`${S.name} 完成了 ${q.npc} 的故事「${q.n}」`);
  if(q.rw.flag==='galeBack')toast('蓋爾可以成為同行夥伴了（角色頁切換）')}
function nstList(fac){const qs=NST.filter(q=>(!fac||q.fac===fac)&&nstState(q)!=='lock');
  return qs.map(q=>{const st=nstState(q);return `<div class="item"><span class="ico c4">${icon(NPC[q.npc]||'npc_boy','<b style="font-size:15px">'+q.npc[0]+'</b>')}</span><span class="grow"><b>${q.n}　<span class="sub">${q.npc}</span></b>
    <span class="sub">${st==='done'?'已完成':st==='new'?you('有話想對你說'):q.req?`${q.req.d}　<b>${nstProg(q)}/${q.req.c}</b>`:''}</span>${st!=='done'?`<span class="sub">獎勵：${rwText(q.rw)}</span>`:''}</span>
    ${st==='new'?`<button class="btn pri sm" data-a="nstStart" data-v="${q.id}">聽故事</button>`:st==='ready'?`<button class="btn pri sm" data-a="nstEnd" data-v="${q.id}">完成</button>`:st==='done'?`<button class="btn sm" data-a="nstReplay" data-v="${q.id}">回顧</button>`:'<span class="tag off">進行中</span>'}</div>`}).join('')}

    let d=base*100/(100+s.DEF*(1+buffSum('def')));if(B.guard)d*=.5;d=Math.max(1,Math.round(d));
    let ab=0;if(B.shield>0){ab=Math.min(B.shield,d);B.shield-=ab;d-=ab}
    S.hp=Math.max(0,S.hp-d);fx.d=(fx.d||0)+d;blog(`${f.name} 的攻擊造成 ${d} 傷害${ab?`（護盾吸收 ${ab}）`:''}`);

function loadCode(code){try{const [v,b,c]=code.trim().split('.');if(v!=='AO1')throw 0;const j=decodeURIComponent(escape(atob(b)));let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))|0;
  if((h>>>0).toString(36)!==c)throw 0;const o=JSON.parse(j);if(!o||!o.name||!o.cls)throw 0;return o}catch(e){return null}}

  {v:'8.0',d:'2026-11-20',t:'開服大改版',b:'① 全職業立繪、頭像、魔物重新繪製，造型統一。② 第七章「沉沒的檔案館」開放。③ 裝備增加到 116 件，進階職業有專屬武器。④ 每張地圖有自己的探索特性與專屬事件。⑤ 新增五位旅人，冒險途中可能遇見他們。'},
  {v:'7.8',d:'2026-11-20',t:'第七章「沉沒的檔案館」',b:'第二部第七章開放：潛入大教堂底下的王都地下書庫，找出遠征隊名冊的真相。新地區積水書庫（Lv.30–33）、四種新魔物與首領「檔案守門人」，各自有專屬掉落裝備。劇情插圖全面換成主角通常造型，所有裝備都有專屬圖示，隊友露娜與蓋爾在戰鬥中也有動作了。'},
  {v:'7.7',d:'2026-11-20',t:'每章探索不同',b:'每張地圖有自己的地區特性：草原順風寶箱多、森林迷霧遮住岔路、礦坑會落石、雪山酷寒扣 HP、要塞霧蝕魔物更多、灰石街道盜賊橫行、地下書庫積水扣 MP。每張地圖也有 4 個專屬探索事件，會優先出現，例如走散的羊群、停住的蝴蝶、礦坑深處的歌聲、山頂的極光、跪著的黑騎士、廢棄驛站的帳本。灰石街道的三種魔物也有了專屬掉落裝備。'},
  {v:'7.6',d:'2026-11-20',t:'裝備擴充',b:'裝備從 70 件增加到 116 件。8 個進階職業各有兩把專屬武器（Lv.20、Lv.26），附帶職業特色效果；頭、身、腳、戒指、項鍊每一階多一條路線，例如法冠、輕甲、重靴、力量戒、智者項鍊，同一階可以依職業和打法挑選。'},
  {v:'7.5',d:'2026-11-20',t:'美術全面翻新',b:'12 個職業男女全部動作圖與站姿依統一規格重繪：武器、服裝固定，比例與角度一致。10 種新魔物與 5 位區域領主換上正式立繪，魔物專屬裝備也有了專屬圖示。'},
  {v:'7.4',d:'2026-11-19',t:'區域領主',b:'每張地圖新增一位區域領主：巨角兔王、月牙狼王、白骨礦工頭、冰川巨人王、黑霧將軍。岔路上出現「👹 領主巢穴」時才會遇到，首領級強度，每位固定掉落一種寶石（黃玉、月石、紅玉、翠玉、藍玉），也有機會掉裝備。'},
  {v:'7.3',d:'2026-11-19',t:'首領寶石分類',b:'每位首領固定掉一種寶石：哥布林戰酋＝紅玉（攻擊）、腐根樹王＝翠玉（HP）、鑽岩巨蟲＝黃玉（爆擊）、凜冬霜龍＝月石（迴避）、黑霧大術士澤諾斯＝藍玉（魔力）；第二部首領隨機掉落五種之一。點首領圖像可查看。'},
  {v:'7.2',d:'2026-11-19',t:'寶石改為首領限定',b:'鑲嵌寶石改為只有首領會掉落：主線首領必掉 1 顆、惡夢首領有機會 2 顆、無盡之塔首領 30%。合成、分解、異變種、惡夢小怪不再產出寶石。已持有與已鑲嵌的寶石全部回收，每顆補償 120 G。'},
  {v:'7.1',d:'2026-11-19',t:'掛機時也能冒險',b:'背景掛機期間可以照常出發冒險、挑戰無盡之塔、開全自動，掛機收益會繼續累積，不用再先結束掛機。'},
  {v:'7.0',d:'2026-11-19',t:'裂甲擊破甲、新站姿立繪',b:'劍士的「裂甲擊」現在會劈開護甲，無視物理抗性（史萊姆、幽靈這類不怕刀砍的魔物，改用裂甲擊就能打出正常傷害，命中時跳出「裂甲！」）。角色頁裝備欄的站姿立繪全部 12 職業男女到齊；劍士全套戰鬥圖換成新版。'},
  {v:'6.9',d:'2026-11-19',t:'魔物專屬裝備',b:'10 種新魔物各有一件史詩級專屬裝備，帶有獨特效果：毒沼凝晶戒、雷角疾靴、噬魂菇冠、幽影狼皮甲、熔岩蝠翼墜、水晶核心、暴雪狼牙鍊、雪暴精靈之冠、血誓戰靴、虛無幽魂斗篷。一般 4%、精英 12%、寶藏魔物 30%、徘徊強敵 50% 掉落；點魔物圖像可看牠掉什麼。'},
  {v:'6.8',d:'2026-11-19',t:'新魔物與稀有遭遇',b:'每張地圖新增 2 種魔物（毒沼史萊姆、雷角野兔、噬魂紫菇、幽影狼、熔岩蝙蝠、水晶魔像、暴雪狼、雪暴精靈、血誓騎士、虛無幽魂），各有不同技能與弱點。冒險中可能遇到閃閃發亮的「寶藏魔物」（3 回合內打倒才拿得到大量金幣與裝備）和危險的「徘徊強敵」（強大但掉落豐厚）。'},
  {v:'6.7',d:'2026-11-19',t:'裝備隨機性提升',b:'新掉落的裝備多了「品質」：主屬性在 85%～125% 之間隨機，3% 機率出現 130%～140% 的【完美】裝備；附加詞條數值浮動加大（70%～130%）；稀有以上有 20% 機率多一條詞條。同名同稀有度的裝備也會有明顯差異，值得多刷幾件挑最好的。'},
  {v:'6.6',d:'2026-11-19',t:'裝備封印',b:'比主線進度更遠的地區裝備會暫時「封印」：屬性依超前的階數降低，稀有詞綴與首領專屬效果暫時無效。裝備不會消失，推進主線到該地區就自動完全解除。已經在無盡之塔拿到高階裝備的冒險者也適用。之前因為在塔裡打倒首領而被誤標「已通關」的地區會自動恢復成正確的主線進度。'},
  {v:'6.5',d:'2026-11-19',t:'無盡之塔掉落調整',b:'無盡之塔掉落的裝備階級不再超過主線進度；塔內首領改為掉 1 件精良以上裝備（原本 2 件稀有以上），一般魔物掉落率降低；首領專屬傳說要先在主線擊敗該首領才會在塔裡掉落，機率 3%。超出主線進度的樓層改為有機會掉強化石。修正在塔裡打倒首領會被誤算成主線通關的問題。'},
  {v:'6.4',d:'2026-11-19',t:'裝備平衡',b:'前期裝備主屬性提升（第 1 階 +40%、第 2 階 +20%），普通與精良在前期更有用；附加詞條的數值浮動變小，比較不會抽到很爛的詞條；稀有詞綴的效果改為依裝備階級成長（第 1 階 50%，第 6 階滿值），避免低階傳說一件打天下。爆擊與爆傷詞條維持不變。'},
  {v:'6.3',d:'2026-11-19',t:'背包篩選升級',b:'裝備頁可以依部位（武器、頭盔、鎧甲、鞋子、戒指、項鍊）、稀有度（精良以上～傳說）篩選，並可只看「▲更強」、套裝、詞綴／閃耀／專屬裝備；排序可選戰力、稀有度、等級、最新。設定會記住。'},
  {v:'6.2',d:'2026-11-19',t:'懸賞情報＋新圖',b:'旅行商人開始兜售「懸賞情報」：花一筆金幣，下一場普通戰鬥就會遇上守寶的精英魔物——更危險，但打倒必掉裝備、金幣 ×2。要不要賭，看你的血量和藥水。神射手、聖殿騎士（女）、主教共 5 張動作圖重畫上線（弓弦、握杖修正、拿掉多餘特效）。'},
  {v:'6.1',d:'2026-11-19',t:'一鍵販售',b:'背包裝備頁新增「一鍵販售普通、精良」與「一鍵販售稀有以下」，鎖定、裝備中、閃耀與帶稀有詞綴的裝備都會保留。'},
  {v:'6.0',d:'2026-11-19',t:'裝備改名',b:'首領專屬裝備改成符合新首領名稱：戰酋黑晶護符、腐根樹王之心、鑽岩巨顎、凜冬龍鱗鎧、黑霧魔冠。其他不合理的名稱也一併修正：雷霆權杖、霜風長弓、天使聖錘、雷步戰靴、祭司短槌、祈禱戰錘、黑狼牙項鍊、岩晶墜飾、岩晶戒、橡木指環、黑狼之牙。已持有的裝備會自動顯示新名稱。'},
  {v:'5.9',d:'2026-11-19',t:'狀態實體特效',b:'中毒會冒出綠色毒泡、燃燒會有火焰與火星往上竄、流血會滴落在地上、冰凍會被冰殼包住、暈眩頭上轉星星、弱化往下沉的紫色箭頭、再生飄綠色十字，角色身上也會泛出對應顏色的光。怪物情報裡的印記改成圖示。'},
  {v:'5.8',d:'2026-11-19',t:'戰鬥畫面精簡',b:'怪物資訊框只留名稱、血條與下回合預告；點怪物圖像或資訊框就能看完整數值（攻防、弱點、韌性爆抗、狀態），查看時戰鬥自動暫停，關閉後繼續。'},
  {v:'5.7',d:'2026-11-19',t:'怪物韌性與爆抗',b:'爆擊率與爆擊傷害維持原本的強度；改為讓怪物擁有「韌性」（降低你的爆擊率）與「爆抗」（降低爆擊額外傷害），越後面的地圖、精英、首領、惡夢與強敵化的魔物越高，戰鬥畫面可以看到數值。'},
  {v:'5.6',d:'2026-11-19',t:'排行榜可看玩家裝備',b:'點排行榜上的玩家，就能看到他的角色立繪、六個部位的裝備與能力值。修正重新整理後會被當成新玩家的問題。'},
  {v:'5.5',d:'2026-11-19',t:'線上戰力排行榜',b:'排行榜開始連線真實玩家：遊戲每 5 分鐘自動上傳你的戰力，榜上標「玩家」的都是真人。伺服器暫時連不上時，會自動改回顯示 NPC 與好友戰力碼。'},
  {v:'5.4',d:'2026-11-19',t:'強敵化',b:'裝備太強、可以一招秒殺魔物時，魔物會「強敵化」：血量與攻擊依你的實力提升，同時給更多經驗與金幣。前期與正常裝備時不受影響。'},
  {v:'5.3',d:'2026-11-19',t:'露娜的職業：燈術士',b:'露娜有了自己的職業【燈術士】與技能：燈火彈、蒼焰、照路之光（治療）、守燈結界（看到敵人大招替你擋 40%）、霧散之光（削弱敵人）、奧義誓約之燈（每場一次）。技能隨章節與羈絆解鎖，角色頁可查看。戰鬥畫面中露娜站到主角身後、尺寸放大，出招時會喊招式名並有專屬特效。'},
  {v:'5.2',d:'2026-11-19',t:'人物會說話了＋好友戰力榜',b:'露娜、主角和鎮上的人更像真人：戰鬥中會即時對話（開戰、首領、爆擊、危急、完美防禦、勝利），營火時和露娜聊天、隨章節慢慢聊開她的過去，岔路前也會閒聊；鎮上 NPC 的招呼會依劇情進度、時間和你的狀態改變。排行榜可以用「戰力碼」加入真實好友一起比。'},
  {v:'5.1',d:'2026-11-19',t:'自動收益調整',b:'全自動冒險與背景掛機的收益減半：全自動戰鬥的經驗、金幣與一般裝備掉落減半（首領與寶物守衛不受影響）；背景掛機的經驗、金幣、裝備與素材減半。手動遊玩收益不變。'},
  {v:'5.0',d:'2026-11-19',t:'更新廣播',b:'遊戲更新後，畫面上方會出現跑馬燈系統廣播告訴你更新了什麼；遊玩中有新版本推出時，也會即時廣播並提供「立即更新」按鈕。'},
  {v:'4.9',d:'2026-11-19',t:'背景掛機＋人物裝備欄',b:'冒險頁新增「背景掛機」：選地圖後角色自動打怪，關掉遊戲也會累積（最多 12 小時），隨時結束並看結算畫面。角色與背包的裝備改成人物立繪兩側分部位擺放，點部位就能看裝備詳細資料。'},
  {v:'4.8',d:'2026-11-19',t:'斬殺線：看準時機收尾',b:'敵人血量掉到一擊就能收掉時，敵方狀態列會亮出「🗡 普攻可斬殺」或「🗡 技能可斬殺」，提醒你這回合不必再架刀防守，直接出手結束戰鬥（多隻敵人同時在場時不顯示）。自動戰鬥也學會了：能一擊收掉就用最省 MP 的招式直接斬殺；對方攻擊不痛、下回合就能打完時，不再浪費回合招架。實測全自動劍士防守回合從約 45% 降到約 27%。'},
  {v:'4.7',d:'2026-11-19',t:'全自動放慢＋命運骰子',b:'全自動速度放慢一半，方便觀戰；遇到岔路、事件或劇情抉擇時再放慢，並擲出命運骰子：1～3 走左邊、4～6 走右邊。'},
  {v:'4.6',d:'2026-11-19',t:'特效定位修正',b:'技能特效改成依照角色與魔物的實際位置與大小定位：魔法陣、冰晶、火柱、震地、藤蔓都落在腳下影子處，命中光效在身體中心，首領、飛行魔物、小型魔物都對得準。'},
  {v:'4.5',d:'2026-11-19',t:'魔物改名',b:'魔物與首領名稱重新整理，更有魄力也更合理：尖角野兔、哥布林掠奪者、哥布林戰酋、瘴氣毒菇、黑森狼、枯藤樹精、腐根樹王、吸血蝙蝠、亡骸礦工、礦脈岩魔像、鑽岩巨蟲、霜牙雪狼、凍晶妖精、冰川巨人、凜冬霜龍、墮落黑騎士、怨靈魅影、煉獄魔衛、黑霧大術士澤諾斯。'},
  {v:'4.4',d:'2026-11-19',t:'首領寶物堆：三箱選一',b:'討伐首領後，戰利品旁會多出一堆寶物，但只能帶走一箱：👑 金冠寶箱（穩拿大把金幣＋強化石）、💠 蒼紋寶箱（一件稀有以上裝備，25% 升為史詩）、⛓️ 封印寶箱（35% 史詩裝備、可能帶職業套裝，否則落空）。缺錢、缺裝還是賭一把，由你決定。另外法師前期火力稍微收斂：點火 160%→140%、霜針 160%→150%（原本每場不到 3 回合，比其他職業快一倍）。'},
  {v:'4.3',d:'2026-11-19',t:'劍士手感調整：更重的普攻與鬥志',b:'劍士原本打一隻怪要 11 回合以上、MP 很快見底只能乾砍。現在劍士普攻威力 +15%，命中時燃起「鬥志」回復 5% MP；裂甲擊 140%→155%。普攻疊破綻、攢 MP，裂甲擊一口氣疊兩層，再找時機十字裂斬清算——節奏比以前更有來回。實測劍士每場戰鬥回合數約減半，與神官相近。'},
  {v:'4.2',d:'2026-11-19',t:'物理特效與實體印記',b:'命中時火花、碎石、冰片、水滴、火星與煙塵會受重力落下、在地面彈跳、浮起飄散；被擊中的角色會像彈簧一樣晃回原位。法師等職業的印記不再只是文字：會變成環繞敵人的發光符印（灼焰、冰晶、蝕魂、奧術、星），引爆時被吸進敵人體內炸開。'},
  {v:'4.1',d:'2026-11-19',t:'稀有詞綴：裝備會觸發特殊效果',b:'藍色、紫色裝備現在有 6% 機率帶「稀有詞綴」，掉落時會跳出戰利品卡片。新增四種觸發型詞綴（傳說裝備也會出現）：⚔ 背水（HP 低於 35% 傷害 +30%）、🌵 荊棘（被打中反彈 25% 傷害）、🍃 疾風（每場第一下必中必爆擊）、🌾 收割（每擊倒一個敵人回 10% HP／MP）。背水要冒險壓血、荊棘適合硬吃傷害的打法——要穿哪件，看你怎麼打。'},
  {v:'4.0',d:'2026-11-19',t:'回血怪不再無限再生',b:'史萊姆、樹精、骷髏這類會回血的怪，每用一次回復量只剩上次的 60%，而且用完要隔兩回合才能再用，不會再卡在打不死的長戰。灼燒中的敵人回復量減半：行動預告會顯示這次大約回多少，看到它要回血，先點火再打。自動戰鬥也會在敵人準備回血時優先用灼燒招。'},
  {v:'3.9',d:'2026-11-19',t:'首領前哨：戰前準備三選一',b:'在首領前哨可以先做一項戰前準備，但只能選一個：🔭 偵察動向（花金幣，首領開場 HP -12%）、🪤 布置陷阱（拿一瓶治療藥水當誘餌，首領開場中毒 4 回合、攻擊下降）、🔥 營火調息（免費回 30% HP／MP，但火光會驚動首領，攻擊 +12%）。錢、藥水、血量，看你缺哪個再決定。全自動也會依狀態挑一項。'},
  {v:'3.8',d:'2026-11-19',t:'首領前哨＋自動戰鬥會用毒和火',b:'走到首領前會先停在「首領前哨」：顯示首領等級、你的 HP／MP／藥水和勝算，要硬闖還是帶著戰利品撤退由你決定。全自動在等級差太多或狀態太差時會先撤退練功，不再一直衝去送死掉金幣。自動戰鬥會把中毒、灼燒、虛弱、暈眩的價值算進去：遊俠會用蛇牙箭、法師更常點火，對付厚血的敵人更有效率。'},
  {v:'3.7',d:'2026-11-19',t:'遊俠專注增傷＋自動戰鬥會看預告',b:'遊俠的專注現在每層讓攻擊 +6%，「屏息」提前到 Lv.5 就能學，雙矢每箭 90%→100%：攢專注變強、什麼時候一箭打光要自己拿捏。自動戰鬥變聰明了：看到敵人下回合要出傷害招，劍士會先架招架反擊、法師會先開薄冰鏡；打首領和精英時會先上增益（伏身、晨禱、鬥氣解放）。冒險地點卡片新增提醒：首領已現身但你等級還不夠時，會先告訴你終點會碰上它。'},
  {v:'3.6',d:'2026-11-19',t:'開局兩招＋閃耀裝備',b:'四職業 Lv.1 就有兩招可選：劍士多了招架反擊、法師多了霜針、遊俠多了蛇牙箭、神官多了審光；原本 Lv.5 的招式提前到 Lv.3。劍士的破綻現在每層讓攻擊 +6%，疊越多越痛。新增 5% 機率掉落「✧閃耀」裝備：多一條詞條、最強詞條 ×1.5，洗練也不會消失。撿到史詩、傳說或閃耀裝備時，勝利畫面會跳出發光的戰利品卡片。'},
  {v:'3.5',d:'2026-11-19',t:'路線與事件改版',b:'岔路會標出危險度，還可能出現特殊標記：💎寶物守衛、💰懸賞、☠詛咒之地、👑大寶箱（小心寶箱怪）、💧靈泉、🎲命運之地。事件選項直接顯示成功率；成功有機會獲得本趟祝福，失敗可能驚動魔物開戰，大成功必掉裝備。同一趟不會遇到重複事件。'},
  {v:'3.4',d:'2026-11-18',t:'敵人行動預告',b:'所有怪物都會在頭上顯示下回合要做什麼。看到紅色⚠大招時按防禦：傷害只剩 25%，還會看穿破綻，下次攻擊 +50%。'},
  {v:'3.3',d:'2026-11-18',t:'特效打磨＋怪物招式改名',b:'特效改成有過程的動畫：聚氣、出招、命中、收尾，魔法陣逐筆畫出、光柱由天劈落、護盾張開再碎裂。施放時角色會衝刺或發光。怪物 57 招都照招式名稱重新設計，並把不順的招式名稱改得更自然。'},
  {v:'3.2',d:'2026-11-18',t:'特效全面重做',b:'改成線上遊戲風格的發光特效：月牙刀光、彗星拖尾、光柱、魔法陣、雷擊、冰晶、火焰。命中時角色閃白、火花爆散、傷害數字彈跳，爆擊更有感。'},
  {v:'3.1',d:'2026-11-18',t:'技能特效重做',b:'移除科幻感的粒子特效，主角 53 招與怪物 57 招全部改成描邊手繪風、照招式名稱設計的動畫：斬擊弧光、火球、冰錐、落雷、光柱、巨鎚、天秤、捕獸夾、咬合、毒霧、藤蔓纏繞等。'},
  {v:'3.0',d:'2026-11-18',t:'全新畫風',b:'全遊戲美術換成新畫風：主角 12 職業男女全部動作、每個技能專屬姿勢、所有怪物、立繪、背景、事件、劇情圖、圖示全面重畫；新增手繪戰鬥特效。'},
  {v:'2.9.1',d:'2026-11-18',t:'BOSS 戰調整',b:'取消對 BOSS 的每回合傷害上限（原本 12%，惡夢 10%），打多少算多少。'},
  {v:'2.9',d:'2026-11-18',t:'設定更新',b:'「全自動」按鈕改成進入關卡後才出現。設定新增「畫面震動＋手機震動」開關，可以關掉。'},
  {v:'2.8',d:'2026-11-17',t:'全自動冒險',b:'右下角新增「全自動」按鈕：自動隨機選路、自動處理事件與祭壇、自動戰鬥；冒險結束會回城休息再出發同一地區。戰敗或金幣不夠休息時自動停止，再按一次即可關閉。'},
  {v:'2.7',d:'2026-11-17',t:'地區音樂與載入改善',b:'每個地區都有自己的探索音樂：草原、迷霧森林、廢棄礦坑、霜雪山脈、黑霧要塞、灰石街道、無盡之塔。圖片載入失敗會自動重試三次。特效改成較柔和的手繪風格。'},
  {v:'2.6',d:'2026-11-17',t:'怪物招式特效',b:'所有怪物招式都換上專屬特效：落石會真的砸下碎石、冰錐是冰柱、催眠粉會飄星星、落雷校正是一道巨雷劈下……招式名稱和畫面一致。'},
  {v:'2.5',d:'2026-11-17',t:'屬性弱點',b:'每種魔物都有弱點屬性（傷害 ×1.5）與抗性屬性（×0.6），打中弱點會跳出「弱點！」。點戰鬥中的怪物名稱可查看弱點、招牌技能與詞綴；圖鑑也會標示。自動戰鬥會優先使用打得到弱點的技能。'},
  {v:'2.4',d:'2026-11-17',t:'戰鬥演出強化',b:'主角每個技能都有專屬動作（陸續上線）。受傷、倒地改在命中瞬間才出現。新增打擊頓幀、擊退、震屏、會彈跳的碎石與塵土，箭矢改為拋物線飛行。'},
  {v:'2.3',d:'2026-11-17',t:'首領蓄力技',b:'首領會每隔幾回合蓄力，下一回合放出無法閃避的【毀滅一擊】。看到蓄力提示就先防禦，傷害會降到四分之一。'},
  {v:'2.2',d:'2026-11-17',t:'物理／魔法傷害區分',b:'魔物新增魔法抗性：魔力造成的傷害看魔抗，攻擊造成的傷害看防禦。防禦型怕魔法、魔法型怕物理，圖鑑會標示弱點。'},
  {v:'2.1',d:'2026-11-17',t:'首領戰調整',b:'首領新增「首領護甲」：每回合受到的傷害最多為最大 HP 的 12%（惡夢 10%）。首領 HP 降到一半時會進入狂怒，獲得護盾並提升攻擊。裝備練起來後，首領戰不會再三下結束。'},
  {v:'2.0',d:'2026-11-17',t:'第二部「霧之彼岸」開幕',b:'第六章「王都的回信」上線！新地區灰石街道（Lv.26–30）、四種新魔物與首領「失控的氣象機兵」、第 6 階裝備、雷鳴套裝、新角色王都使者希瑟。完成第一部的冒險者可直接在任務頁接受第六章。'},
  {v:'1.5',d:'2026-11-17',t:'屬性改版',b:'副屬性變得有用：敏捷增加連擊、智力讓技能省 MP、體質增加每回合回血、幸運提高爆擊傷害、掉寶率與金幣。新增屬性重置（Lv.10 以前免費）。NPC 全面換上新的表情立繪。'},
  {v:'1.4',d:'2026-11-17',t:'整體平衡調整',b:'升級節奏放慢，主線各章需要等級門檻。強化成本與成功率重新設計，傳說裝備更稀有。首領強度依地區遞增，戰鬥超過 20 回合敵人會開始力竭。各職業傷害重新校正。'},
  {v:'1.3',d:'2026-11-16',t:'主線改版「北方大道」',b:'主線劇情全面改寫，黑霧的真相留給第二部。人物故事同步更新。新增冒險圖鑑、成就與稱號、合成工坊、無盡之塔、新手引導與存檔備份。'},
  {v:'1.2',d:'2026-11-16',t:'夥伴與多對一戰鬥',b:'露娜加入戰鬥，蓋爾在人物故事後可以入隊。第三區之後會同時遇到多隻魔物，冒險路線改為岔路選擇。'},
  {v:'1.1',d:'2026-11-16',t:'刷寶改版',b:'移除星鑽與抽裝備，所有裝備都靠冒險取得。新增 8-bit 音效與背景音樂。'}];

  {id:'fest1',n:'霧散祭',start:'2026-11-17',end:'2026-12-08',img:'banner_fest1',
   d:'慶祝北方大道重新開通！活動期間所有戰鬥經驗 +20%，並會掉落「霧散祭徽章」，可以在活動商店兌換好禮。',
   exp:1.2,tok:{id:'tok',p:.5,boss:5},

const LIVE=[];/* 活動上線時把 LIVE_DRAFT 的項目搬進來 */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const liveNow=()=>LIVE.filter(e=>today()>=e.start&&today()<=e.end);
const liveSoon=()=>LIVE.filter(e=>today()<e.start);
const liveExp=()=>liveNow().reduce((a,e)=>a*(e.exp||1),1);
function liveDrop(bs){const got=[];for(const e of liveNow())if(e.tok){const n=bs?e.tok.boss:Math.random()<e.tok.p?1:0;if(n){addItem(e.tok.id,n);got.push(`${ITEMS[e.tok.id].n}×${n}`)}}return got}
const newsDot=()=>S&&S.newsSeen!==NEWS[0].v;
function vNews(){S.newsSeen=NEWS[0].v;save();const L=[...liveNow(),...liveSoon()];
  return{t:'公告與活動',b:(L.length?`<h3>活動</h3>`+L.map(e=>{const on=liveNow().includes(e);return `<div class="panel">${art(e.img,e.n)}<div class="row"><h3 class="grow">${e.n}</h3><span class="tag ${on?'red':'off'}">${on?'進行中':'即將開始'}</span></div><p class="sub">${e.start} ～ ${e.end}</p><p>${e.d}</p>${on&&e.shop?`<button class="btn pri" data-a="openM" data-v="lshop" data-x="${e.id}">活動商店（持有 ${S.items[e.tok.id]||0}）</button>`:''}</div>`}).join(''):'')+
    `<h3>更新公告</h3>`+NEWS.map(n=>`<div class="gsec"><b>v${n.v}　${n.t}</b><span class="sub">${n.d}</span><span class="subl">${n.b}</span></div>`).join('')}}
function vLShop(){const e=liveNow().find(x=>x.shop);if(!e)return{t:'活動商店',b:'<p class="empty">目前沒有進行中的活動</p>'};if(!S.lbuy)S.lbuy={};const tk=e.tok.id;
  return{t:`${e.n}・活動商店`,b:`<p class="sub">持有 ${ITEMS[tk].n}：<b>${S.items[tk]||0}</b>　活動結束後徽章會保留，但商店會關閉。</p><div class="list">${e.shop.map((x,i)=>{const used=S.lbuy[e.id+':'+i]||0,ok=(S.items[tk]||0)>=x.c&&used<x.lim;
    return `<div class="item"><span class="ico c${ITEMS[x.k].gem?3:1}">${icon('item_'+x.k,ic(ITEMS[x.k].gem?'mat':'potion'))}</span><span class="grow"><b>${ITEMS[x.k].n}×${x.n}</b><span class="sub">徽章 ${x.c}・剩餘 ${x.lim-used}/${x.lim}</span></span><button class="btn sm ${ok?'pri':''}" data-a="lbuy" data-v="${i}" ${ok?'':'disabled'}>兌換</button></div>`}).join('')}</div>`}}

/* ============ 戰鬥 ============ */
function mkFoe(id,kind){const m=MOBS[id],bs=!!m.boss,el=kind==='elite',nm=!!(RUN&&RUN.nm);
  const mut=!bs&&!nm&&S.main.ch>=1&&Math.random()<.1;
  const L=(RUN&&RUN.tower?RUN.tlv:m.lv)+(nm?10:0)+(mut?3:0);
  const mult=(bs?(RUN&&!RUN.tower?1.05+RUN.area*.05:1.25):el?1.12:1)*(nm?1.35:1)*(mut?1.45:1),kh=(bs?(RUN&&!RUN.tower?3.3+RUN.area*.6:4.5):el?1.8:1)*(nm?1.6:1)*(mut?2.2:1);
  const st=mobBuild(m,L,mult,kh);
  const BMOD={goblinboss:'scout',zenos:'galeAlly'},bm=bs&&!nm&&S.flags[BMOD[id]]&&S.main.ch===RUN.area;if(bm)st.HP=Math.round(st.HP*.8);
  const aff=[];if(mut||nm){const ks=Object.keys(AFF).sort(()=>Math.random()-.5);aff.push(...ks.slice(0,bs&&nm?2:1))}
  if(aff.includes('rage'))st.ATK=Math.round(st.ATK*1.4),st.MAG=Math.round(st.MAG*1.4);if(aff.includes('shell'))st.DEF=Math.round(st.DEF*1.8),st.MRES=Math.round(st.MRES*1.8);if(aff.includes('swift'))st.EVA+=15,st.CRIT+=15;
  const pre=(nm?'惡夢・':'')+(mut?'蝕化・':'')+(el?'精英':'');
  const bdm=bs?(RUN&&!RUN.tower?1.7+RUN.area*.15:1.4):1;
  return{id,m,L,a:st.a,kind:bs?'boss':kind,mut,nm,aff,name:pre+m.n,hp:st.HP,max:st.HP,atk:Math.round(st.ATK*bdm),mag:Math.round(st.MAG*bdm),def:st.DEF,mres:st.MRES,crit:st.CRIT,eva:st.EVA,fb:[],fshield:0,st:{},rage:0,bm}}
/* 依玩家實力調整魔物：只在玩家太強、會一擊秒殺時才加強，前期不受影響 */
function hitEst(def){const s=stats(),P=Math.max(s.ATK,s.MAG),best=Math.max(1,...mySkills().map(k=>{const d=SK[k].dmg;return d?d.p*(d.h||1):0})),cr=1+Math.min(1,s.CRIT/100)*Math.max(0,s.CD/100-1);return clsDm()*P*best*100/(100+def)*cr}
function rareFoe(){const r=Math.random();
  if(r<.04){B.treasure=1;B.name='黃金'+B.m.n;B.hp=B.max=Math.round(B.max*1.5);B.def=Math.round(B.def*1.5);B.gmul=(B.gmul||1)*6;B.xmul=(B.xmul||1)*2;B.hoard=1;B.log.push('✨ 閃閃發亮的寶藏魔物！牠 3 回合後就會逃走，快打倒牠！')}
  else if(r<.07){B.wander=1;B.kind='elite';B.name='【徘徊強敵】'+B.m.n;B.hp=B.max=Math.round(B.max*2.6);B.atk=Math.round(B.atk*1.45);B.mag=Math.round(B.mag*1.45);B.gmul=(B.gmul||1)*2.5;B.xmul=(B.xmul||1)*2.5;B.hoard=1;B.log.push('⚠ 一股危險的氣息逼近……這不是普通的魔物！');setTimeout(()=>{try{talk('boss',1)}catch(e){}},1400)}}
function scaleFoe(){if(!B||B.id==='shadow')return;{const ar=RUN?RUN.area:0,bs=B.kind==='boss',el=B.kind==='elite';B.tough=Math.round(ar*4+(el?8:0)+(bs?15:0)+(RUN&&RUN.nm?10:0));B.cdr=Math.min(.6,.05+ar*.06+(el?.1:0)+(bs?.15:0)+(RUN&&RUN.nm?.1:0))}const mul=B.kind==='boss'?7:B.kind==='elite'?3.5:2.2,fl=hitEst(B.def)*mul,m=fl/B.max;
  if(m>1.25&&S.lv>=8){const k=Math.min(6,m);B.hp=B.max=Math.round(B.max*k);const a=Math.min(1.5,1+(k-1)*.3);B.atk=Math.round(B.atk*a);B.mag=Math.round(B.mag*a);B.xmul=(B.xmul||1)*Math.min(1.6,1+(k-1)*.25);B.gmul=(B.gmul||1)*Math.min(1.6,1+(k-1)*.25);B.str=1;B.tough+=10;B.cdr=Math.min(.7,B.cdr+.1);B.log.push('⚡ 牠感受到你的力量，變得更加凶猛！（強敵化：經驗與金幣增加）')}
  (B.adds||[]).forEach(f=>{const fl2=hitEst(f.def)*1.6;if(S.lv>=8&&fl2>f.max*1.25){const k=Math.min(5,fl2/f.max);f.hp=f.max=Math.round(f.max*k);f.atk=Math.round(f.atk*Math.min(1.4,1+(k-1)*.25))}})}
function startBattle(id,kind,nAdds){const F=mkFoe(id,kind),m=F.m,bs=F.kind==='boss';try{preload(['','_atk','_hurt','_low','_lose'].map(x=>'mob_'+id+x))}catch(e){}
  const pool=RUN?AREAS[RUN.area].mobs:[id],adds=[];for(let i=0;i<(nAdds||0);i++){const f=mkFoe(pick(pool),'');f.hp=f.max=Math.round(f.max*.75);adds.push(f)}
  preload([...['','_hurt','_low','_win','_lose','_atk','_skill','_cast'].map(x=>HK()+x),...(id==='shadow'?[]:['','_hurt','_low','_win','_lose'].map(x=>'mob_'+id+x)),...adds.map(f=>'mob_'+f.id),'battle_'+(AREAS.find(a=>a.boss===id||a.mobs.includes(id))||{id:'plain'}).id]);
  allyAuto();const ally=id==='shadow'?null:mkAlly();if(ally)ally.hp=ally.max;
  B=Object.assign({cls:{brk:0,marks:[],focus:0,faith:0},counter:0,endure:0,adds,ally,taunt:0,
     buffs:[],shield:0,pst:{poison:0,regen:0,burn:0,bleed:0,weak:0,stun:0},guard:false,
     log:[bs?`首領 ${m.n} 擋住了去路！`:F.mut?`被蝕霧侵蝕的 ${m.n} 出現了！氣息完全不同……`:adds.length?`${F.name} 帶著 ${adds.map(f=>f.name).join('、')} 出現了！`:`${F.name} 出現了！`,...(F.aff.length?[`詞綴：${F.aff.map(x=>AFF[x].n).join('、')}`]:[]),...(F.bm?[id==='zenos'?'蓋爾從側面牽制住了澤諾斯！':'你事先摸清了牠的弱點！']:[]),...(ally?[`${ally.n}與你並肩作戰`]:[])],busy:false,auto:AUTO,menu:'main',turn:1,fx:null,intro:true,shown:0,last:0},F);SFX.enc();

  addPt(v){if(S.pts<1)return;S.pts--;S.attr[v]++;save();render()},
  respec(){const c=respecCost();if(S.gold<c){toast(`需要 ${c} G`);return}const fr=freePts();if(fr<1){toast('目前沒有分配過的點數');return}if(!confirmTap('respec'))return;S.gold-=c;S.attr=baseAttr();S.pts+=fr;clamp();toast(`已重置，退回 ${fr} 點`);save();render()},
  skUp(v){if(S.sp<1||(S.skl[v]||1)>=5)return;S.sp--;S.skl[v]=(S.skl[v]||1)+1;toast(`【${SK[v].n}】提升到 Lv.${S.skl[v]}`);save();render()},
  bagTab(v){BAGTAB=v;render()},gearF(v){BAGF=v;render()},gearR(v){S.bagf.r=+v;render()},gearS(v){S.bagf.sort=v;render()},gearT(v){S.bagf[v]=S.bagf[v]?0:1;render()},qTab(v){QTAB=v;render()},
  useItem(k){if(RUN&&B)return;const it=ITEMS[k],s=stats();if(it.use.hp&&S.hp>=s.HP||it.use.mp&&S.mp>=s.MP){toast('已經是滿的');return}
    addItem(k,-1);if(it.use.hp)S.hp=Math.min(s.HP,S.hp+it.use.hp);if(it.use.mp)S.mp=Math.min(s.MP,S.mp+it.use.mp);save();render()},
  sellItem(k){addItem(k,-1);S.gold+=sellPrice(k);save();render()},
  equip(u){const g=gearBy(+u);S.eq[GEAR[g.id].slot]=g.u;toast(`裝備了 ${gearName(g)}`);save();closeM();render()},
  unequip(sl){S.eq[sl]=null;save();closeM();render()},
  sellAll(v){const mx=+v||1,eqd=Object.values(S.eq),L=S.gear.filter(g=>g.r<=mx&&!g.lock&&!eqd.includes(g.u)&&!g.sh&&!g.sp);if(!L.length){toast('沒有可販售的裝備');return}const sum=L.reduce((a,g)=>a+gearSell(g),0);if(!confirm(`販售 ${L.length} 件${mx>=2?'稀有以下':'普通、精良'}裝備，共 ${sum} G？（閃耀與稀有詞綴裝備會保留）`))return;const ids=new Set(L.map(g=>g.u));S.gear=S.gear.filter(g=>!ids.has(g.u));S.gold+=sum;toast(`販售 ${L.length} 件，獲得 ${sum} G`);save();render()},
  sellGear(u){const g=gearBy(+u);S.gold+=gearSell(g);S.gear=S.gear.filter(x=>x.u!==g.u);toast(`出售獲得 ${gearSell(g)} G`);save();closeM();render()},
  buyItem(k){if(S.gold<ITEMS[k].price)return;S.gold-=ITEMS[k].price;addItem(k,1);save();render()},
  buyGear(id){if(S.gold<GEAR[id].price)return;S.gold-=GEAR[id].price;addGear(id,0);toast(`購買了 ${GEAR[id].n}，已放入背包`);save();render()},
  enh(u){const g=gearBy(+u);if(!canEnh(g))return;S.gold-=enhCost(g);addItem('stone',-enhStone(g));track('enh');
    if(Math.random()*100<enhRate(g)){g.p++;SFX.buff();toast(`強化成功！${gearName(g)}`);if(g.p>=7)sys(`${S.name} 將【${gearName(g)}】強化成功！`)}
    else if(g.p>=7){g.p--;SFX.hurt();toast(`強化失敗，降為 +${g.p}`)}else{SFX.miss();toast('強化失敗，材料消失了')}save();render()},
  sockIn(v){const [u,gm]=v.split('|'),g=gearBy(+u);if(!g||!(S.items[gm]>0)||!(g.sock||[]).length)return;let i=g.sock.indexOf(null);if(i<0)i=0;g.sock[i]=gm;addItem(gm,-1);SFX.buff();toast(`鑲入 ${ITEMS[gm].n}`);save();render()},
  lock(u){const g=gearBy(+u);if(!g)return;g.lock=!g.lock;save();render()},
  dis(u){const g=gearBy(+u);if(!g||g.lock||Object.values(S.eq).includes(g.u))return;const [d,st]=dismantle(g);toast(`分解獲得 星塵×${d}${st?`、強化石×${st}`:''}`);save();closeM();render()},
  disAll(){const eqd=Object.values(S.eq),L=S.gear.filter(g=>g.r<=1&&!g.lock&&!eqd.includes(g.u));if(!L.length){toast('沒有可分解的普通或精良裝備');return}
    let d=0,st=0;L.forEach(g=>{const r=dismantle(g);d+=r[0];st+=r[1]});toast(`分解 ${L.length} 件，獲得星塵×${d}${st?`、強化石×${st}`:''}`);save();render()},
  reforge(u){const g=gearBy(+u);if(!canReforge(g))return;const c=reforgeCost(g);addItem('dust',-c.d);S.gold-=c.g;g.sub=rollSubs(GEAR[g.id].t,g.r);if(g.sh)shine(g);SFX.buff();toast('洗練完成，詞條已重新隨機');save();render()},
  rest(){const c=S.lv*4;if(S.gold<c)return;S.gold-=c;const s=stats();S.hp=s.HP;S.mp=s.MP;toast('睡了一覺，HP 與 MP 全滿');save();closeM();render()},
  advance(k){if(S.lv<TRIAL.lv||S.adv||!S.trial)return;S.adv=k;WARM=0;const b=ADV[k].bonus;for(const a in b)S.attr[a]+=b[a];learn();const s=stats();S.hp=s.HP;S.mp=s.MP;sys(`${S.name} 轉職為【${ADV[k].n}】！`);toast(`轉職成功：${ADV[k].n}`);save();render()},
  mainAccept(){if(!chLvOk()){toast(`需要 Lv.${CHLV[S.main.ch]}`);return}const m=S.main,c=CH[m.ch];play(c.intro,SKEY(m.ch+1,'intro'),c.t+' 開場',()=>{m.acc=true;m.step=0;m.prog=0;save();render();toast('已接受主線任務')})},
  mainDone(){if(!mainReady())return;const m=S.main,c=CH[m.ch];play(c.outro,SKEY(m.ch+1,'outro'),c.t+' 結尾',()=>{const t=give(c.rw);m.ch++;m.acc=false;m.step=0;m.prog=0;m.mid=false;m.pre=false;sys(`${S.name} 完成了「${c.t}」！`);save();render();
    openM('msg',{t:'章節完成',b:`<div class="panel"><h3>${c.t}</h3><p>獲得：${t}</p>${m.ch<CH.length?`<p class="sub">新地點「${AREAS[m.ch].n}」已開放，商店也進了新貨。</p>`:''}</div><button class="btn pri big" data-a="closeM">確定</button>`})})},
  replay(i){const c=CH[+i];play([...c.intro,...(c.mid||[]),...(c.pre||[]),...c.outro],SKEY(+i+1,'intro'),c.t,null,true)},
  dexTab(v){DEXTAB=v;drawModal()},setTitle(v){S.title=v||null;save();render();drawModal()},
  craft(v){const r=RECIPE[+v];if(!r||!canCraft(r))return;for(const k in r.need)addItem(k,-r.need[k]);S.gold-=r.g;addItem(r.out,r.n);S.st.craft=(S.st.craft||0)+1;SFX.buff();toast(`合成了 ${ITEMS[r.out].n}`);save();render();drawModal()},
  startTower(){if(!towerOpen())return;startTower()},towerNext(){if(RUN&&RUN.tower&&!B)towerNext()},
  tipOk(v){if(!S.tut)S.tut={};S.tut[v]=1;save();tipCheck()},
  lbuy(v){const e=liveNow().find(x=>x.shop);if(!e)return;if(!S.lbuy)S.lbuy={};const x=e.shop[+v],key=e.id+':'+v,tk=e.tok.id;if((S.items[tk]||0)<x.c||(S.lbuy[key]||0)>=x.lim)return;addItem(tk,-x.c);addItem(x.k,x.n);S.lbuy[key]=(S.lbuy[key]||0)+1;SFX.buff();toast(`兌換了 ${ITEMS[x.k].n}×${x.n}`);save();render();drawModal()},
  nstStart(v){nstStart(v)},nstEnd(v){nstEnd(v)},
  nstReplay(v){const q=NST.find(x=>x.id===v);if(q)play([...q.a,...(q.b||[])],q.key,`${q.npc}的故事・${q.n}`,null,true)},
  setParty(v){S.party=v;save();render()},
  evFight(){if(!RUN||!RUN.view||!RUN.view.amb)return;RUN.view.amb=0;startBattle(pick(AREAS[RUN.area].mobs),'',nAdds());render()},
  pickFork(v){if(!RUN||RUN.view.type!=='fork')return;const n=RUN.step+1;RUN.nodes[n]=RUN.view.opts[+v];RUN.tagAt=RUN.tagAt||{};RUN.tagAt[n]=((RUN.ftags||[])[n]||[])[+v]||null;runNext()},
  bless(v){if(!RUN||RUN.view.type!=='shrine'||RUN.view.done)return;RUN.bless=v;const s=stats();S.hp=Math.min(s.HP,S.hp+Math.round(s.HP*.15));RUN.view.done={atk:'劍之紋發出光芒。你感到力量湧了上來。',def:'盾之紋包覆全身，像是有人站在你身前。',luck:'星之紋閃爍了一下。今天好像會有好事。'}[v]+'（並回復少許 HP）';SFX.buff();save();render()},
  buyRun(v){const V=RUN&&RUN.view;if(!V||V.type!=='shop')return;const [k,pr]=V.items[+v];if(S.gold<pr||((k==='box'||k==='hunt')&&V.bought[k])||(k==='hunt'&&RUN.hunt))return;S.gold-=pr;
    if(k==='hunt'){V.bought.hunt=1;RUN.hunt=1;toast('記下了懸賞目標的位置——下一場戰鬥會遇上牠')}else if(k==='box'){V.bought.box=1;const g=rollGear(RUN.area,1,1.5);RUN.loot.items.push(gearName(g));toast('開出了 '+gearName(g))}else{addItem(k,1);toast(`買了 ${ITEMS[k].n}`)}SFX.ui();save();render()},
  bTarget(v){if(!B||B.busy||!B.adds||!B.adds[+v])return;swapFoe(+v);B.fx=null;render()},
  sqAccept(id){S.side[id]={prog:0,done:false};toast('已接受委託');save();render()},
  sqDone(id){const q=SQ.find(x=>x.id===id);if(sqProg(q)<q.c)return;if(q.type==='item')addItem(q.item,-q.c);S.side[id].done=true;const t=give(q.rw);toast(`委託完成：${t}`);save();render()},
  dailyGet(k){const d=DAILY.find(x=>x.k===k);if(S.daily.got[k]||S.daily[k]<d.c)return;S.daily.got[k]=true;toast('獲得 '+give(d.rw));save();render()},
  bgmT(){BGMOFF=!BGMOFF;try{localStorage.setItem(KEY+'_bgm',BGMOFF?'0':'1')}catch(e){}if(BGMOFF)bgm(null);else bgmAuto();drawModal()},
  shakeT(){SHAKEOFF=!SHAKEOFF;try{localStorage.setItem(KEY+'_shake',SHAKEOFF?'0':'1')}catch(e){}document.body.classList.toggle('noshake',SHAKEOFF);drawModal()},
  mute(){MUTE=!MUTE;try{localStorage.setItem(KEY+'_mute',MUTE?'1':'0')}catch(e){}drawModal()},
  storyNext(){stNext()},storyPick(v){storyPick(+v)},storySkip(){storyEnd()},
  copyArt(){const t=$('#artTxt');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('已複製插畫清單'),()=>toast('請長按文字框手動複製'))}catch(e){toast('請長按文字框手動複製')}},
  exportSave(){try{S.lastExport=Date.now()}catch(e){}try{const c=saveCode();$('#saveTxt').value=c;try{navigator.clipboard.writeText(c);toast('存檔碼已複製，請貼到記事本保存')}catch(e){toast('已產生存檔碼，請手動複製')}}catch(e){toast('產生失敗')}},
  importSave(){const t=$('#saveTxt').value.trim();let o=loadCode(t);if(!o){try{o=JSON.parse(decodeURIComponent(escape(atob(t))));if(!o||!o.cls||!o.attr)o=null}catch(e){o=null}}
    if(!o){toast('存檔碼無效，請確認是否完整貼上');return}if(IMPOK!==t){IMPOK=t;toast(`讀到「${o.name}」Lv.${o.lv}。會覆蓋目前進度，確定的話再按一次`);return}
    IMPOK=null;S=o;migrate();RUN=null;B=null;checkDaily();save();closeM();TAB='town';render();toast('讀取成功')},
  reset(v){if(v==='ask'){MODAL.v='sure';drawModal();return}try{localStorage.removeItem(KEY)}catch(e){}S=null;RUN=null;B=null;MODAL=null;drawModal();render()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeM();return}
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(f)f(t.dataset.v,t)});

/* ============ 全自動：隨機路線、自動點擊 ============ */
let FA=null;
function faDraw(){const b=$('#fab');if(!b)return;b.hidden=!S||(!RUN&&!FA);b.className=FA?'on':'';b.textContent=FA?'全自動 開':'全自動 關'}
function faStop(m){if(!FA)return;FA=null;if(B){B.auto=AUTO=false}faDraw();if(m)toast(m)}
function faClick(sel,rnd){const bs=[...document.querySelectorAll(sel)].filter(b=>!b.disabled&&b.offsetParent!==null);if(!bs.length)return false;(rnd?pick(bs):bs[0]).click();return true}
function faDice(sel,lab){const bs=[...document.querySelectorAll(sel)].filter(b=>!b.disabled&&b.offsetParent!==null);if(bs.length<2)return faClick(sel);FA.busy=1;
  const ov=document.createElement('div');ov.className='fadice';ov.innerHTML=`<div class="fd-box"><div class="fd-t">${lab||'命運的骰子'}</div><div class="fd-die">1</div><div class="fd-r">1～3 走左邊　4～6 走右邊</div></div>`;document.body.appendChild(ov);
  const die=ov.querySelector('.fd-die'),d=1+Math.floor(Math.random()*6);let n=0;FA.dv={ov};const iv=FA.dv.iv=setInterval(()=>{die.textContent=1+Math.floor(Math.random()*6);die.style.transform=`rotate(${Math.random()*40-20}deg) scale(${.9+Math.random()*.2})`;if(++n>=16){clearInterval(iv);die.textContent=d;die.style.transform='';die.classList.add('done');const right=d>3,b=right?bs[bs.length-1]:bs[0];ov.querySelector('.fd-r').innerHTML=`擲出 <b>${d}</b>　→　<b>${right?'右邊':'左邊'}</b>`;b.classList.add('fd-pick');
    FA.dv.tm=setTimeout(()=>{ov.remove();if(FA){FA.busy=0;FA.dv=null;if(b.isConnected)b.click()}},1300)}},90);return true}
/* 全自動中玩家自己點了選項：取消骰子，照玩家的選擇走 */
function faCancelDice(){if(!FA||!FA.dv)return;clearInterval(FA.dv.iv);clearTimeout(FA.dv.tm);FA.dv.ov.remove();FA.dv=null;FA.busy=0}
document.addEventListener('click',e=>{if(!e.isTrusted||!FA)return;const t=e.target.closest&&e.target.closest('[data-a="pickFork"],[data-a="evPick"],[data-a="storyPick"]');if(t){faCancelDice();FA.hold=Date.now()}},true);
function faDelay(){if(!FA)return 1100;if(MODAL||($('#story')&&!$('#story').hidden))return 4400;if(RUN&&RUN.view&&['fork','event','shrine','gate'].includes(RUN.view.type))return 4400;return 2200}
function faLoop(){try{faTick()}catch(e){}setTimeout(faLoop,faDelay())}
function faTick(){faDraw();if(!FA||!S||FA.busy)return;if(FA.hold&&Date.now()-FA.hold<1500)return;
  if(faClick('#tip [data-a="tipOk"]'))return;
  const st=$('#story');if(st&&!st.hidden){(document.querySelector('#story [data-a="storyPick"]')&&faDice('#story [data-a="storyPick"]','劇情抉擇'))||faClick('#story [data-a="storyNext"]');return}
  if(MODAL){if(B&&MODAL.k==='foe')return;if(B&&MODAL.k!=='msg'){closeM();return}faClick('#modal .sheet-b [data-a="closeM"].pri')||faClick('#modal .x');return}
  if(B){if(!B.auto){B.auto=AUTO=true;render();setTimeout(autoAct,200)}return}
  if(RUN){if(TAB!=='adv'){TAB='adv';render();return}
    if(RUN.view&&RUN.view.type==='gate'){const L=MOBS[AREAS[RUN.area].boss].lv+(RUN.nm?10:0),st=stats();if((!S.cleared[RUN.area]&&S.lv<L-1)||(S.hp<st.HP*.35&&!S.items.pot&&!S.items.pot2)){toast('全自動：首領太強，先撤退練功');faClick('#main [data-a="retreat"]')}else{if(!RUN.prep){if(S.hp<st.HP*.6)doPrep('camp');else if(S.gold>=prepCost(L)*3)doPrep('scout');else if((S.items.pot||0)>2)doPrep('trap')}faClick('#main [data-a="bossGo"]')}return}
    faClick('#main [data-a="bossBox"]',1)||(document.querySelector('#main [data-a="pickFork"]')&&faDice('#main [data-a="pickFork"]','岔路'))||(document.querySelector('#main [data-a="evPick"]')&&faDice('#main [data-a="evPick"]','事件抉擇'))||faClick('#main [data-a="evFight"]')||faClick('#main [data-a="bless"]',1)||faClick('#main [data-a="runNext"]')||faClick('#main [data-a="towerNext"]')||faClick('#main [data-a="finish"]');return}
  /* 回城：休息後重新出發同一地區 */
  const s=stats();if(S.hp<s.HP*.7||S.mp<s.MP*.5){const c=S.lv*4;if(S.gold<c){faStop('金幣不足以休息，全自動停止');return}ACT.rest();return}
  if(FA.tower){faStop('高塔挑戰結束');return}
  TAB='adv';startRun(FA.area,FA.nm)}
ACT.fullAuto=()=>{if(FA){faStop('全自動已關閉');return}
  if(RUN)FA={area:RUN.area,nm:!!RUN.nm,tower:!!RUN.tower};
  else{let i=0;AREAS.forEach((a,k)=>{if(S.main.ch>=k&&a.base<=S.lv+2)i=k});FA={area:i,nm:false,tower:false}}
  toast('全自動開啟：隨機選路，自動戰鬥');faDraw();faTick()};
{const _lose=lose;lose=function(){_lose.apply(this,arguments);faStop('戰敗，全自動停止')}}
faLoop();
document.body.classList.toggle('noshake',SHAKEOFF);

/* ============ 啟動 ============ */
load();if(S){migrate();checkDaily();learn(true)}
render();chatTick();setInterval(chatTick,4000);setTimeout(bcastCheckSeen,1200);
</script>
<script>if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
